<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layout Overlap Clean Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #title, #caption { position: absolute; left: 6vw; right: 6vw; }
  #title { top: 8vh; font-size: 48px; font-weight: 700; }
  #caption { bottom: 10vh; font-size: 28px; color: #c5d0dc; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="title"></div>
    <div id="caption"></div>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "Layout Overlap Clean Fixture",
      aspectRatio: "16:9"
    };
    window.__VIDEO_PLAN__ = [
      {
        id: "clean_1",
        kind: "visual-only",
        duration: 3
      },
      {
        id: "clean_2",
        kind: "narration+visual",
        audio: "audio/clean_2.wav",
        text: "A spaced layout with a canvas panel and separate DOM labels should pass overlap QA."
      }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const title = document.getElementById("title");
    const caption = document.getElementById("caption");

    function renderSection(segment, localTime) {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);

      ctx.fillStyle = "#1c2a36";
      ctx.fillRect(120, 280, 700, 420);
      ctx.fillStyle = "#f4f7fb";
      ctx.font = "700 36px Georgia, serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Canvas panel", 160, 320);

      title.textContent = "Clean layout fixture";
      title.style.opacity = "1";
      caption.textContent = segment.id === "clean_2"
        ? "DOM caption stays in the bottom band."
        : "Title stays above the canvas panel.";
      caption.style.opacity = "1";
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
