<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Narration Benchmark</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #111827;
  color: #f8fafc;
}

body.export-mode *,
body.export-mode *::before,
body.export-mode *::after {
  animation: none !important;
  transition: none !important;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
    linear-gradient(0deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
    #111827;
  background-size: 42px 42px;
}

#headline {
  position: absolute;
  left: 48px;
  right: 48px;
  top: 40px;
  font-size: 46px;
  line-height: 1.02;
  font-weight: 900;
  letter-spacing: 0;
}

#caption {
  position: absolute;
  left: 48px;
  right: 48px;
  bottom: 44px;
  min-height: 70px;
  font-size: 24px;
  line-height: 1.25;
  color: #dbeafe;
}

#track {
  position: absolute;
  left: 62px;
  right: 62px;
  top: 238px;
  height: 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.16);
}

#fill {
  width: 0%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #38bdf8, #facc15, #22c55e);
}

#marker {
  position: absolute;
  left: 62px;
  top: 245px;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #facc15;
  box-shadow: 0 0 36px rgba(250, 204, 21, 0.58);
  transform: translate(-50%, -50%);
}

#cards {
  position: absolute;
  left: 48px;
  right: 48px;
  top: 315px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.card {
  height: 94px;
  padding: 14px 16px;
  border: 2px solid rgba(255, 255, 255, 0.13);
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.74);
  font-size: 20px;
  line-height: 1.18;
}

.card strong {
  display: block;
  margin-bottom: 7px;
  color: #7dd3fc;
}
</style>
</head>
<body>
<div id="stage">
  <div id="headline"></div>
  <div id="track"><div id="fill"></div></div>
  <div id="marker"></div>
  <div id="cards">
    <div class="card"><strong>01</strong><span id="card-a"></span></div>
    <div class="card"><strong>02</strong><span id="card-b"></span></div>
    <div class="card"><strong>03</strong><span id="card-c"></span></div>
  </div>
  <div id="caption"></div>
</div>

<script>
const VIDEO_PLAN = [
  {
    id: "first-pass",
    kind: "narration+visual",
    audio: "audio/first-pass.wav",
    text: "This benchmark renders narration and visuals together at a small resolution."
  },
  {
    id: "sync-check",
    kind: "narration+visual",
    audio: "audio/sync-check.wav",
    text: "The marker, cards, and caption all use the same resolved audio timeline."
  }
];

window.__VIDEO_PLAN__ = VIDEO_PLAN;

const UI = {
  "first-pass": {
    headline: "480p Narration Benchmark",
    cards: ["plan loaded", "audio measured", "frames captured"]
  },
  "sync-check": {
    headline: "Audio + Visual Sync",
    cards: ["timeline resolved", "audio muxed", "mp4 encoded"]
  }
};

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function ease(value) {
  value = clamp(value, 0, 1);
  return value * value * (3 - 2 * value);
}

function renderSection(segment, localTime, globalTime) {
  const duration = Number(segment.resolvedDuration || 4);
  const progress = clamp(localTime / Math.max(duration, 0.001), 0, 1);
  const smooth = ease(progress);
  const data = UI[segment.id] || UI["first-pass"];

  document.getElementById("headline").textContent = data.headline;
  document.getElementById("caption").textContent = segment.text;
  document.getElementById("fill").style.width = `${smooth * 100}%`;
  document.getElementById("marker").style.left = `${62 + smooth * (window.innerWidth - 124)}px`;
  document.getElementById("marker").style.top = `${245 + Math.sin(globalTime * 4.2) * 34}px`;

  const cards = ["card-a", "card-b", "card-c"];
  for (let i = 0; i < cards.length; i++) {
    const visible = progress >= i / cards.length;
    const node = document.getElementById(cards[i]);
    node.textContent = visible ? data.cards[i] : "";
    node.parentElement.style.opacity = visible ? "1" : "0.28";
    node.parentElement.style.transform = `translateY(${visible ? 0 : 12}px)`;
  }
}

window.__RENDER_SECTION__ = renderSection;

const params = new URLSearchParams(window.location.search);
if (params.get("export") === "1") {
  document.body.classList.add("export-mode");
}

document.addEventListener("DOMContentLoaded", () => {
  renderSection(VIDEO_PLAN[0], 0, 0);
});
</script>
</body>
</html>
