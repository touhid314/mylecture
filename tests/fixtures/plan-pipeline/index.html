// Drawing Helper for Grid Lines within a square defined by 4 vertices
function getGridPath(p1, p2, p3, p4, divisions) {
  let d = '';
  // Interpolate grid lines between edges
  for (let i = 1; i < divisions; i++) {
    let ratio = i / divisions;
    // Line along one direction
    let startX1 = p1.x + ratio * (p2.x - p1.x);
    let startY1 = p1.y + ratio * (p2.y - p1.y);
    let endX1 = p4.x + ratio * (p3.x - p4.x);
    let endY1 = p4.y + ratio * (p3.y - p4.y);
    d += `M ${startX1} ${startY1} L ${endX1} ${endY1} `;
    
    // Line along perpendicular direction
    let startX2 = p1.x + ratio * (p4.x - p1.x);
    let startY2 = p1.y + ratio * (p4.y - p1.y);
    let endX2 = p2.x + ratio * (p3.x - p2.x);
    let endY2 = p2.y + ratio * (p3.y - p2.y);
    d += `M ${startX2} ${startY2} L ${endX2} ${endY2} `;
  }
  return d;
}

function renderSection(segment, localTime, globalTime) {
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  const t = localTime;

  // Common elements config

  const ax = 550, ay = 410; // Vertex A (top left of triangle)

  const pB = { x: bx, y: by };

  // Squares points outward

  const pB4 = pC;

  // Square C on hypotenuse c (top-right outward perpendicular vector: 240, -320)

  const pC2 = { x: ax + 240, y: ay - 320 };
  const pC3 = { x: cx + 240, y: cy - 320 };
  const pC4 = pC;

  // Intro visual
  if (segment.id === "intro") {
    // Title & Hook style animations
    const opacity = Math.min(1, t / 1.0);

      <div class="main-text" style="top: 450px; left: 150px; width: 1620px; text-align: center; opacity: ${opacity}; line-height: 1.8;">

        <span style="color: var(--yellow); font-size: 52px;">Today, we are unlocking the secret!</span>

    `;
    return;
  }

  // Render geometry and calculations dynamically
  let svgContent = "";
  let formulaHTML = "";

  // Base Triangle opacity
  let triOpacity = 1;
  let rightAngleOpacity = 0;
  let legA_Highlight = false;
  let legB_Highlight = false;
  let hyp_Highlight = false;
  let showLabels = false;
  let labelA_text = "a";
  let labelB_text = "b";
  let labelC_text = "c";

  // Squares variables
  let sqA_Opacity = 0;
  let sqB_Opacity = 0;
  let sqC_Opacity = 0;

  // Formula Box variables
  let showFormulaBox = false;
  let formulaStep = 0; // 0: clear, 1: a2+b2=c2, 2: values plug, 3: nine + sixteen, 4: sum, 5: sqrt, 6: final

    legB_Highlight = t > 4.0;
    showLabels = true;
    labelC_text = ""; // Not yet introduced
  } else if (segment.id === "triangle_hypotenuse") {
    rightAngleOpacity = 1;
    showLabels = true;
    hyp_Highlight = t > 1.0;
  } else if (segment.id === "formula_intro") {
    rightAngleOpacity = 1;
    showLabels = true;
    showFormulaBox = true;
    formulaStep = 1;
  } else if (segment.id === "example_plug") {
    rightAngleOpacity = 1;
    showLabels = true;
    labelA_text = "a = 3";
    labelB_text = "b = 4";
    labelC_text = "c = ?";
    showFormulaBox = true;
    formulaStep = 1;
  } else if (segment.id === "calc_plug") {
    rightAngleOpacity = 1;
    showLabels = true;
    labelA_text = "a = 3";
    labelB_text = "b = 4";
    labelC_text = "c = ?";
    showFormulaBox = true;
    formulaStep = 2;
  } else if (segment.id === "calc_add") {
    rightAngleOpacity = 1;
    showLabels = true;
    labelA_text = "a = 3";
    labelB_text = "b = 4";
    labelC_text = "c = ?";
    showFormulaBox = true;
    formulaStep = 3;
  } else if (segment.id === "calc_sqrt") {

    showLabels = true;
    labelA_text = "a = 3";
    labelB_text = "b = 4";
    labelC_text = "c = ?";
    showFormulaBox = true;
    formulaStep = 4;

    showLabels = true;
    labelA_text = "a = 3";
    labelB_text = "b = 4";
    labelC_text = "c = 5";
    showFormulaBox = true;

    rightAngleOpacity = 1;
    showLabels = true;
    labelA_text = "a = 3";
    labelB_text = "b = 4";
    labelC_text = "c = 5";

    showLabels = true;

  // Compile SVG Content representing the right triangle, right angle box, labels, squares, and grids

  // Draw Triangle Edges with optional color highlighting
  const strokeA = legA_Highlight ? "var(--red)" : "var(--fg)";
  const strokeB = legB_Highlight ? "var(--blue)" : "var(--fg)";
  const strokeC = hyp_Highlight ? "var(--green)" : "var(--fg)";
  const widthA = legA_Highlight ? 8 : 4;
  const widthB = legB_Highlight ? 8 : 4;
  const widthC = hyp_Highlight ? 8 : 4;

  svgContent += `
    <!-- Triangle Paths -->
    <g opacity="${triOpacity}">
      <line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${strokeA}" stroke-width="${widthA}" />
      <line x1="${bx}" y1="${by}" x2="${cx}" y2="${cy}" stroke="${strokeB}" stroke-width="${widthB}" />
      <line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="${strokeC}" stroke-width="${widthC}" />
    </g>
  `;

  // Drawing Side Labels dynamically based on state
  if (showLabels) {
    svgContent += `
      <text x="${ax - 35}" y="${(ay + by)/2 + 10}" text-anchor="end" class="label-text" style="font-size: 34px; font-weight: ${legA_Highlight ? 'bold' : 'normal'}; fill: ${legA_Highlight ? 'var(--red)' : 'var(--fg)'};">${labelA_text}</text>
      <text x="${(bx + cx)/2}" y="${by + 45}" text-anchor="middle" class="label-text" style="font-size: 34px; font-weight: ${legB_Highlight ? 'bold' : 'normal'}; fill: ${legB_Highlight ? 'var(--blue)' : 'var(--fg)'};">${labelB_text}</text>
      <text x="${(ax + cx)/2 + 35}" y="${(ay + cy)/2 - 25}" text-anchor="start" class="label-text" style="font-size: 34px; font-weight: ${hyp_Highlight ? 'bold' : 'normal'}; fill: ${hyp_Highlight ? 'var(--green)' : 'var(--fg)'};">${labelC_text}</text>
    `;
  }

  svgContent += `</svg>`;

  stage.innerHTML = svgContent + formulaHTML;
}
