<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renderer Compatible Full Example</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #0f131a;
  color: white;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  background:
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px),
    #0f131a;
  background-size: 64px 64px;
}

#title {
  position: absolute;
  top: 58px;
  left: 70px;
  right: 70px;
  font-size: 48px;
  line-height: 1.08;
  font-weight: 800;
}

#subtitle {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 86px;
  min-height: 82px;
  padding: 18px 24px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 8px;
  background: rgba(0,0,0,0.55);
  font-size: 28px;
  line-height: 1.3;
  color: #e8f0ff;
}

#canvas {
  position: absolute;
  left: 70px;
  right: 70px;
  top: 170px;
  bottom: 210px;
}

.node {
  position: absolute;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 28px;
  font-weight: 800;
  background: #1c2633;
  border: 4px solid #4b9fff;
  box-shadow: 0 0 26px rgba(75,159,255,0.45);
  transform: translate(-50%, -50%);
}

#probe {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #f6c44f;
  box-shadow: 0 0 28px rgba(246,196,79,0.8);
  transform: translate(-50%, -50%);
}

#path {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#progress {
  position: absolute;
  left: 70px;
  right: 70px;
  bottom: 42px;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.14);
  overflow: hidden;
}

#progress-fill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #4b9fff, #38d39f, #f6c44f);
}

#controls {
  position: fixed;
  left: 50%;
  bottom: 18px;
  z-index: 10;
  display: flex;
  gap: 12px;
  width: min(760px, calc(100vw - 32px));
  padding: 10px;
  border-radius: 8px;
  background: rgba(0,0,0,0.75);
  transform: translateX(-50%);
}

#play-toggle { min-width: 74px; }
#scrubber { flex: 1; }
#readout { min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }

body.hide-controls #controls { display: none; }
body.export-mode * { animation: none !important; transition-duration: 0s !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="title"></div>
  <div id="canvas">
    <svg id="path" viewBox="0 0 1000 520" preserveAspectRatio="none">
      <path id="track" d="M 80 380 C 240 100, 420 110, 500 260 S 760 430, 920 120" fill="none" stroke="rgba(255,255,255,0.17)" stroke-width="12" stroke-linecap="round" />
      <path id="active-track" d="M 80 380 C 240 100, 420 110, 500 260 S 760 430, 920 120" fill="none" stroke="#38d39f" stroke-width="12" stroke-linecap="round" />
    </svg>
    <div id="node-a" class="node">A</div>
    <div id="node-b" class="node">B</div>
    <div id="node-c" class="node">C</div>
    <div id="probe"></div>
  </div>
  <div id="subtitle"></div>
  <div id="progress"><div id="progress-fill"></div></div>
</div>

<div id="controls">
  <button id="play-toggle" type="button">Play</button>
  <input id="scrubber" type="range" min="0" max="1" step="0.01" value="0">
  <span id="readout">0.00 / 0.00</span>
</div>

<script>
const VIDEO_PLAN = [
  {
    id: "intro",
    kind: "narration+visual",
    audio: "audio/intro.wav",
    text: "Today we will follow a value as it moves through a simple three step process.",
    title: "Three Step Process",
    subtitle: "Today we will follow a value as it moves through a simple three step process."
  },
  {
    id: "setup-animation",
    kind: "narration+visual",
    audio: "audio/setup-animation.wav",
    text: "Now let's look at this animation. The yellow marker will travel from A to B to C without any narration.",
    title: "Watch the Motion",
    subtitle: "Now let's look at this animation. The yellow marker will travel from A to B to C without any narration."
  },
  {
    id: "animation-only",
    kind: "visual-only",
    duration: 6,
    title: "Animation Only",
    subtitle: ""
  },
  {
    id: "observation",
    kind: "narration+visual",
    audio: "audio/observation.wav",
    text: "As you can see, the marker pauses briefly at each stage, which makes the flow easier to read.",
    title: "What We Observed",
    subtitle: "As you can see, the marker pauses briefly at each stage, which makes the flow easier to read."
  },
  {
    id: "ending",
    kind: "visual-only",
    duration: 4,
    title: "Done",
    subtitle: "A short silent ending can hold the final state."
  }
];

window.__VIDEO_PLAN__ = VIDEO_PLAN;

let activeTime = 0;
const playback = { playing: false, startedAt: 0, rafId: null, audio: null, audioCueIndex: -1 };
let pathLength = 1;

function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
function ease(value) { value = clamp(value, 0, 1); return 0.5 - Math.cos(value * Math.PI) / 2; }

function setNode(id, x, y, scale) {
  const el = document.getElementById(id);
  el.style.left = `${x}%`;
  el.style.top = `${y}%`;
  el.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function setProbeOnPath(progress) {
  const path = document.getElementById("track");
  const point = path.getPointAtLength(pathLength * clamp(progress, 0, 1));
  const probe = document.getElementById("probe");
  probe.style.left = `${point.x / 10}%`;
  probe.style.top = `${point.y / 5.2}%`;
}

function renderSection(segment, localTime, globalTime) {
  const duration = segment.resolvedDuration || segment.duration || 4;
  const p = ease(localTime / duration);
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const activeTrack = document.getElementById("active-track");

  title.textContent = segment.title;
  subtitle.textContent = segment.subtitle || "";

  setNode("node-a", 12, 73, 1);
  setNode("node-b", 50, 50, 1);
  setNode("node-c", 88, 23, 1);

  if (segment.id === "intro") {
    setProbeOnPath(0.08 + p * 0.12);
    setNode("node-a", 12, 73, 1 + 0.16 * Math.sin(localTime * 4));
  } else if (segment.id === "setup-animation") {
    setProbeOnPath(0.2 + p * 0.12);
    setNode("node-a", 12, 73, 1.12);
    setNode("node-b", 50, 50, 1.05);
  } else if (segment.id === "animation-only") {
    setProbeOnPath(p);
    const glow = Math.sin(localTime * Math.PI);
    setNode("node-a", 12, 73, 1 + Math.max(0, 1 - p * 3) * 0.22);
    setNode("node-b", 50, 50, 1 + Math.max(0, 1 - Math.abs(p - 0.5) * 5) * 0.24);
    setNode("node-c", 88, 23, 1 + Math.max(0, (p - 0.7) * 3) * 0.22);
    subtitle.textContent = "";
  } else if (segment.id === "observation") {
    setProbeOnPath(1);
    setNode("node-c", 88, 23, 1.2 + 0.08 * Math.sin(localTime * 5));
  } else {
    setProbeOnPath(1);
    setNode("node-a", 12, 73, 1);
    setNode("node-b", 50, 50, 1);
    setNode("node-c", 88, 23, 1.16);
  }

  const globalProgress = window.__VIDEO_DURATION__ ? activeTime / window.__VIDEO_DURATION__ : 0;
  activeTrack.style.strokeDasharray = `${Math.max(1, pathLength * globalProgress)} ${pathLength}`;
  document.getElementById("progress-fill").style.width = `${globalProgress * 100}%`;
}

window.__RENDER_SECTION__ = renderSection;

function buildDraftTimeline() {
  let cursor = 0;
  const videoTimeline = [];
  const audioTimeline = [];

  for (const segment of VIDEO_PLAN) {
    const duration = segment.kind === "visual-only" ? segment.duration : 4;
    const item = { ...segment, resolvedDuration: duration };
    videoTimeline.push({ start: cursor, end: cursor + duration, duration, sectionId: segment.id, item });
    if (segment.kind === "narration+visual") {
      audioTimeline.push({ start: cursor, duration, src: segment.audio, text: segment.text, sectionId: segment.id });
    }
    cursor += duration;
  }

  return { duration: cursor, videoTimeline, audioTimeline };
}

function installTimeline(timeline) {
  window.__VIDEO_DURATION__ = timeline.duration;
  window.__VIDEO_TIMELINE__ = timeline.videoTimeline;
  window.__AUDIO_TIMELINE__ = timeline.audioTimeline;

  window.renderAt = function renderAt(time) {
    activeTime = clamp(Number(time) || 0, 0, window.__VIDEO_DURATION__);
    let cue = window.__VIDEO_TIMELINE__[0];
    for (const candidate of window.__VIDEO_TIMELINE__) {
      if (candidate.start <= activeTime) cue = candidate;
      if (candidate.start > activeTime) break;
    }
    window.__RENDER_SECTION__(cue.item, activeTime - cue.start, activeTime);
    updateControls();
    return activeTime;
  };

  window.renderAt(0);
}

function getAudioCueIndexAt(time) {
  const cues = window.__AUDIO_TIMELINE__ || [];
  for (let i = cues.length - 1; i >= 0; i--) {
    const cue = cues[i];
    if (cue.start <= time && time < cue.start + cue.duration) return i;
  }
  return -1;
}

function stopAudio() {
  if (playback.audio) {
    playback.audio.pause();
    playback.audio = null;
  }
}

function syncAudio(time) {
  const index = getAudioCueIndexAt(time);
  if (index === playback.audioCueIndex) return;
  stopAudio();
  playback.audioCueIndex = index;
  if (!playback.playing || index < 0) return;
  const cue = window.__AUDIO_TIMELINE__[index];
  const audio = new Audio(cue.src);
  audio.currentTime = Math.max(0, time - cue.start);
  playback.audio = audio;
  audio.play().catch(() => {});
}

function tick() {
  if (!playback.playing) return;
  window.renderAt((performance.now() / 1000) - playback.startedAt);
  syncAudio(activeTime);
  if (activeTime >= window.__VIDEO_DURATION__) { pause(); return; }
  playback.rafId = requestAnimationFrame(tick);
}

function play() {
  if (activeTime >= window.__VIDEO_DURATION__) window.renderAt(0);
  playback.playing = true;
  playback.audioCueIndex = -1;
  playback.startedAt = (performance.now() / 1000) - activeTime;
  document.getElementById("play-toggle").textContent = "Pause";
  tick();
}

function pause() {
  playback.playing = false;
  cancelAnimationFrame(playback.rafId);
  playback.audioCueIndex = -1;
  stopAudio();
  document.getElementById("play-toggle").textContent = "Play";
}

function updateControls() {
  const total = window.__VIDEO_DURATION__ || 1;
  document.getElementById("scrubber").max = total.toFixed(2);
  document.getElementById("scrubber").value = activeTime.toFixed(2);
  document.getElementById("readout").textContent = `${activeTime.toFixed(2)} / ${total.toFixed(2)}`;
}

document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get("controls") === "0" || params.get("export") === "1") document.body.classList.add("hide-controls");
  if (params.get("export") === "1") document.body.classList.add("export-mode");

  pathLength = document.getElementById("track").getTotalLength();
  installTimeline(window.__RESOLVED_TIMELINE__ || buildDraftTimeline());

  document.getElementById("play-toggle").addEventListener("click", () => playback.playing ? pause() : play());
  document.getElementById("scrubber").addEventListener("input", event => {
    window.renderAt(Number(event.target.value));
    playback.startedAt = (performance.now() / 1000) - activeTime;
    playback.audioCueIndex = -1;
    stopAudio();
    if (playback.playing) syncAudio(activeTime);
  });
});
</script>
</body>
</html>
