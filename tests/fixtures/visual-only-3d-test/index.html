<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Only 3D Renderer Test</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #05070b;
  color: #f8fafc;
}

body.export-mode *,
body.export-mode *::before,
body.export-mode *::after {
  animation: none !important;
  transition: none !important;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #05070b;
}

#scene {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#hud {
  position: absolute;
  left: 4vw;
  right: 4vw;
  top: 4vh;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: start;
  gap: 28px;
  pointer-events: none;
}

#label {
  max-width: 950px;
  font-size: clamp(38px, 5vw, 96px);
  line-height: 0.96;
  font-weight: 900;
  letter-spacing: 0;
}

#readout {
  min-width: 210px;
  padding: 18px 22px;
  border: 2px solid rgba(255, 255, 255, 0.18);
  border-radius: 8px;
  background: rgba(5, 7, 11, 0.74);
  font-size: clamp(20px, 1.8vw, 38px);
  line-height: 1.2;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

#notes {
  position: absolute;
  left: 4vw;
  right: 4vw;
  bottom: 6vh;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  pointer-events: none;
}

.note {
  min-height: 88px;
  padding: 16px 18px;
  border: 2px solid rgba(255, 255, 255, 0.13);
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.66);
  font-size: clamp(17px, 1.3vw, 30px);
  line-height: 1.22;
}

.note strong {
  display: block;
  margin-bottom: 8px;
  color: #67e8f9;
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div id="hud">
    <div id="label"></div>
    <div id="readout"></div>
  </div>
  <div id="notes">
    <div class="note"><strong>Mode</strong><span id="note-a"></span></div>
    <div class="note"><strong>Motion</strong><span id="note-b"></span></div>
    <div class="note"><strong>Render</strong><span id="note-c"></span></div>
  </div>
</div>

<script>
const VIDEO_PLAN = [
  {
    id: "orbital-field",
    kind: "visual-only",
    duration: 10
  },
  {
    id: "crystal-city",
    kind: "visual-only",
    duration: 10
  },
  {
    id: "data-vortex",
    kind: "visual-only",
    duration: 10
  }
];

window.__VIDEO_PLAN__ = VIDEO_PLAN;

const SECTION_UI = {
  "orbital-field": {
    label: "Orbital Field",
    a: "300 moving particles",
    b: "camera orbit + wave field",
    c: "visual-only"
  },
  "crystal-city": {
    label: "Crystal City",
    a: "extruded towers",
    b: "grid pulse + flythrough",
    c: "visual-only"
  },
  "data-vortex": {
    label: "Data Vortex",
    a: "spiral stream",
    b: "radial compression",
    c: "visual-only"
  }
};

window.__RENDER_SECTION__ = function renderSection(segment, localTime, globalTime) {
  if (typeof window.__THREE_RENDER_SECTION__ === "function") {
    window.__THREE_RENDER_SECTION__(segment, localTime, globalTime);
  } else {
    window.__PENDING_RENDER__ = [segment, localTime, globalTime];
  }
};

const params = new URLSearchParams(window.location.search);
if (params.get("export") === "1") {
  document.body.classList.add("export-mode");
}
</script>

<script type="module">
import * as THREE from "../../../node_modules/three/build/three.module.js";

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  preserveDrawingBuffer: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(1);
renderer.setClearColor(0x05070b, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.025);

const camera = new THREE.PerspectiveCamera(48, 16 / 9, 0.1, 260);
const root = new THREE.Group();
const particleRoot = new THREE.Group();
const cityRoot = new THREE.Group();
const vortexRoot = new THREE.Group();
scene.add(root, particleRoot, cityRoot, vortexRoot);

const ambient = new THREE.AmbientLight(0x7dd3fc, 0.42);
const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(12, 16, 10);
const rim = new THREE.PointLight(0xfacc15, 3.5, 90);
rim.position.set(-18, 9, -14);
scene.add(ambient, key, rim);

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];
for (let i = 0; i < 1400; i++) {
  const radius = 42 + Math.random() * 160;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPositions.push(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.sin(phi) * Math.sin(theta),
    radius * Math.cos(phi)
  );
}
starGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPositions, 3));
const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.18, transparent: true, opacity: 0.78 })
);
scene.add(stars);

const sphereMaterial = new THREE.MeshStandardMaterial({
  color: 0x38bdf8,
  emissive: 0x0f5f8a,
  emissiveIntensity: 0.9,
  roughness: 0.28,
  metalness: 0.34
});

const hotMaterial = new THREE.MeshStandardMaterial({
  color: 0xfacc15,
  emissive: 0x7c4d00,
  emissiveIntensity: 0.9,
  roughness: 0.22,
  metalness: 0.38
});

const greenMaterial = new THREE.MeshStandardMaterial({
  color: 0x22c55e,
  emissive: 0x064e3b,
  emissiveIntensity: 0.75,
  roughness: 0.32,
  metalness: 0.28
});

const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x172033,
  emissive: 0x0f172a,
  emissiveIntensity: 0.25,
  roughness: 0.48,
  metalness: 0.18
});

const orbGeometry = new THREE.IcosahedronGeometry(0.34, 2);
const orbs = [];
for (let i = 0; i < 300; i++) {
  const mesh = new THREE.Mesh(orbGeometry, i % 7 === 0 ? hotMaterial : sphereMaterial);
  mesh.userData.seed = i;
  mesh.userData.band = i % 12;
  particleRoot.add(mesh);
  orbs.push(mesh);
}

const core = new THREE.Mesh(new THREE.IcosahedronGeometry(3.6, 3), hotMaterial);
root.add(core);

const ringGeometry = new THREE.TorusGeometry(8, 0.035, 8, 192);
for (let i = 0; i < 9; i++) {
  const ring = new THREE.Mesh(ringGeometry, i % 2 ? greenMaterial : sphereMaterial);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.y = i * 0.18;
  ring.scale.setScalar(0.54 + i * 0.18);
  root.add(ring);
}

const towerGeometry = new THREE.BoxGeometry(0.85, 1, 0.85);
const towers = [];
for (let x = -8; x <= 8; x++) {
  for (let z = -8; z <= 8; z++) {
    if ((x + z) % 2 !== 0) continue;
    const mesh = new THREE.Mesh(towerGeometry, darkMaterial);
    mesh.position.set(x * 1.25, 0, z * 1.25);
    mesh.userData.x = x;
    mesh.userData.z = z;
    cityRoot.add(mesh);
    towers.push(mesh);
  }
}

const grid = new THREE.GridHelper(28, 34, 0x38bdf8, 0x1f2937);
grid.position.y = -0.05;
cityRoot.add(grid);

const vortexGeometry = new THREE.ConeGeometry(0.26, 0.9, 7);
const vortexItems = [];
for (let i = 0; i < 420; i++) {
  const mesh = new THREE.Mesh(vortexGeometry, i % 5 === 0 ? hotMaterial : greenMaterial);
  mesh.userData.seed = i;
  vortexRoot.add(mesh);
  vortexItems.push(mesh);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function ease(value) {
  value = clamp(value, 0, 1);
  return value * value * (3 - 2 * value);
}

function resizeRenderer() {
  const width = canvas.clientWidth || window.innerWidth;
  const height = canvas.clientHeight || window.innerHeight;
  if (canvas.width !== width || canvas.height !== height) {
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
}

function setUi(segment, localTime) {
  const data = SECTION_UI[segment.id] || SECTION_UI["orbital-field"];
  document.getElementById("label").textContent = data.label;
  document.getElementById("readout").textContent = `${localTime.toFixed(2)}s`;
  document.getElementById("note-a").textContent = data.a;
  document.getElementById("note-b").textContent = data.b;
  document.getElementById("note-c").textContent = data.c;
}

function renderOrbital(localTime, globalTime) {
  const p = ease(localTime / 10);
  particleRoot.visible = true;
  root.visible = true;
  cityRoot.visible = false;
  vortexRoot.visible = false;

  for (const orb of orbs) {
    const i = orb.userData.seed;
    const band = orb.userData.band;
    const angle = globalTime * (0.32 + band * 0.018) + i * 0.31;
    const radius = 4.2 + band * 0.72 + Math.sin(globalTime * 1.7 + i) * 0.38;
    const y = Math.sin(angle * 1.8 + i * 0.17) * (1.4 + p * 5.2);
    orb.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    orb.scale.setScalar(0.62 + Math.sin(globalTime * 2.4 + i) * 0.18);
  }

  root.rotation.x = globalTime * 0.13;
  root.rotation.y = globalTime * 0.28;
  core.rotation.x = globalTime * 0.9;
  core.rotation.y = globalTime * 1.3;
  core.scale.setScalar(0.82 + Math.sin(globalTime * 1.8) * 0.08 + p * 0.35);
  particleRoot.rotation.y = globalTime * 0.16;
  camera.position.set(Math.sin(globalTime * 0.23) * 18, 7 + p * 7, 22 - p * 8);
  camera.lookAt(0, 0, 0);
}

function renderCity(localTime, globalTime) {
  const p = ease(localTime / 10);
  particleRoot.visible = false;
  root.visible = false;
  cityRoot.visible = true;
  vortexRoot.visible = false;

  for (const tower of towers) {
    const distance = Math.hypot(tower.userData.x, tower.userData.z);
    const wave = Math.sin(globalTime * 2.4 - distance * 0.7);
    const height = 0.6 + Math.max(0, wave) * 6.5 + p * 2.2;
    tower.scale.y = height;
    tower.position.y = height * 0.5;
    tower.material = wave > 0.82 ? hotMaterial : wave > 0.35 ? sphereMaterial : darkMaterial;
  }

  cityRoot.rotation.y = -0.42 + p * 0.85;
  camera.position.set(Math.sin(globalTime * 0.16) * 20, 12 + Math.sin(globalTime * 0.7) * 3, 20 - p * 9);
  camera.lookAt(0, 3, 0);
}

function renderVortex(localTime, globalTime) {
  const p = ease(localTime / 10);
  particleRoot.visible = false;
  root.visible = false;
  cityRoot.visible = false;
  vortexRoot.visible = true;

  for (const item of vortexItems) {
    const i = item.userData.seed;
    const layer = i / vortexItems.length;
    const angle = i * 0.42 + globalTime * (1.1 + layer * 1.8);
    const radius = 17 * (1 - layer * 0.92) + Math.sin(globalTime * 3 + i) * 0.45;
    const y = (layer - 0.5) * 22 + Math.sin(angle * 2.0) * 1.7;
    item.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
    item.rotation.set(angle, angle * 0.6, globalTime * 1.8 + i);
    item.scale.setScalar(0.72 + p * 0.8 + Math.sin(globalTime * 3.4 + i) * 0.14);
  }

  vortexRoot.rotation.z = globalTime * 0.05;
  camera.position.set(Math.sin(globalTime * 0.28) * 12, 6 + p * 8, 25 - p * 12);
  camera.lookAt(0, 0, 0);
}

window.__THREE_RENDER_SECTION__ = function renderThreeSection(segment, localTime, globalTime) {
  resizeRenderer();
  setUi(segment, localTime);
  stars.rotation.y = globalTime * 0.012;
  rim.position.set(Math.sin(globalTime * 0.7) * 22, 8 + Math.cos(globalTime) * 4, Math.cos(globalTime * 0.7) * 22);

  if (segment.id === "orbital-field") {
    renderOrbital(localTime, globalTime);
  } else if (segment.id === "crystal-city") {
    renderCity(localTime, globalTime);
  } else {
    renderVortex(localTime, globalTime);
  }

  renderer.render(scene, camera);
};

window.addEventListener("resize", resizeRenderer);
resizeRenderer();

if (window.__PENDING_RENDER__) {
  window.__THREE_RENDER_SECTION__(...window.__PENDING_RENDER__);
} else {
  window.__THREE_RENDER_SECTION__(VIDEO_PLAN[0], 0, 0);
}
</script>
</body>
</html>
