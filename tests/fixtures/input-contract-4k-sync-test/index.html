<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4K Sync Contract Test</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #10141c;
  color: #f8fafc;
}

body.export-mode *,
body.export-mode *::before,
body.export-mode *::after {
  animation: none !important;
  transition: none !important;
}

#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    linear-gradient(0deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
    radial-gradient(circle at 82% 16%, rgba(45, 212, 191, 0.16), transparent 26%),
    radial-gradient(circle at 16% 78%, rgba(251, 191, 36, 0.14), transparent 28%),
    #10141c;
  background-size: 96px 96px, 96px 96px, auto, auto, auto;
}

#headline {
  position: absolute;
  left: 5vw;
  top: 5vh;
  width: 54vw;
  font-size: clamp(48px, 5vw, 132px);
  line-height: 0.98;
  font-weight: 900;
  letter-spacing: 0;
}

#clock {
  position: absolute;
  right: 5vw;
  top: 6vh;
  width: 17vw;
  padding: 22px 28px;
  border: 3px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.76);
  font-size: clamp(22px, 1.7vw, 48px);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

#word-lane {
  position: absolute;
  left: 5vw;
  right: 5vw;
  top: 28vh;
  min-height: 22vh;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 18px;
}

.word {
  padding: 12px 18px;
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 8px;
  background: rgba(148, 163, 184, 0.14);
  color: #94a3b8;
  font-size: clamp(22px, 1.6vw, 46px);
  font-weight: 800;
  line-height: 1;
}

.word.active {
  background: #facc15;
  border-color: rgba(250, 204, 21, 0.92);
  color: #111827;
}

.word.done {
  background: rgba(34, 197, 94, 0.18);
  border-color: rgba(34, 197, 94, 0.52);
  color: #bbf7d0;
}

#visualizer {
  position: absolute;
  left: 5vw;
  right: 5vw;
  bottom: 11vh;
  height: 33vh;
}

.node {
  position: absolute;
  width: clamp(74px, 5.2vw, 132px);
  height: clamp(74px, 5.2vw, 132px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 4px solid rgba(255, 255, 255, 0.18);
  background: #1e293b;
  color: #e2e8f0;
  font-size: clamp(28px, 2vw, 56px);
  font-weight: 900;
  transform: translate(-50%, -50%);
}

#beam {
  position: absolute;
  left: 0;
  top: 48%;
  height: 10px;
  border-radius: 999px;
  background: linear-gradient(90deg, #38bdf8, #facc15, #22c55e);
}

#marker {
  position: absolute;
  width: clamp(76px, 5vw, 132px);
  height: clamp(76px, 5vw, 132px);
  border-radius: 50%;
  background: #facc15;
  box-shadow: 0 0 54px rgba(250, 204, 21, 0.58);
  transform: translate(-50%, -50%);
}

#summary {
  position: absolute;
  left: 5vw;
  right: 5vw;
  bottom: 4vh;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.metric {
  min-height: 88px;
  padding: 16px 18px;
  border: 2px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.72);
  font-size: clamp(18px, 1.2vw, 34px);
  line-height: 1.22;
}

.metric strong {
  display: block;
  margin-bottom: 8px;
  color: #7dd3fc;
}
</style>
</head>
<body>
<div id="stage">
  <div id="headline"></div>
  <div id="clock"></div>
  <div id="word-lane"></div>
  <div id="visualizer">
    <div id="beam"></div>
    <div id="marker"></div>
  </div>
  <div id="summary"></div>
</div>

<script>
const VIDEO_PLAN = [
  {
    id: "sync-open",
    kind: "narration+visual",
    audio: "audio/sync-open.wav",
    text: "Animation beats follow the narration clock, so words and markers advance together."
  },
  {
    id: "silent-map",
    kind: "visual-only",
    duration: 3.5
  },
  {
    id: "layer-build",
    kind: "narration+visual",
    audio: "audio/layer-build.wav",
    text: "Dense explanation layers appear while the renderer measures the real voice duration."
  },
  {
    id: "final-sync",
    kind: "narration+visual",
    audio: "audio/final-sync.wav",
    text: "Silent visuals run from declared time, then narration resumes in sync."
  }
];

window.__VIDEO_PLAN__ = VIDEO_PLAN;

const SCREEN = {
  "sync-open": {
    head: "Audio-Locked Text",
    metrics: ["words reveal", "marker travels", "beam fills", "audio decides duration"]
  },
  "silent-map": {
    head: "Silent Visual Pass",
    metrics: ["no voiceover", "declared seconds", "same renderer", "no CSS motion"]
  },
  "layer-build": {
    head: "Dense Layer Build",
    metrics: ["measured speech", "local time", "global time", "deterministic state"]
  },
  "final-sync": {
    head: "Final Sync Check",
    metrics: ["audio cue", "visual cue", "single clock", "4K export"]
  }
};

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function ease(value) {
  value = clamp(value, 0, 1);
  return value * value * (3 - 2 * value);
}

function splitWords(text) {
  return String(text || "").trim().split(/\s+/).filter(Boolean);
}

function renderWords(words, progress) {
  const lane = document.getElementById("word-lane");
  const activeIndex = Math.min(words.length - 1, Math.floor(progress * words.length));

  if (lane.dataset.words !== words.join("|")) {
    lane.dataset.words = words.join("|");
    lane.textContent = "";
    for (const word of words) {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = word;
      lane.appendChild(span);
    }
  }

  Array.from(lane.children).forEach((node, index) => {
    node.className = index < activeIndex ? "word done" : index === activeIndex ? "word active" : "word";
  });
}

function ensureNodes() {
  const visualizer = document.getElementById("visualizer");
  if (visualizer.querySelector(".node")) return;

  for (let i = 0; i < 7; i++) {
    const node = document.createElement("div");
    node.className = "node";
    node.textContent = String(i + 1);
    visualizer.appendChild(node);
  }
}

function renderNodes(progress, pulseIndex) {
  ensureNodes();
  const nodes = Array.from(document.querySelectorAll(".node"));

  nodes.forEach((node, index) => {
    const x = 7 + index * 14.3;
    const wave = Math.sin((progress * Math.PI * 2) + index * 0.8);
    const y = 50 + wave * 22;
    const isHot = index === pulseIndex;

    node.style.left = `${x}%`;
    node.style.top = `${y}%`;
    node.style.background = isHot ? "#facc15" : index < pulseIndex ? "#14532d" : "#1e293b";
    node.style.color = isHot ? "#111827" : "#e2e8f0";
    node.style.transform = `translate(-50%, -50%) scale(${isHot ? 1.18 : 1})`;
  });
}

function renderMetrics(items, progress) {
  const box = document.getElementById("summary");
  if (box.dataset.items !== items.join("|")) {
    box.dataset.items = items.join("|");
    box.textContent = "";
    for (let i = 0; i < items.length; i++) {
      const item = document.createElement("div");
      item.className = "metric";
      item.innerHTML = `<strong>0${i + 1}</strong><span></span>`;
      box.appendChild(item);
    }
  }

  Array.from(box.children).forEach((node, index) => {
    const visible = progress >= index / items.length;
    node.querySelector("span").textContent = visible ? items[index] : "";
    node.style.opacity = visible ? "1" : "0.25";
  });
}

function renderSection(segment, localTime, globalTime) {
  const duration = Number(segment.resolvedDuration || segment.duration || 6);
  const progress = clamp(localTime / Math.max(duration, 0.001), 0, 1);
  const eased = ease(progress);
  const data = SCREEN[segment.id] || SCREEN["sync-open"];
  const headline = document.getElementById("headline");
  const clock = document.getElementById("clock");
  const beam = document.getElementById("beam");
  const marker = document.getElementById("marker");

  headline.textContent = data.head;
  clock.textContent = `${localTime.toFixed(2)}s / ${duration.toFixed(2)}s`;
  beam.style.width = `${eased * 100}%`;
  marker.style.left = `${eased * 100}%`;
  marker.style.top = `${50 + Math.sin(globalTime * 2.4) * 18}%`;

  if (segment.kind === "narration+visual") {
    const words = splitWords(segment.text);
    renderWords(words, progress);
    renderNodes(progress, Math.min(6, Math.floor(progress * 7)));
    renderMetrics(data.metrics, progress);
    return;
  }

  renderWords(["silent", "visual", "scan", "uses", "declared", "duration", "only"], progress);
  renderNodes(progress, Math.min(6, Math.floor(progress * 7)));
  renderMetrics(data.metrics, progress);
}

window.__RENDER_SECTION__ = renderSection;

const params = new URLSearchParams(window.location.search);
if (params.get("export") === "1") {
  document.body.classList.add("export-mode");
}

document.addEventListener("DOMContentLoaded", () => {
  ensureNodes();
  renderSection(VIDEO_PLAN[0], 0, 0);
});
</script>
</body>
</html>
