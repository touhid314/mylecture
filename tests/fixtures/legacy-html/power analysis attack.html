<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Analysis Attack</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Computer Modern Serif", serif;
            overflow: hidden;
            color: #fff;
        }

        #phone-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0a0a12 100%);
            position: relative;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 0 4px #222;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #visual-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        #caption-area {
            height: 25%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 70%, transparent 100%);
            z-index: 10;
        }

        .caption-text {
            font-family: "Computer Modern Serif", serif;
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8), -1px -1px 0 rgba(0,0,0,0.5);
            color: #fff;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .highlight { color: #ff3366; }
        .highlight-green { color: #00ffcc; }
        .highlight-yellow { color: #ffcc00; }

        #start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .play-btn {
            font-family: "Computer Modern Serif", serif;
            background: #00ffcc;
            color: #050505;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0,255,204,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse-green 2s infinite;
        }

        .play-btn:active { transform: scale(0.95); }

        #nav-hint {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            z-index: 60;
            pointer-events: none;
            display: none;
        }

        /* Animations */
        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(0,255,204,0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,204,0.8); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        
        @keyframes drawLine {
            from { stroke-dashoffset: 200; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes pulseOpacity {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .anim-float { animation: float 3s ease-in-out infinite; }
        .anim-spin { animation: spin 8s linear infinite; transform-origin: center; }
        .anim-spin-fast { animation: spin 3s linear infinite; transform-origin: center; }
        .anim-glitch { animation: glitch 0.2s linear infinite; }
        .anim-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-pulse { animation: pulse 2s infinite; transform-origin: center; }
        .anim-blink { animation: pulseOpacity 1s infinite; }
        
        .anim-draw {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawLine 2s ease-out forwards;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: #00ffcc;
            width: 0%;
            transition: width 0.1s linear;
            z-index: 50;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 300px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
        }

        text { font-family: "Computer Modern Serif", serif; }
        .mono { font-family: "Courier New", monospace; }
    </style>
</head>
<body>

    <div id="phone-container">
        <div id="progress" class="progress-bar"></div>
        <div id="nav-hint">Use ⬅️ and ➡️ keys to navigate</div>
        
        <div id="start-overlay">
            <h2 style="margin-bottom: 20px; text-align: center; color: #fff;">Turn on sound 🔊</h2>
            <button class="play-btn" onclick="startVideo()">PLAY VIDEO</button>
        </div>

        <div id="visual-area"></div>

        <div id="caption-area">
            <div id="caption" class="caption-text"></div>
        </div>
    </div>

    <script>
        const scriptData = [
            {
                speak: "Hackers don’t always need to break encryption…",
                caption: "Hackers don't always need to break <span class='highlight'>encryption</span> 🔓",
                svg: `
                    <svg viewBox="0 0 100 100" class="anim-float">
                        <rect x="30" y="50" width="40" height="30" rx="5" fill="#222" stroke="#fff" stroke-width="3"/>
                        <circle cx="50" cy="60" r="4" fill="#ff3366"/>
                        <path d="M48 60 L48 70 L52 70 L52 60 Z" fill="#ff3366"/>
                        <path d="M35 50 L35 35 A15 15 0 0 1 65 35" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
                        <line x1="20" y1="80" x2="80" y2="20" stroke="#ff3366" stroke-width="6" stroke-linecap="round" class="anim-pop" style="animation-delay: 1s; opacity:0;"/>
                    </svg>
                `
            },
            {
                speak: "Sometimes, they just watch your device’s power usage. Sounds crazy? It’s real.",
                caption: "Sometimes, they just watch your device’s <span class='highlight-green'>power usage</span> 🔋",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <rect x="35" y="20" width="30" height="60" rx="4" fill="none" stroke="#fff" stroke-width="3" class="anim-pop"/>
                        <rect x="45" y="15" width="10" height="5" fill="#fff" class="anim-pop"/>
                        <path d="M10 50 Q 20 20, 30 50 T 50 50 T 70 50 T 90 50" fill="none" stroke="#00ffcc" stroke-width="3" class="anim-draw"/>
                        <path d="M10 50 L 30 50 L 40 30 L 50 70 L 60 40 L 70 50 L 90 50" fill="none" stroke="#ffcc00" stroke-width="4" stroke-linejoin="round" class="anim-draw" style="animation-delay: 1s; stroke-dashoffset: 200; stroke-dasharray: 200;"/>
                    </svg>
                `
            },
            {
                speak: "Every time your device runs a program— your CPU uses tiny amounts of power.",
                caption: "Your CPU uses tiny amounts of <span class='highlight'>power</span> ⚡",
                svg: `
                    <svg viewBox="0 0 100 100" class="anim-pulse">
                        <rect x="25" y="25" width="50" height="50" rx="3" fill="#111" stroke="#fff" stroke-width="2"/>
                        <path d="M30 25 L30 15 M40 25 L40 15 M50 25 L50 15 M60 25 L60 15 M70 25 L70 15" stroke="#fff" stroke-width="2"/>
                        <path d="M30 75 L30 85 M40 75 L40 85 M50 75 L50 85 M60 75 L60 85 M70 75 L70 85" stroke="#fff" stroke-width="2"/>
                        <path d="M25 30 L15 30 M25 40 L15 40 M25 50 L15 50 M25 60 L15 60 M25 70 L15 70" stroke="#fff" stroke-width="2"/>
                        <path d="M75 30 L85 30 M75 40 L85 40 M75 50 L85 50 M75 60 L85 60 M75 70 L85 70" stroke="#fff" stroke-width="2"/>
                        
                        <path d="M55 35 L45 50 L55 50 L45 65 L60 45 L50 45 Z" fill="#ffcc00" class="anim-blink"/>
                    </svg>
                `
            },
            {
                speak: "Now here’s the problem: that power usage isn’t random. It actually depends on the data being processed.",
                caption: "That power usage <span class='highlight-green'>isn't random</span>.<br>It depends on the data 📊",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <text x="20" y="30" class="mono" font-size="12" fill="#fff">0</text>
                        <text x="40" y="30" class="mono" font-size="12" fill="#fff">1</text>
                        <text x="60" y="30" class="mono" font-size="12" fill="#fff">0</text>
                        <text x="80" y="30" class="mono" font-size="12" fill="#fff">1</text>
                        
                        <path d="M 15 70 L 25 70" stroke="#ff3366" stroke-width="3" />
                        <path d="M 25 70 L 25 40 L 35 40 L 45 40" stroke="#00ffcc" stroke-width="3" />
                        <path d="M 45 40 L 45 70 L 55 70 L 65 70" stroke="#ff3366" stroke-width="3" />
                        <path d="M 65 70 L 65 40 L 75 40 L 85 40" stroke="#00ffcc" stroke-width="3" />
                        
                        <line x1="20" y1="35" x2="20" y2="65" stroke="#555" stroke-dasharray="2 2"/>
                        <line x1="40" y1="35" x2="40" y2="35" stroke="#555" stroke-dasharray="2 2" class="anim-pop" style="animation-delay:0.5s; opacity:0;"/>
                        <line x1="40" y1="35" x2="40" y2="40" stroke="#00ffcc" stroke-dasharray="2 2" class="anim-pop" style="animation-delay: 0.5s; opacity:0;"/>
                    </svg>
                `
            },
            {
                speak: "So if a device is doing encryption… the power consumption slightly changes based on the secret key.",
                caption: "Power slightly changes based on the <span class='highlight'>secret key</span> 🔑",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <path d="M 10 60 L 30 60 L 40 30 L 50 80 L 60 40 L 70 60 L 90 60" fill="none" stroke="#333" stroke-width="4"/>
                        <path d="M 40 30 L 50 80 L 60 40" fill="none" stroke="#ffcc00" stroke-width="5" class="anim-draw"/>
                        
                        <g class="anim-float" style="animation-delay: 1s;">
                            <circle cx="50" cy="20" r="8" fill="none" stroke="#00ffcc" stroke-width="3"/>
                            <line x1="50" y1="28" x2="50" y2="50" stroke="#00ffcc" stroke-width="3"/>
                            <line x1="50" y1="45" x2="55" y2="45" stroke="#00ffcc" stroke-width="3"/>
                            <line x1="50" y1="38" x2="55" y2="38" stroke="#00ffcc" stroke-width="3"/>
                        </g>
                    </svg>
                `
            },
            {
                speak: "And attackers can measure this. This is called a power analysis attack.",
                caption: "This is a <span class='highlight'>POWER ANALYSIS</span> attack 📉",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <rect x="10" y="20" width="80" height="60" rx="5" fill="#0a0a0a" stroke="#fff" stroke-width="2"/>
                        <path d="M 10 40 L 90 40 M 10 60 L 90 60 M 36 20 L 36 80 M 63 20 L 63 80" stroke="#222" stroke-width="1"/>
                        
                        <path d="M 10 50 Q 20 45 30 50 T 50 20 T 70 50 T 90 50" fill="none" stroke="#00ffcc" stroke-width="2" class="anim-glitch"/>
                        
                        <rect x="40" y="15" width="20" height="30" fill="none" stroke="#ff3366" stroke-width="2" stroke-dasharray="2 2" class="anim-pulse"/>
                        <text x="50" y="12" font-size="6" fill="#ff3366" text-anchor="middle" font-weight="bold">ANOMALY DETECTED</text>
                    </svg>
                `
            },
            {
                speak: "They connect probes to a device— like a smart card, IoT chip, or embedded system— and record power usage over time.",
                caption: "They connect <span class='highlight-green'>probes</span> to record power usage 🔌",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <rect x="35" y="35" width="30" height="30" rx="4" fill="#222" stroke="#fff" stroke-width="2"/>
                        <circle cx="50" cy="50" r="6" fill="#ffcc00"/>
                        
                        <path d="M 10 10 L 25 25 L 35 40" fill="none" stroke="#ff3366" stroke-width="3" class="anim-draw"/>
                        <circle cx="35" cy="40" r="3" fill="#ff3366" class="anim-pop" style="animation-delay: 1.5s; opacity:0;"/>
                        
                        <path d="M 90 10 L 75 25 L 65 40" fill="none" stroke="#00ffcc" stroke-width="3" class="anim-draw" style="animation-delay: 0.5s; stroke-dashoffset: 200;"/>
                        <circle cx="65" cy="40" r="3" fill="#00ffcc" class="anim-pop" style="animation-delay: 2s; opacity:0;"/>
                        
                        <text x="20" y="15" class="mono anim-blink" font-size="5" fill="#ff3366">mV</text>
                        <text x="80" y="15" class="mono anim-blink" font-size="5" fill="#00ffcc">mA</text>
                    </svg>
                `
            },
            {
                speak: "Then they use statistics to find patterns. Tiny differences… repeated thousands of times… start revealing the secret key.",
                caption: "Tiny differences repeated thousands of times reveal the <span class='highlight'>key</span> 👁️",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <path d="M 10 50 Q 30 40 50 60 T 90 50" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
                        <path d="M 10 52 Q 30 42 50 58 T 90 52" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
                        <path d="M 10 48 Q 30 38 50 62 T 90 48" fill="none" stroke="#fff" stroke-width="1" opacity="0.2"/>
                        <path d="M 10 55 Q 30 45 50 55 T 90 55" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
                        
                        <path d="M 10 50 L 30 50 L 40 20 L 45 60 L 50 30 L 60 50 L 90 50" fill="none" stroke="#ff3366" stroke-width="3" class="anim-draw" style="animation-delay: 1s; stroke-dashoffset:200;"/>
                        
                        <g class="anim-pop" style="animation-delay: 2.5s; opacity:0;">
                            <circle cx="50" cy="80" r="6" fill="none" stroke="#ffcc00" stroke-width="2"/>
                            <line x1="56" y1="80" x2="70" y2="80" stroke="#ffcc00" stroke-width="2"/>
                            <line x1="65" y1="80" x2="65" y2="85" stroke="#ffcc00" stroke-width="2"/>
                        </g>
                    </svg>
                `
            },
            {
                speak: "No brute force. No hacking passwords. Just… observing.",
                caption: "No brute force. Just... <span class='highlight-green'>observing</span> 👁️",
                svg: `
                    <svg viewBox="0 0 100 100" class="anim-float">
                        <path d="M 20 50 Q 50 20 80 50 Q 50 80 20 50 Z" fill="none" stroke="#00ffcc" stroke-width="3"/>
                        <circle cx="50" cy="50" r="10" fill="#00ffcc"/>
                        <circle cx="52" cy="48" r="3" fill="#050505"/> <line x1="50" y1="15" x2="50" y2="5" stroke="#00ffcc" stroke-width="2" class="anim-blink"/>
                        <line x1="85" y1="50" x2="95" y2="50" stroke="#00ffcc" stroke-width="2" class="anim-blink" style="animation-delay:0.2s"/>
                        <line x1="50" y1="85" x2="50" y2="95" stroke="#00ffcc" stroke-width="2" class="anim-blink" style="animation-delay:0.4s"/>
                        <line x1="15" y1="50" x2="5" y2="50" stroke="#00ffcc" stroke-width="2" class="anim-blink" style="animation-delay:0.6s"/>
                    </svg>
                `
            },
            {
                speak: "That’s what makes this scary. Even perfectly secure algorithms can leak secrets through hardware.",
                caption: "Perfect algorithms can <span class='highlight'>leak secrets</span> through hardware 🛡️💧",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <path d="M 20 20 L 50 10 L 80 20 L 80 50 Q 80 80 50 90 Q 20 80 20 50 Z" fill="none" stroke="#fff" stroke-width="4"/>
                        <path d="M 50 10 L 50 90" stroke="#fff" stroke-width="2" opacity="0.5"/>
                        
                        <path d="M 40 40 L 45 50 L 40 60 L 50 70" fill="none" stroke="#ff3366" stroke-width="2" class="anim-draw"/>
                        
                        <circle cx="50" cy="95" r="3" fill="#ff3366" class="anim-pop" style="animation-delay: 1.5s; opacity:0;"/>
                        <text x="60" y="98" class="mono anim-pop" font-size="8" fill="#ff3366" style="animation-delay: 1.5s; opacity:0;">01</text>
                    </svg>
                `
            },
            {
                speak: "This is why modern chips use protections like: noise injection, constant-time operations, secure enclaves",
                caption: "Protections: <span class='highlight-green'>Noise injection</span>, constant-time, enclaves 🔒",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <path d="M 10 50 L 30 50 L 40 30 L 50 70 L 60 50 L 90 50" fill="none" stroke="#333" stroke-width="2"/>
                        
                        <path d="M 10 50 L 15 40 L 20 60 L 25 35 L 30 65 L 35 45 L 40 55 L 45 20 L 50 80 L 55 30 L 60 60 L 65 40 L 70 55 L 75 35 L 80 65 L 85 45 L 90 50" fill="none" stroke="#00ffcc" stroke-width="2" class="anim-glitch"/>
                        
                        <rect x="35" y="20" width="30" height="60" rx="2" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="4 4" class="anim-spin-fast"/>
                    </svg>
                `
            },
            {
                speak: "Because in hardware security… the weakest link isn’t always the code. It’s the physics.",
                caption: "The weakest link isn't the code.<br>It's the <span class='highlight'>physics</span>. ⚡",
                svg: `
                    <svg viewBox="0 0 100 100">
                        <g class="anim-spin">
                            <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#fff" stroke-width="1" transform="rotate(0 50 50)"/>
                            <circle cx="85" cy="50" r="3" fill="#ff3366"/>
                            
                            <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#fff" stroke-width="1" transform="rotate(60 50 50)"/>
                            <circle cx="67" cy="80" r="3" fill="#00ffcc"/>
                            
                            <ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#fff" stroke-width="1" transform="rotate(120 50 50)"/>
                            <circle cx="32" cy="80" r="3" fill="#ffcc00"/>
                        </g>
                        <circle cx="50" cy="50" r="6" fill="#fff" class="anim-pulse"/>
                        
                        <path d="M 45 30 L 35 50 L 45 50 L 35 70" fill="none" stroke="#ffcc00" stroke-width="2" class="anim-blink"/>
                        <path d="M 65 35 L 55 55 L 65 55 L 55 75" fill="none" stroke="#00ffcc" stroke-width="2" class="anim-blink" style="animation-delay: 0.5s"/>
                    </svg>
                `
            },
            {
                speak: "Want more cybersecurity secrets? Follow for more.",
                caption: "Want more cybersecurity secrets?<br><span class='highlight-green'>Follow for more 🔥</span>",
                svg: `
                    <svg viewBox="0 0 100 100" class="anim-pop">
                        <rect x="20" y="40" width="60" height="20" rx="10" fill="#00ffcc" class="anim-pulse" style="cursor: pointer;"/>
                        <text x="50" y="52" font-size="8" fill="#050505" font-weight="bold" text-anchor="middle" letter-spacing="1">FOLLOW +</text>
                    </svg>
                `
            }
        ];

        let currentScene = 0;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let currentUtterance = null;
        let isVideoRunning = false;

        function initVoices() {
            const voices = synth.getVoices();
            if (voices.length > 0) {
                selectedVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB') || 
                                voices.find(v => v.lang.startsWith('en')) || 
                                voices[0];
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        } else {
            initVoices();
        }

        function startVideo() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('nav-hint').style.display = 'block';
            isVideoRunning = true;
            
            // Kickstart audio context
            let u = new SpeechSynthesisUtterance('');
            synth.speak(u);
            
            setTimeout(() => {
                playScene();
                updateProgress();
            }, 500);
        }

        function playScene() {
            if (currentScene >= scriptData.length || currentScene < 0) {
                document.getElementById('progress').style.width = '100%';
                return;
            }

            const scene = scriptData[currentScene];
            
            const visualArea = document.getElementById('visual-area');
            visualArea.innerHTML = scene.svg;
            
            const captionArea = document.getElementById('caption');
            captionArea.innerHTML = scene.caption;
            
            // Force reflow
            captionArea.style.animation = 'none';
            captionArea.offsetHeight; 
            captionArea.style.animation = null;

            currentUtterance = new SpeechSynthesisUtterance(scene.speak);
            if (selectedVoice) {
                currentUtterance.voice = selectedVoice;
            }
            currentUtterance.rate = 1.1; 
            currentUtterance.pitch = 1.0;

            currentUtterance.onend = () => {
                currentScene++;
                playScene();
            };

            currentUtterance.onerror = (e) => {
                console.warn("Speech synthesis error", e);
                setTimeout(() => {
                    currentScene++;
                    playScene();
                }, 1000);
            };

            synth.speak(currentUtterance);
        }

        function skipToScene(index) {
            if (!isVideoRunning) return;
            
            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
            }
            synth.cancel();

            if (index < 0) index = 0;
            if (index >= scriptData.length) index = scriptData.length - 1;
            
            currentScene = index;
            
            setTimeout(() => {
                playScene();
            }, 50);
        }

        document.addEventListener('keydown', (e) => {
            if (!isVideoRunning) return;
            
            if (e.key === 'ArrowRight') {
                skipToScene(currentScene + 1);
            } else if (e.key === 'ArrowLeft') {
                skipToScene(currentScene - 1);
            }
        });

        function updateProgress() {
            if (!isVideoRunning) return;
            const progressPct = (currentScene / scriptData.length) * 100;
            document.getElementById('progress').style.width = progressPct + '%';
            requestAnimationFrame(updateProgress);
        }

        window.onbeforeunload = function() {
            synth.cancel();
        };
    </script>
</body>
</html>
