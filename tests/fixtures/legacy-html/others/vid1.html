<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fork Bomb Explained</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Computer Modern Serif", serif;
            overflow: hidden;
            color: #fff;
        }

        #phone-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0a0a12 100%);
            position: relative;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 0 4px #222;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #visual-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        #caption-area {
            height: 25%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.6) 70%, transparent 100%);
            z-index: 10;
        }

        .caption-text {
            font-family: "Computer Modern Serif", serif;
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), -1px -1px 0 rgba(0, 0, 0, 0.5);
            color: #fff;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .highlight {
            color: #ff3366;
        }

        .highlight-green {
            color: #00ffcc;
        }

        #start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .play-btn {
            font-family: "Computer Modern Serif", serif;
            background: #ff3366;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 2s infinite;
        }

        .play-btn:active {
            transform: scale(0.95);
        }



        /* SVG Animations */
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(255, 51, 102, 0.8);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
            }
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes glitch {
            0% {
                transform: translate(0)
            }

            20% {
                transform: translate(-2px, 2px)
            }

            40% {
                transform: translate(-2px, -2px)
            }

            60% {
                transform: translate(2px, 2px)
            }

            80% {
                transform: translate(2px, -2px)
            }

            100% {
                transform: translate(0)
            }
        }

        /* Fixed CPU Animation */
        @keyframes cpuFillFixed {
            0% {
                stroke-dashoffset: 50;
                stroke: #00ffcc;
            }

            60% {
                stroke: #ffcc00;
            }

            100% {
                stroke-dashoffset: 0;
                stroke: #ff3366;
            }
        }

        .anim-cpu-fill {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: cpuFillFixed 2.5s ease-in forwards;
        }

        .anim-float {
            animation: float 3s ease-in-out infinite;
        }

        .anim-spin {
            animation: spin 8s linear infinite;
            transform-origin: center;
        }

        .anim-glitch {
            animation: glitch 0.2s linear infinite;
        }

        .anim-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .anim-pulse {
            animation: pulse 2s infinite;
            transform-origin: center;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: #ff3366;
            width: 0%;
            transition: width 0.1s linear;
            z-index: 50;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 300px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
        }

        text {
            font-family: "Computer Modern Serif", serif;
        }

        .code-text {
            font-family: "Courier New", monospace;
        }
    </style>
</head>

        let currentScene = 0;
        let synth = window.speechSynthesis;
        let selectedVoice = null;
        let currentUtterance = null;
        let isVideoRunning = false;
        let skipTimeout = null;

        function initVoices() {
            const voices = synth.getVoices();
            if (voices.length > 0) {
                selectedVoice = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB') ||
                    voices.find(v => v.lang.startsWith('en')) ||
                    voices[0];
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        } else {
            initVoices();
        }

        function startVideo() {
            document.getElementById('start-overlay').style.display = 'none';
            isVideoRunning = true;

            // Kickstart audio context
            let u = new SpeechSynthesisUtterance('');
            synth.speak(u);

            setTimeout(() => {
                playScene();
                updateProgress();
            }, 500);
        }

        function playScene() {
            if (currentScene >= scriptData.length || currentScene < 0) {
                document.getElementById('progress').style.width = '100%';
                return;
            }

            const scene = scriptData[currentScene];

            currentUtterance = new SpeechSynthesisUtterance(scene.speak);
            if (selectedVoice) {
                currentUtterance.voice = selectedVoice;
            }
            currentUtterance.rate = 1.1;
            currentUtterance.pitch = 1.0;

            currentUtterance.onstart = () => {
                const visualArea = document.getElementById('visual-area');
                visualArea.innerHTML = scene.svg;

                const captionArea = document.getElementById('caption');
                captionArea.innerHTML = scene.caption;

                // Force reflow
                captionArea.style.animation = 'none';
                void captionArea.offsetHeight;
                captionArea.style.animation = '';
            };

            currentUtterance.onend = () => {
                currentScene++;
                playScene();
            };

            currentUtterance.onerror = (e) => {
                console.warn("Speech synthesis error", e);
                setTimeout(() => {
                    currentScene++;
                    playScene();
                }, 1000);
            };

            synth.speak(currentUtterance);
        }

        function skipToScene(index) {
            if (!isVideoRunning) return;

            // Cleanup current utterance to prevent double firing
            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
            }
            synth.cancel();

            if (skipTimeout) {
                clearTimeout(skipTimeout);
            }

            // Clamp bounds
            if (index < 0) index = 0;
            if (index >= scriptData.length) index = scriptData.length - 1;

            currentScene = index;

            // Small delay to ensure synth completely stops before queueing next
            skipTimeout = setTimeout(() => {
                playScene();
            }, 50);
        }

        document.addEventListener('keydown', (e) => {
            if (!isVideoRunning) return;

            if (e.key === 'ArrowRight') {
                skipToScene(currentScene + 1);
            } else if (e.key === 'ArrowLeft') {
                skipToScene(currentScene - 1);
            }
        });

        function updateProgress() {
            if (!isVideoRunning) return;
            const progressPct = (currentScene / scriptData.length) * 100;
            document.getElementById('progress').style.width = progressPct + '%';
            requestAnimationFrame(updateProgress);
        }

        window.onbeforeunload = function () {
            synth.cancel();
        };
    </script>
</body>

</html>
