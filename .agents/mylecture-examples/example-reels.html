<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myLecture: Stateful vs Stateless Server</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Roboto:wght@400;700&display=swap');

        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --text-color: #eceff4;
            --accent-blue: #61AFEF;
            --accent-green: #98c379;
            --accent-red: #E06C75;
            --accent-yellow: #E5C07B;
            --accent-purple: #C678DD;
            --node-bg: #282c34;
            --edge-color: #5c6370;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            font-family: 'Outfit', sans-serif;
        }

        body.export-mode *,
        body.export-mode *::before,
        body.export-mode *::after {
            animation: none !important;
            transition: none !important;
        }

        body.export-mode #play-overlay {
            display: none !important;
        }

        /* 9:16 Aspect Ratio Container */
        #player-container {
            position: relative;
            width: min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
            container-type: size;
            --reels-safe-bottom: clamp(240px, 22cqh, 430px);
            --subtitle-space: clamp(92px, 10cqh, 170px);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        #progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: #252528;
            z-index: 100;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        }

        #play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            cursor: pointer;
        }

        #play-btn {
            font-size: 26px;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(97, 175, 239, 0.3);
        }

        /* Scene Layouts */
        .scene {
            position: absolute;
            inset: 0;
            /* Increased top padding from ~64px to 140px-270px for extra reel safe headroom */
            padding: clamp(120px, 14cqh, 270px) clamp(20px, 5cqw, 64px) calc(var(--reels-safe-bottom) + var(--subtitle-space));
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        .title {
            color: var(--accent-blue);
            font-size: clamp(24px, 4.5cqw, 54px);
            font-weight: 800;
            margin-top: 0;
            text-align: center;
            border: 3px solid var(--accent-blue);
            padding: clamp(6px, 1.6cqw, 18px) clamp(12px, 3cqw, 36px);
            background: rgba(97, 175, 239, 0.08);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(97, 175, 239, 0.15);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .subtitle {
            color: var(--accent-yellow);
            font-size: clamp(18px, 3.6cqw, 42px);
            margin-top: clamp(6px, 1cqh, 16px);
            font-weight: 700;
            text-align: center;
        }

        /* SVGs grow to fill screen space for mobile visibility */
        svg {
            flex: 1;
            width: 100%;
            min-height: 0;
            margin-top: clamp(10px, 2cqh, 30px);
            overflow: visible;
        }

        /* Key text placed naturally below the animations */
        .status-text {
            margin-top: clamp(12px, 2cqh, 32px);
            font-size: clamp(24px, 4.5cqw, 52px);
            font-weight: 800;
            text-align: center;
            z-index: 15;
            width: 100%;
        }

        .text-green {
            color: var(--accent-green);
        }

        .text-yellow {
            color: var(--accent-yellow);
        }

        .text-blue {
            color: var(--accent-blue);
        }

        .text-red {
            color: var(--accent-red);
        }

        .text-purple {
            color: var(--accent-purple);
        }

        /* Scene 4: Summary Table Styling */
        .summary-container {
            width: 100%;
            margin-top: clamp(20px, 3cqh, 60px);
            display: flex;
            flex-direction: column;
            gap: clamp(14px, 2.2cqh, 30px);
        }

        .summary-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 10px;
            align-items: center;
            padding: clamp(12px, 2.5cqw, 24px);
            background: rgba(30, 30, 36, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: clamp(18px, 3.2cqw, 36px);
            opacity: 0.15;
            transform: translateY(20px);
        }

        .summary-row.header-row {
            background: transparent;
            border: none;
            font-weight: 800;
            color: var(--accent-blue);
            opacity: 1 !important;
            transform: none !important;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-row.active {
            opacity: 1;
            transform: translateY(0);
            border-color: var(--accent-blue);
            background: rgba(97, 175, 239, 0.08);
            box-shadow: 0 4px 15px rgba(97, 175, 239, 0.1);
        }

        .summary-row.done {
            opacity: 0.7;
            transform: translateY(0);
        }

        .col-header {
            text-align: center;
        }

        .col-val {
            text-align: center;
            font-weight: 700;
        }



        .svg-text {
            fill: #fff;
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body>

    <div id="player-container">
        <div id="play-overlay" onclick="startLecture()">
            <button id="play-btn">Play Lesson</button>
        </div>

        <!-- Scene 1: Goldfish Hook -->
        <div id="scene1" class="scene active">
            <div class="title">Stateless Server</div>
            <div class="subtitle">The Goldfish Analogy 🐠</div>

            <svg id="scene1-svg" viewBox="0 0 400 450">
                <!-- Client laptop -->
                <g id="s1-client">
                    <rect x="25" y="325" width="90" height="55" rx="6" fill="#282c34" stroke="#abb2bf"
                        stroke-width="3" />
                    <path d="M 10 380 L 130 380 L 120 390 L 20 390 Z" fill="#5c6370" />
                    <text class="svg-text" x="70" y="359" font-size="20" font-weight="bold"
                        text-anchor="middle">Client</text>
                </g>

                <!-- Goldfish Bowl -->
                <g id="s1-bowl">
                    <circle cx="200" cy="180" r="95" fill="rgba(97, 175, 239, 0.12)" stroke="#61AFEF"
                        stroke-width="4.5" />
                    <path d="M 130 115 L 270 115" stroke="#61AFEF" stroke-width="4.5" />
                    <path d="M 134 125 Q 200 135 266 125" fill="none" stroke="rgba(97, 175, 239, 0.4)"
                        stroke-width="2" />

                    <!-- Swimming Goldfish Group -->
                    <g id="s1-fish">
                        <path d="M -22 0 C -5 -14, 17 -14, 28 0 C 17 14, -5 14, -22 0 Z" fill="#FF7F50" />
                        <path d="M -22 0 L -35 -14 L -30 0 L -35 14 Z" fill="#FF7F50" />
                        <circle cx="17" cy="-3.5" r="3" fill="#000" />
                        <circle cx="18.5" cy="-4.5" r="1" fill="#fff" />
                        <path d="M 0 -8 Q -6 -18 -11 -6 Z" fill="#FF7F50" />
                        <path d="M 0 8 Q -6 18 -11 6 Z" fill="#FF6347" />
                    </g>

                    <!-- Bubbles -->
                    <circle id="s1-bubble-1" cx="190" cy="200" r="6" fill="none" stroke="rgba(255,255,255,0.6)"
                        stroke-width="1.5" />
                    <circle id="s1-bubble-2" cx="215" cy="180" r="4" fill="none" stroke="rgba(255,255,255,0.6)"
                        stroke-width="1.5" />
                    <circle id="s1-bubble-3" cx="180" cy="160" r="5" fill="none" stroke="rgba(255,255,255,0.6)"
                        stroke-width="1.5" />
                </g>

                <!-- App Server -->
                <g id="s1-server">
                    <rect x="280" y="305" width="95" height="100" rx="8" fill="#282c34" stroke="#98c379"
                        stroke-width="3" />
                    <text class="svg-text" x="327.5" y="352" fill="#98c379" font-size="22" font-weight="bold"
                        text-anchor="middle">Server</text>
                    <circle cx="305" cy="385" r="5" fill="#98c379" />
                    <circle cx="322" cy="385" r="5" fill="#98c379" />
                </g>

                <!-- Connection line -->
                <path id="s1-link" d="M 115 353 L 280 353" stroke="#5c6370" stroke-width="3" stroke-dasharray="6,4"
                    fill="none" />

                <!-- Question box representing goldfish memory -->
                <g id="s1-query-box" opacity="0">
                    <rect x="245" y="225" width="145" height="55" rx="8" fill="#e06c75" stroke="#fff"
                        stroke-width="2" />
                    <text class="svg-text" x="317.5" y="259" fill="#fff" font-size="18" font-weight="bold"
                        text-anchor="middle">Who are you? 🤔</text>
                    <path d="M 317.5 280 L 312.5 290 L 322.5 290 Z" fill="#e06c75" />
                </g>

                <g id="s1-request-dots"></g>
            </svg>

            <div id="s1-status" class="status-text text-yellow">Scanning Network...</div>
        </div>

        <!-- Scene 2: Stateful Server (Dog) -->
        <div id="scene2" class="scene">
            <div class="title">Stateful Server</div>
            <div class="subtitle">The Loyal Dog 🐕</div>

            <svg id="scene2-svg" viewBox="0 0 400 450">
                <!-- Stateful server box -->
                <g id="s2-server-group">
                    <rect id="s2-server-box" x="35" y="160" width="140" height="180" rx="12" fill="#282c34"
                        stroke="#61AFEF" stroke-width="4.5" />
                    <!-- Split label for bigger font layout -->
                    <text class="svg-text" x="105" y="193" fill="#61AFEF" font-size="18" font-weight="bold" text-anchor="middle">Stateful</text>
                    <text class="svg-text" x="105" y="215" fill="#61AFEF" font-size="18" font-weight="bold" text-anchor="middle">Server</text>
                    <!-- Dog Emoji -->
                    <text id="s2-dog" class="svg-text" x="105" y="285" font-size="65" text-anchor="middle">🐕</text>
                </g>

                <!-- Session Storage inside Server -->
                <g id="s2-store">
                    <rect id="s2-store-box" x="210" y="150" width="160" height="200" rx="10" fill="#1e1e24"
                        stroke="#5c6370" stroke-width="2" />
                    <text class="svg-text" x="290" y="182" fill="#abb2bf" font-size="18" font-weight="bold"
                        text-anchor="middle">Session Store</text>
                    <line x1="220" y1="195" x2="360" y2="195" stroke="#5c6370" stroke-width="1.5" />

                    <!-- Session Records -->
                    <g id="s2-records">
                        <text class="svg-text" x="225" y="228" fill="#98c379" font-size="15" font-weight="bold">User A: Cart 🛒</text>
                        <text class="svg-text" x="225" y="268" fill="#98c379" font-size="15" font-weight="bold">User B: Auth 🔑</text>
                        <text class="svg-text" x="225" y="308" fill="#98c379" font-size="15" font-weight="bold">User C: Cart 🛒</text>
                    </g>
                </g>

                <!-- Memory connection -->
                <path id="s2-sync-line" d="M 175 250 L 210 250" stroke="#61AFEF" stroke-width="3" stroke-dasharray="5,3"
                    fill="none" />

                <!-- Lightning Bolt crash trigger -->
                <path id="s2-lightning" d="M 105 30 L 90 110 L 115 110 L 100 165" fill="none" stroke="#E5C07B"
                    stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0" />

                <!-- Crash Overlay text -->
                <text id="s2-crash-overlay" class="svg-text" x="105" y="280" fill="#E06C75" font-size="28"
                    font-weight="bold" text-anchor="middle" opacity="0">⚡ CRASHED ⚡</text>

                <g id="s2-request-dots"></g>
            </svg>

            <div id="s2-status" class="status-text text-green">Connected: Session Saved</div>
        </div>

        <!-- Scene 3: Stateless Resiliency -->
        <div id="scene3" class="scene">
            <div class="title">Stateless Server</div>
            <div class="subtitle">Goldfish Resiliency 🐠</div>

            <svg id="scene3-svg" viewBox="0 0 400 450">
                <!-- Client -->
                <g id="s3-client" transform="translate(150, 10)">
                    <rect x="0" y="0" width="100" height="45" rx="5" fill="#282c34" stroke="#abb2bf"
                        stroke-width="2.5" />
                    <text class="svg-text" x="50" y="30" font-size="20" font-weight="bold"
                        text-anchor="middle">Client</text>
                </g>

                <!-- Load Balancer -->
                <g id="s3-lb" transform="translate(100, 85)">
                    <rect x="0" y="0" width="200" height="50" rx="8" fill="#282c34" stroke="#61AFEF" stroke-width="3" />
                    <text class="svg-text" x="100" y="33" fill="#61AFEF" font-size="20" font-weight="bold"
                        text-anchor="middle">Load Balancer</text>
                </g>

                <!-- Extra Scaling Servers (behind A and B) -->
                <g id="s3-extra-servers">
                    <g id="s3-server-c" opacity="0">
                        <rect x="5" y="155" width="145" height="120" rx="10" fill="#1e1e24" stroke="#98c379" stroke-width="2" stroke-dasharray="4,4" />
                        <text class="svg-text" x="77.5" y="187" fill="#98c379" font-size="18" font-weight="bold" text-anchor="middle">Server C</text>
                        <text class="svg-text" x="77.5" y="235" font-size="36" text-anchor="middle">🐠</text>
                    </g>
                    <g id="s3-server-d" opacity="0">
                        <rect x="250" y="155" width="145" height="120" rx="10" fill="#1e1e24" stroke="#98c379" stroke-width="2" stroke-dasharray="4,4" />
                        <text class="svg-text" x="322.5" y="187" fill="#98c379" font-size="18" font-weight="bold" text-anchor="middle">Server D</text>
                        <text class="svg-text" x="322.5" y="235" font-size="36" text-anchor="middle">🐠</text>
                    </g>
                    <g id="s3-server-e" opacity="0">
                        <rect x="-10" y="140" width="145" height="120" rx="10" fill="#1e1e24" stroke="#98c379" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
                        <text class="svg-text" x="62.5" y="172" fill="#98c379" font-size="14" font-weight="bold" text-anchor="middle" opacity="0.6">Server E</text>
                        <text class="svg-text" x="62.5" y="215" font-size="28" text-anchor="middle" opacity="0.6">🐠</text>
                    </g>
                    <g id="s3-server-f" opacity="0">
                        <rect x="265" y="140" width="145" height="120" rx="10" fill="#1e1e24" stroke="#98c379" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
                        <text class="svg-text" x="337.5" y="172" fill="#98c379" font-size="14" font-weight="bold" text-anchor="middle" opacity="0.6">Server F</text>
                        <text class="svg-text" x="337.5" y="215" font-size="28" text-anchor="middle" opacity="0.6">🐠</text>
                    </g>
                </g>

                <!-- Server A (Stateless) -->
                <g id="s3-server-a">
                    <rect id="s3-sa-box" x="20" y="170" width="145" height="120" rx="10" fill="#282c34" stroke="#98c379"
                        stroke-width="3" />
                    <text id="s3-sa-label" class="svg-text" x="92.5" y="202" fill="#98c379" font-size="20"
                        font-weight="bold" text-anchor="middle">Server A</text>
                    <!-- Goldfish emoji on server to denote stateless -->
                    <text id="s3-sa-goldfish" class="svg-text" x="92.5" y="255" font-size="44"
                        text-anchor="middle">🐠</text>
                    <!-- Crash Indicator -->
                    <text id="s3-sa-crash" class="svg-text" x="92.5" y="250" fill="#E06C75" font-size="24"
                        font-weight="bold" text-anchor="middle" opacity="0">⚠️ CRASH</text>
                </g>

                <!-- Server B (Stateless) -->
                <g id="s3-server-b">
                    <rect id="s3-sb-box" x="235" y="170" width="145" height="120" rx="10" fill="#282c34"
                        stroke="#98c379" stroke-width="3" />
                    <text id="s3-sb-label" class="svg-text" x="307.5" y="202" fill="#98c379" font-size="20"
                        font-weight="bold" text-anchor="middle">Server B</text>
                    <text class="svg-text" x="307.5" y="255" font-size="44" text-anchor="middle">🐠</text>
                </g>

                <!-- Shared State (Redis Cache / Token) -->
                <g id="s3-shared-store">
                    <!-- Database Cylinder Shape -->
                    <path d="M 110 345 C 110 330, 290 330, 290 345 L 290 415 C 290 430, 110 430, 110 415 Z"
                        fill="#282c34" stroke="#C678DD" stroke-width="3" />
                    <ellipse cx="200" cy="345" rx="90" ry="15" fill="#1e1e24" stroke="#C678DD" stroke-width="3" />
                    <text class="svg-text" x="200" y="385" fill="#C678DD" font-size="20" font-weight="bold"
                        text-anchor="middle">Shared DB / Redis</text>
                    <!-- session record details -->
                    <text id="s3-db-record" class="svg-text" x="200" y="412" fill="#fff" font-size="16"
                        text-anchor="middle" opacity="0.6">Session Token Store 🔑</text>
                </g>

                <!-- Network Paths -->
                <!-- Client -> LB -->
                <path d="M 200 55 L 200 85" stroke="#abb2bf" stroke-width="2.5" stroke-dasharray="4,4" fill="none" />
                <!-- LB -> Server A -->
                <path id="s3-path-a" d="M 150 135 L 92.5 170" stroke="#5c6370" stroke-width="2.5" stroke-dasharray="4,4"
                    fill="none" />
                <!-- LB -> Server B -->
                <path id="s3-path-b" d="M 250 135 L 307.5 170" stroke="#5c6370" stroke-width="2.5"
                    stroke-dasharray="4,4" fill="none" />

                <!-- Server A -> Shared DB -->
                <path id="s3-db-a" d="M 92.5 290 L 155 345" stroke="#5c6370" stroke-width="2.5" stroke-dasharray="4,4"
                    fill="none" />
                <!-- Server B -> Shared DB -->
                <path id="s3-db-b" d="M 307.5 290 L 245 345" stroke="#5c6370" stroke-width="2.5" stroke-dasharray="4,4"
                    fill="none" />

                <!-- Crash Lightning on Server A -->
                <path id="s3-lightning-a" d="M 92.5 70 L 82.5 115 L 97.5 115 L 92.5 170" fill="none" stroke="#E5C07B"
                    stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0" />

                <g id="s3-request-dots"></g>
            </svg>

            <div id="s3-status" class="status-text text-green">Stateless Cluster Scaling</div>
        </div>



        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <script>
        const VIDEO_PLAN = [
            // Scene 1: Goldfish Hook
            {
                id: "step-01-goldfish",
                kind: "narration+visual",
                text: "Ever met a goldfish?"
            },
            {
                id: "step-02-stateless-op",
                kind: "narration+visual",
                text: "That's exactly how a stateless server operates!"
            },
            {
                id: "step-03-forget",
                kind: "narration+visual",
                text: "It forgets you the instant your request finishes."
            },
            {
                id: "step-04-compare",
                kind: "narration+visual",
                text: "But how does this compare to a stateful server?"
            },
            // Scene 2: Stateful Server (Dog)
            {
                id: "step-05-stateful-first",
                kind: "narration+visual",
                text: "Let's look at Stateful first."
            },
            {
                id: "step-06-dog-remember",
                kind: "narration+visual",
                text: "Like a loyal dog, a stateful server remembers your session,"
            },
            {
                id: "step-07-store-memory",
                kind: "narration+visual",
                text: "storing your shopping cart or login state directly in its local memory."
            },
            {
                id: "step-08-stateful-crash",
                kind: "narration+visual",
                text: "But what if this server crashes? Boom!"
            },
            {
                id: "step-09-stateful-nightmare",
                kind: "narration+visual",
                text: "All your data is gone, and scaling is a nightmare."
            },
            // Scene 3: Stateless Resiliency
            {
                id: "step-10-stateless-goldfish",
                kind: "narration+visual",
                text: "Now, enter Stateless—the Goldfish."
            },
            {
                id: "step-11-no-store",
                kind: "narration+visual",
                text: "It stores absolutely no session data."
            },
            {
                id: "step-12-stranger",
                kind: "narration+visual",
                text: "Every single request is treated as a brand-new stranger."
            },
            {
                id: "step-13-offload",
                kind: "narration+visual",
                text: "Instead, it offloads state to a shared external database or token."
            },
            {
                id: "step-14-failover",
                kind: "narration+visual",
                text: "If one server dies, another takes over instantly without missing a beat!"
            },
            {
                id: "step-15-scaling-breeze",
                kind: "narration+visual",
                text: "This makes scaling a breeze,"
            },
            {
                id: "step-16-no-sync",
                kind: "narration+visual",
                text: "allowing you to add hundreds of servers without any session syncing."
            }
        ];

        window.__VIDEO_PLAN__ = VIDEO_PLAN;

        window.__VIDEO_METADATA__ = {
            contractVersion: "0.1",
            title: "Stateful vs Stateless Server",
            aspectRatio: "9:16"
        };

        function byId(id) {
            return document.getElementById(id);
        }

        function setOpacity(id, value) {
            const el = byId(id);
            if (el) el.style.opacity = String(value);
        }

        const SUBTITLE_CUES = {
            "step-01-goldfish": [[0.0, "Ever met a goldfish?"]],
            "step-02-stateless-op": [[0.0, "That's exactly how a stateless server operates!"]],
            "step-03-forget": [[0.0, "It forgets you the instant your request finishes."]],
            "step-04-compare": [[0.0, "But how does this compare to a stateful server?"]],
            "step-05-stateful-first": [[0.0, "Let's look at Stateful first."]],
            "step-06-dog-remember": [[0.0, "Like a loyal dog, a stateful server remembers your session,"]],
            "step-07-store-memory": [[0.0, "storing your shopping cart or login state directly in its local memory."]],
            "step-08-stateful-crash": [[0.0, "But what if this server crashes? Boom!"]],
            "step-09-stateful-nightmare": [[0.0, "All your data is gone, and scaling is a nightmare."]],
            "step-10-stateless-goldfish": [[0.0, "Now, enter Stateless—the Goldfish."]],
            "step-11-no-store": [[0.0, "It stores absolutely no session data."]],
            "step-12-stranger": [[0.0, "Every single request is treated as a brand-new stranger."]],
            "step-13-offload": [[0.0, "Instead, it offloads state to a shared external database or token."]],
            "step-14-failover": [[0.0, "If one server dies, another takes over instantly without missing a beat!"]],
            "step-15-scaling-breeze": [[0.0, "This makes scaling a breeze,"]],
            "step-16-no-sync": [[0.0, "allowing you to add hundreds of servers without any session syncing."]]
        };

        function subtitleTextFor(segment, localTime) {
            const cues = SUBTITLE_CUES[segment.id] || [[0, String(segment.text || "")]];
            let text = cues[0][1];
            for (const [start, cueText] of cues) {
                if (localTime >= start) text = cueText;
                else break;
            }
            return text;
        }

        function showSubtitle(segment, localTime) {
            const subtitle = byId('subtitle-caption');
            if (!subtitle) return;
            const text = subtitleTextFor(segment, localTime);
            subtitle.textContent = text;
            subtitle.style.opacity = text ? "1" : "0";
            subtitle.classList.toggle('visible', Boolean(text));
        }

        function switchScene(sceneId) {
            document.querySelectorAll('.scene').forEach(s => {
                s.classList.remove('active');
                s.style.opacity = "0";
            });
            const scene = byId(sceneId);
            if (!scene) return;
            scene.classList.add('active');
            scene.style.opacity = "1";
        }

        function resetVisualState() {
            // Scene 1 resets
            setOpacity('s1-query-box', 0);
            byId('s1-request-dots').innerHTML = '';
            byId('s1-status').textContent = 'Scanning Network...';
            byId('s1-status').className = 'status-text text-yellow';

            // Scene 2 resets
            byId('s2-server-box').setAttribute('stroke', '#61AFEF');
            byId('s2-server-box').setAttribute('fill', '#282c34');
            byId('s2-server-group').setAttribute('transform', 'translate(0, 0)');
            setOpacity('s2-records', 1);
            byId('s2-records').removeAttribute('transform');
            setOpacity('s2-sync-line', 1);
            setOpacity('s2-lightning', 0);
            setOpacity('s2-crash-overlay', 0);
            byId('s2-dog').textContent = '🐕';
            byId('s2-dog').style.opacity = '1';
            byId('s2-status').textContent = 'Connected: Session Saved';
            byId('s2-status').className = 'status-text text-green';
            byId('s2-request-dots').innerHTML = '';

            // Scene 3 resets
            byId('s3-sa-box').setAttribute('stroke', '#98c379');
            byId('s3-sa-box').setAttribute('fill', '#282c34');
            setOpacity('s3-sa-crash', 0);
            setOpacity('s3-sa-goldfish', 1);
            byId('s3-sa-goldfish').removeAttribute('transform');
            setOpacity('s3-lightning-a', 0);
            byId('s3-status').textContent = 'Stateless Cluster Scaling';
            byId('s3-status').className = 'status-text text-green';
            byId('s3-request-dots').innerHTML = '';
            byId('s3-shared-store').removeAttribute('transform');
            byId('s3-lb').setAttribute('transform', 'translate(100, 85)');
            setOpacity('s3-server-c', 0);
            setOpacity('s3-server-d', 0);
            setOpacity('s3-server-e', 0);
            setOpacity('s3-server-f', 0);
        }

        function estimateSegmentDuration(segment) {
            if (Number.isFinite(Number(segment.resolvedDuration))) return Number(segment.resolvedDuration);
            if (Number.isFinite(Number(segment.duration))) return Number(segment.duration);
            const words = String(segment.text || '').trim().split(/\s+/).filter(Boolean).length;
            return Math.max(2.5, words / 2.65);
        }

        function setProgress(index, localTime, globalTime) {
            let progress = 0;
            if (Number.isFinite(globalTime) && Number.isFinite(window.__VIDEO_DURATION__) && window.__VIDEO_DURATION__ > 0) {
                progress = globalTime / window.__VIDEO_DURATION__;
            } else {
                let elapsed = 0;
                let total = 0;
                for (let i = 0; i < VIDEO_PLAN.length; i++) {
                    const duration = estimateSegmentDuration(VIDEO_PLAN[i]);
                    total += duration;
                    if (i < index) elapsed += duration;
                    else if (i === index) elapsed += Math.min(Math.max(localTime, 0), duration);
                }
                progress = total > 0 ? elapsed / total : 0;
            }
            byId('progress-bar').style.width = `${Math.max(0, Math.min(1, progress)) * 100}%`;
        }

        // Mathematical interpolation helper
        function interpolate(val, start, end, fromVal, toVal) {
            if (val <= start) return fromVal;
            if (val >= end) return toVal;
            return fromVal + (toVal - fromVal) * ((val - start) / (end - start));
        }

        function renderSection(segment, localTime, globalTime = NaN) {
            const index = Math.max(0, VIDEO_PLAN.findIndex(item => item.id === segment.id));
            resetVisualState();
            setProgress(index, localTime, globalTime);

            const isScene1 = ['step-01-goldfish', 'step-02-stateless-op', 'step-03-forget', 'step-04-compare'].includes(segment.id);
            const isScene2 = ['step-05-stateful-first', 'step-06-dog-remember', 'step-07-store-memory', 'step-08-stateful-crash', 'step-09-stateful-nightmare'].includes(segment.id);
            const isScene3 = ['step-10-stateless-goldfish', 'step-11-no-store', 'step-12-stranger', 'step-13-offload', 'step-14-failover', 'step-15-scaling-breeze', 'step-16-no-sync'].includes(segment.id);

            const t_continuous = Number.isFinite(globalTime) ? globalTime : localTime;

            if (isScene1) {
                switchScene('scene1');

                // Animate fish swimming (idle sine path)
                const fishX = 200 + Math.sin(t_continuous * 2.5) * 25;
                const fishY = 180 + Math.cos(t_continuous * 1.5) * 12;
                const fishScale = Math.cos(t_continuous * 2.5) >= 0 ? 1 : -1;
                byId('s1-fish').setAttribute('transform', `translate(${fishX}, ${fishY}) scale(${fishScale}, 1)`);

                // Bubbles rising
                const b1Y = 200 - ((t_continuous * 30) % 80);
                const b2Y = 180 - (((t_continuous + 0.8) * 30) % 80);
                const b3Y = 160 - (((t_continuous + 1.6) * 30) % 80);
                byId('s1-bubble-1').setAttribute('cy', String(b1Y));
                byId('s1-bubble-2').setAttribute('cy', String(b2Y));
                byId('s1-bubble-3').setAttribute('cy', String(b3Y));

                // Step specific visuals
                if (segment.id === 'step-01-goldfish') {
                    byId('s1-status').textContent = 'Scanning Network...';
                    byId('s1-status').className = 'status-text text-yellow';
                }
                else if (segment.id === 'step-02-stateless-op') {
                    byId('s1-status').textContent = 'Active Connection Established';
                    byId('s1-status').className = 'status-text text-blue';
                }
                else if (segment.id === 'step-03-forget') {
                    // Query box pops up when fish forgets
                    const queryOpacity = interpolate(localTime, 0, 0.4, 0, 1);
                    setOpacity('s1-query-box', queryOpacity);

                    const thoughtScale = interpolate(localTime, 0, 0.3, 0.7, 1);
                    byId('s1-query-box').setAttribute('transform', `translate(${(1 - thoughtScale) * -317.5}, ${(1 - thoughtScale) * -252.5}) scale(${thoughtScale})`);

                    byId('s1-status').textContent = 'Request Terminated: State Erased';
                    byId('s1-status').className = 'status-text text-red';
                }
                else if (segment.id === 'step-04-compare') {
                    setOpacity('s1-query-box', 0);
                    byId('s1-status').textContent = 'How does it compare?';
                    byId('s1-status').className = 'status-text text-blue';
                }

                // Request packet dots flying from client (70, 353) to server (327.5, 353)
                let s1DotsHtml = '';
                const cycle = localTime % 1.6;
                const p = cycle / 1.6;
                const cx = 70 + (327.5 - 70) * p;
                const cy = 353;
                let fill = 'var(--accent-green)';
                if (segment.id === 'step-03-forget' && p > 0.6) {
                    fill = 'var(--accent-red)';
                }
                if (segment.id !== 'step-04-compare') {
                    s1DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="${fill}" />`;
                }
                byId('s1-request-dots').innerHTML = s1DotsHtml;
            }

            else if (isScene2) {
                switchScene('scene2');

                if (segment.id === 'step-05-stateful-first') {
                    let s2DotsHtml = '';
                    const cycle = localTime % 2.5;
                    if (cycle < 1.0) {
                        const p = cycle / 1.0;
                        const cx = interpolate(p, 0, 1, 200, 105);
                        const cy = interpolate(p, 0, 1, 420, 250);
                        s2DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-green)" />`;
                    } else if (cycle >= 1.2 && cycle < 2.2) {
                        const p = (cycle - 1.2) / 1.0;
                        const cx = interpolate(p, 0, 1, 105, 200);
                        const cy = interpolate(p, 0, 1, 250, 420);
                        s2DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-blue)" />`;
                    }
                    byId('s2-request-dots').innerHTML = s2DotsHtml;

                    byId('s2-status').textContent = 'Connected: Session Saved';
                    byId('s2-status').className = 'status-text text-green';
                }
                else if (segment.id === 'step-06-dog-remember') {
                    let s2DotsHtml = '';
                    const cycle = localTime % 2.5;
                    if (cycle < 1.0) {
                        const p = cycle / 1.0;
                        const cx = interpolate(p, 0, 1, 200, 105);
                        const cy = interpolate(p, 0, 1, 420, 250);
                        s2DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-green)" />`;
                    } else if (cycle >= 1.2 && cycle < 2.2) {
                        const p = (cycle - 1.2) / 1.0;
                        const cx = interpolate(p, 0, 1, 105, 200);
                        const cy = interpolate(p, 0, 1, 250, 420);
                        s2DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-blue)" />`;
                    }
                    byId('s2-request-dots').innerHTML = s2DotsHtml;

                    // Animate sync line
                    byId('s2-sync-line').setAttribute('stroke-dashoffset', String(-localTime * 15));
                    
                    byId('s2-status').textContent = 'Dog Remembers: Active Session';
                    byId('s2-status').className = 'status-text text-green';
                }
                else if (segment.id === 'step-07-store-memory') {
                    let s2DotsHtml = '';
                    const cycle = localTime % 2.5;
                    if (cycle < 1.0) {
                        const p = cycle / 1.0;
                        const cx = interpolate(p, 0, 1, 200, 105);
                        const cy = interpolate(p, 0, 1, 420, 250);
                        s2DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-green)" />`;
                    } else if (cycle >= 1.2 && cycle < 2.2) {
                        const p = (cycle - 1.2) / 1.0;
                        const cx = interpolate(p, 0, 1, 105, 200);
                        const cy = interpolate(p, 0, 1, 250, 420);
                        s2DotsHtml += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-blue)" />`;
                    }
                    byId('s2-request-dots').innerHTML = s2DotsHtml;

                    // Highlight scaling effect on records
                    const recordScale = 1.0 + Math.sin(localTime * 4) * 0.05;
                    byId('s2-records').setAttribute('transform', `translate(290, 260) scale(${recordScale}) translate(-290, -260)`);
                    
                    byId('s2-status').textContent = 'Storing Cart & Login in RAM';
                    byId('s2-status').className = 'status-text text-green';
                }
                else if (segment.id === 'step-08-stateful-crash') {
                    // Lightning strike
                    const lOpacity = interpolate(localTime, 0, 0.4, 0, 1) - interpolate(localTime, 1.2, 1.5, 0, 1);
                    setOpacity('s2-lightning', lOpacity);

                    // Shake server
                    if (localTime < 1.5) {
                        const shake = Math.sin(localTime * 55) * 4;
                        byId('s2-server-group').setAttribute('transform', `translate(${shake}, 0)`);
                    } else {
                        byId('s2-server-group').setAttribute('transform', 'translate(0, 0)');
                    }

                    byId('s2-server-box').setAttribute('stroke', 'var(--accent-red)');
                    byId('s2-server-box').setAttribute('fill', '#2d1e22');

                    byId('s2-dog').style.opacity = '0';
                    setOpacity('s2-crash-overlay', 1);

                    const fade = Math.max(0, 1 - localTime * 1.5);
                    setOpacity('s2-records', fade);
                    setOpacity('s2-sync-line', fade);

                    byId('s2-status').textContent = '⚠️ SERVER CRASHED: Session Lost!';
                    byId('s2-status').className = 'status-text text-red';
                }
                else if (segment.id === 'step-09-stateful-nightmare') {
                    // Post-crash nightmare, traffic returns red errors.
                    byId('s2-server-box').setAttribute('stroke', 'var(--accent-red)');
                    byId('s2-server-box').setAttribute('fill', '#2d1e22');
                    byId('s2-dog').style.opacity = '1';
                    byId('s2-dog').textContent = '😢';
                    setOpacity('s2-crash-overlay', 0);
                    setOpacity('s2-records', 0);
                    setOpacity('s2-sync-line', 0);

                    let postCrashDots = '';
                    const t = localTime % 2.5;
                    if (t < 1.0) {
                        const p = t / 1.0;
                        const cx = interpolate(p, 0, 1, 200, 105);
                        const cy = interpolate(p, 0, 1, 420, 250);
                        postCrashDots += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-green)" />`;
                    } else if (t >= 1.0 && t < 2.0) {
                        const p = (t - 1.0) / 1.0;
                        const cx = interpolate(p, 0, 1, 105, 200);
                        const cy = interpolate(p, 0, 1, 250, 420);
                        postCrashDots += `<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent-red)" />`;
                    }
                    byId('s2-request-dots').innerHTML = postCrashDots;

                    byId('s2-status').textContent = 'Session Lost (User logged out)';
                    byId('s2-status').className = 'status-text text-red';
                }
            }

            else if (isScene3) {
                switchScene('scene3');

                let s3DotsHtml = '';

                // In steps 10, 11, 12, 13: Server A is active and processing requests.
                if (['step-10-stateless-goldfish', 'step-11-no-store', 'step-12-stranger', 'step-13-offload'].includes(segment.id)) {
                    const t = localTime % 2.8;
                    if (t < 0.8) {
                        // Client -> LB
                        const p = t / 0.8;
                        const cx = 200;
                        const cy = interpolate(p, 0, 1, 32.5, 110);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    } else if (t >= 0.8 && t < 1.4) {
                        // LB -> Server A
                        const p = (t - 0.8) / 0.6;
                        const cx = interpolate(p, 0, 1, 200, 92.5);
                        const cy = interpolate(p, 0, 1, 110, 230);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    } else if (t >= 1.4 && t < 2.0) {
                        // Server A -> Shared DB query
                        const p = (t - 1.4) / 0.6;
                        const cx = interpolate(p, 0, 1, 92.5, 160);
                        const cy = interpolate(p, 0, 1, 230, 345);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-blue)" />`;

                        setOpacity('s3-db-record', 1);
                    } else if (t >= 2.0 && t < 2.6) {
                        // Server A -> Client Response
                        const p = (t - 2.0) / 0.6;
                        const cx = interpolate(p, 0, 1, 92.5, 200);
                        const cy = interpolate(p, 0, 1, 230, 32.5);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    }

                    if (segment.id === 'step-10-stateless-goldfish') {
                        byId('s3-status').textContent = 'Stateless Cluster Active';
                        byId('s3-status').className = 'status-text text-green';
                    }
                    else if (segment.id === 'step-11-no-store') {
                        // Highlight that no local data is stored on servers (pulse goldfish scale)
                        const scale = 1.0 + Math.sin(localTime * 5) * 0.15;
                        byId('s3-sa-goldfish').setAttribute('transform', `translate(92.5, 255) scale(${scale}) translate(-92.5, -255)`);
                        byId('s3-status').textContent = 'Zero Local State Stored';
                        byId('s3-status').className = 'status-text text-blue';
                    }
                    else if (segment.id === 'step-12-stranger') {
                        byId('s3-status').textContent = 'Every Request is a New Stranger';
                        byId('s3-status').className = 'status-text text-yellow';
                    }
                    else if (segment.id === 'step-13-offload') {
                        // Highlight Shared DB
                        const dbScale = 1.0 + Math.sin(localTime * 4) * 0.04;
                        byId('s3-shared-store').setAttribute('transform', `translate(200, 380) scale(${dbScale}) translate(-200, -380)`);
                        byId('s3-status').textContent = 'Offloading State to Shared DB';
                        byId('s3-status').className = 'status-text text-blue';
                    }
                }

                // In step-14-failover: Lightning strikes Server A, and requests reroute to Server B.
                else if (segment.id === 'step-14-failover') {
                    // Lightning strike
                    if (localTime < 1.5) {
                        const lOpacity = interpolate(localTime, 0, 0.2, 0, 1) - interpolate(localTime, 1.2, 1.5, 0, 1);
                        setOpacity('s3-lightning-a', lOpacity);
                    }

                    // Server A crash visuals
                    byId('s3-sa-box').setAttribute('stroke', 'var(--accent-red)');
                    byId('s3-sa-box').setAttribute('fill', '#2d1e22');
                    setOpacity('s3-sa-crash', 1);
                    setOpacity('s3-sa-goldfish', 0);

                    byId('s3-status').textContent = '⚠️ Server A Down! Failover in Progress...';
                    byId('s3-status').className = 'status-text text-yellow';

                    // Traffic reroutes to Server B
                    const t = localTime % 2.8;
                    if (t < 0.8) {
                        // Client -> LB
                        const p = t / 0.8;
                        const cx = 200;
                        const cy = interpolate(p, 0, 1, 32.5, 110);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    } else if (t >= 0.8 && t < 1.4) {
                        // LB -> Server B
                        const p = (t - 0.8) / 0.6;
                        const cx = interpolate(p, 0, 1, 200, 307.5);
                        const cy = interpolate(p, 0, 1, 110, 230);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    } else if (t >= 1.4 && t < 2.0) {
                        // Server B -> Shared DB query
                        const p = (t - 1.4) / 0.6;
                        const cx = interpolate(p, 0, 1, 307.5, 240);
                        const cy = interpolate(p, 0, 1, 230, 345);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-blue)" />`;
                    } else if (t >= 2.0 && t < 2.6) {
                        // Server B -> Client response
                        const p = (t - 2.0) / 0.6;
                        const cx = interpolate(p, 0, 1, 307.5, 200);
                        const cy = interpolate(p, 0, 1, 230, 32.5);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    }
                }

                // In steps 15 & 16: Failover success, traffic flows smoothly to Server B.
                else if (['step-15-scaling-breeze', 'step-16-no-sync'].includes(segment.id)) {
                    // Server A remains crashed
                    byId('s3-sa-box').setAttribute('stroke', 'var(--accent-red)');
                    byId('s3-sa-box').setAttribute('fill', '#2d1e22');
                    setOpacity('s3-sa-crash', 1);
                    setOpacity('s3-sa-goldfish', 0);

                    // Traffic to Server B
                    const t = localTime % 2.8;
                    if (t < 0.8) {
                        const p = t / 0.8;
                        const cx = 200;
                        const cy = interpolate(p, 0, 1, 32.5, 110);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    } else if (t >= 0.8 && t < 1.4) {
                        const p = (t - 0.8) / 0.6;
                        const cx = interpolate(p, 0, 1, 200, 307.5);
                        const cy = interpolate(p, 0, 1, 110, 230);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    } else if (t >= 1.4 && t < 2.0) {
                        const p = (t - 1.4) / 0.6;
                        const cx = interpolate(p, 0, 1, 307.5, 240);
                        const cy = interpolate(p, 0, 1, 230, 345);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-blue)" />`;
                    } else if (t >= 2.0 && t < 2.6) {
                        const p = (t - 2.0) / 0.6;
                        const cx = interpolate(p, 0, 1, 307.5, 200);
                        const cy = interpolate(p, 0, 1, 230, 32.5);
                        s3DotsHtml += `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--accent-green)" />`;
                    }

                    if (segment.id === 'step-15-scaling-breeze') {
                        byId('s3-status').textContent = 'Failover Success! Session Restored ✅';
                        byId('s3-status').className = 'status-text text-green';
                    }
                    else if (segment.id === 'step-16-no-sync') {
                        byId('s3-status').textContent = 'Scales Horizontally with Ease';
                        byId('s3-status').className = 'status-text text-green';

                        // Highlight scale of Load Balancer
                        const lbScale = 1.0 + Math.sin(localTime * 3) * 0.02;
                        byId('s3-lb').setAttribute('transform', `translate(100, 85) translate(100, 25) scale(${lbScale}) translate(-100, -25)`);

                        // Fade in extra scaling servers
                        setOpacity('s3-server-c', interpolate(localTime, 0.4, 0.8, 0, 1));
                        setOpacity('s3-server-d', interpolate(localTime, 0.8, 1.2, 0, 1));
                        setOpacity('s3-server-e', interpolate(localTime, 1.2, 1.6, 0, 0.6));
                        setOpacity('s3-server-f', interpolate(localTime, 1.6, 2.0, 0, 0.6));
                    }
                }

                byId('s3-request-dots').innerHTML = s3DotsHtml;
            }
        }

        window.__RENDER_SECTION__ = renderSection;

        const params = new URLSearchParams(window.location.search);
        if (params.get('export') === '1') {
            document.body.classList.add('export-mode');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSection(VIDEO_PLAN[0], 0);
        });

        let lectureInterval = null;
        function startLecture() {
            if (lectureInterval) clearInterval(lectureInterval);

            let step = 0;
            let time = 0;
            byId('play-overlay').style.display = 'none';

            resetVisualState();
            renderSection(VIDEO_PLAN[step], time);

            const tick = 0.05;
            lectureInterval = setInterval(() => {
                time += tick;
                const duration = estimateSegmentDuration(VIDEO_PLAN[step]);

                if (time > duration) {
                    time = 0;
                    step++;
                }

                if (step >= VIDEO_PLAN.length) {
                    clearInterval(lectureInterval);
                    byId('play-overlay').style.display = 'flex';
                    return;
                }

                renderSection(VIDEO_PLAN[step], time);
            }, tick * 1000);
        }
    </script>

</body>

</html>
