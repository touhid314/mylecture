<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatQuest PCA</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background-color: white;
  }
  #container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 2vw;
  }
  
  #top_area {
    height: 15%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  #visual_stage {
    flex-grow: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5vw; /* For placing table and plot side-by-side cleanly */
  }
  
  #bottom_area {
    height: 20%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .hidden { display: none !important; }
  
  /* Titles */
  #main_title {
    font-weight: bold;
    font-size: 4vw;
    color: black;
    text-align: center;
    white-space: pre-line;
  }

  /* Diagrams */
  #cells_diagram {
    width: 45vh;
    height: 45vh;
  }
  
  .circle {
    stroke: black;
    stroke-width: 2;
    transition: opacity 0.2s; /* smooth dimming */
  }
  
  .highlight-circle {
    stroke: #ffcc00 !important;
    stroke-width: 5px !important;
  }
  
  .floating-text {
    position: absolute;
    font-size: 2vw;
    color: black;
    white-space: pre-line;
    z-index: 20;
    text-align: center;
    background: rgba(255,255,255,0.8);
    padding: 0.5vw;
    border-radius: 4px;
  }

  /* Texts */
  #caption_text {
    font-size: 2.8vw;
    color: black;
    white-space: pre-line;
    margin-bottom: 1vw;
  }
  
  #psst_text {
    font-size: 1.8vw;
    color: #444;
  }

  /* Table */
  table {
    border-collapse: collapse;
    font-size: 2.5vh;
    font-family: sans-serif;
  }
  th, td {
    padding: 1vw 1.5vw;
    text-align: center;
    border: 2px solid white;
  }
  th { background-color: #d0e4f5; }
  .gene-col { background-color: #2c4c7c; color: white; font-weight: bold; }
  .data-cell { background-color: #e8f4fc; }
  
  .highlighted-col {
    background-color: #ffcccc !important;
    border: 3px solid red !important;
  }

  /* Scatter Plot */
  #scatter_plot {
    width: 45vh;
    height: 45vh;
  }
  
  .axis {
    stroke: black;
    stroke-width: 1;
  }
  .dot {
    fill: #007bff;
  }
  .highlight-dot {
    fill: red;
    stroke: black;
    stroke-width: 1;
  }
</style>
</head>
<body>
<div id="container">

  <div id="top_area">
    <div id="main_title" class="hidden"></div>
  </div>
  
  <div id="visual_stage">
    <!-- Cells Diagram -->
    <svg id="cells_diagram" class="hidden" viewBox="0 0 400 400">
      <circle id="c1" cx="200" cy="200" r="25" class="circle" />
      <circle id="c2" cx="200" cy="150" r="25" class="circle" />
      <circle id="c3" cx="200" cy="250" r="25" class="circle" />
      <circle id="c4" cx="150" cy="175" r="25" class="circle" />
      <circle id="c5" cx="150" cy="225" r="25" class="circle" />
      <circle id="c6" cx="100" cy="200" r="25" class="circle" />
      <circle id="c7" cx="120" cy="140" r="25" class="circle" />
      <circle id="c8" cx="120" cy="260" r="25" class="circle" />
      <circle id="c9" cx="250" cy="175" r="25" class="circle" />
      <circle id="c10" cx="250" cy="125" r="25" class="circle" />
      <circle id="c11" cx="280" cy="160" r="25" class="circle" />
      <circle id="c12" cx="250" cy="225" r="25" class="circle" />
      <circle id="c13" cx="250" cy="275" r="25" class="circle" />
      <circle id="c14" cx="280" cy="240" r="25" class="circle" />
      <circle id="c15" cx="280" cy="290" r="25" class="circle" />
      <circle id="c16" cx="220" cy="300" r="25" class="circle" />
    </svg>

    <!-- Scatter Plot -->
    <svg id="scatter_plot" class="hidden" viewBox="-20 -20 130 130">
      <line x1="0" y1="100" x2="100" y2="100" class="axis" />
      <line x1="0" y1="100" x2="0" y2="0" class="axis" />
      <text x="50" y="115" font-size="6" text-anchor="middle">Cell2</text>
      <text x="-15" y="50" font-size="6" text-anchor="middle" transform="rotate(-90 -15,50)">Cell1</text>
      <g id="plot_dots"></g>
    </svg>

    <!-- Data Table -->
    <table id="data_table" class="hidden">
      <thead>
        <tr>
          <th></th>
          <th>Cell1</th>
          <th>Cell2</th>
          <th class="col-hide">Cell3</th>
          <th class="col-hide">Cell4</th>
          <th class="col-hide">...</th>
        </tr>
      </thead>
      <tbody>
        <!-- JS will populate -->
      </tbody>
    </table>

    <div id="pointer_text1" class="floating-text hidden" style="left: 10vw; top: 40%; width: 20vw;"></div>
    <div id="pointer_text2" class="floating-text hidden" style="right: 10vw; top: 20%; width: 20vw;"></div>
    <div id="pointer_text3" class="floating-text hidden" style="right: 10vw; bottom: 10%; width: 20vw;"></div>
    <div id="pointer_text4" class="floating-text hidden" style="left: 2vw; top: 10%; width: 20vw;"></div>
    <div id="pointer_text5" class="floating-text hidden" style="left: 15vw; bottom: 0%; width: 30vw;"></div>
  </div>

  <div id="bottom_area">
    <div id="caption_text" class="hidden"></div>
    <div id="psst_text" class="hidden"></div>
  </div>

</div>

<script>
window.__VIDEO_METADATA__ = {
  contractVersion: "0.1",
  title: "StatQuest PCA 2 min",
  aspectRatio: "16:9"
};

const PLAN = [
  { id: "intro-1", kind: "narration+visual", audio: "audio/intro-1.wav", text: "StatQuest..." },
  { id: "intro-2", kind: "narration+visual", audio: "audio/intro-2.wav", text: "...is the best!!" },
  { id: "intro-3", kind: "narration+visual", audio: "audio/intro-3.wav", text: "If you don't think so..." },
  { id: "intro-4", kind: "narration+visual", audio: "audio/intro-4.wav", text: "...then we have different opinions!!!" },
  { id: "intro-5", kind: "narration+visual", audio: "audio/intro-5.wav", text: "Hello, I'm Josh Starmer and welcome to StatQuest. Today we're going to be talking about the main ideas behind principal component analysis, and we're going to cover those concepts in 5 minutes." },
  { id: "intro-6", kind: "narration+visual", audio: "audio/intro-6.wav", text: "If you want more details than you get here, be sure to check out my other PCA video." },
  { id: "cells-1", kind: "narration+visual", audio: "audio/cells-1.wav", text: "Let's say we had some normal cells..." },
  { id: "cells-2", kind: "narration+visual", audio: "audio/cells-2.wav", text: "If you're not a biologist, imagine that these could be people, or cars, or cities, or etc. They could be anything." },
  { id: "cells-3", kind: "narration+visual", audio: "audio/cells-3.wav", text: "Even though they look the same, we suspect that there are differences..." },
  { id: "cells-4", kind: "narration+visual", audio: "audio/cells-4.wav", text: "These might be one type of cell..." },
  { id: "cells-5", kind: "narration+visual", audio: "audio/cells-5.wav", text: "(or one type of person, or car, or city, etc...)" },
  { id: "cells-6", kind: "narration+visual", audio: "audio/cells-6.wav", text: "These might be another type of cell..." },
  { id: "cells-7", kind: "narration+visual", audio: "audio/cells-7.wav", text: "And lastly, these might be a third type of cell." },
  { id: "seq-1", kind: "narration+visual", audio: "audio/seq-1.wav", text: "Unfortunately, we can't observe the differences from the outside..." },
  { id: "seq-2", kind: "narration+visual", audio: "audio/seq-2.wav", text: "...so we sequence the messenger RNA in each cell to identify which genes are active. This tells us what the cell is doing." },
  { id: "seq-3", kind: "narration+visual", audio: "audio/seq-3.wav", text: "(If they were people, we could measure their weight, blood pressure, reading level, etc...)" },
  { id: "data-1", kind: "narration+visual", audio: "audio/data-1.wav", text: "Okay, here's the data..." },
  { id: "data-2", kind: "narration+visual", audio: "audio/data-2.wav", text: "Each column shows how much each gene is transcribed in each cell." },
  { id: "data-3", kind: "narration+visual", audio: "audio/data-3.wav", text: "For now, let's imagine there are only two cells." },
  { id: "plot-1", kind: "narration+visual", audio: "audio/plot-1.wav", text: "If we just have two cells, then we can plot the measurements for each gene." },
  { id: "plot-2", kind: "narration+visual", audio: "audio/plot-2.wav", text: "This gene, Gene1, is highly transcribed in Cell1 and lowly transcribed in Cell2..." },
  { id: "plot-3", kind: "narration+visual", audio: "audio/plot-3.wav", text: "...and this gene, Gene9, is lowly transcribed in Cell1 and highly transcribed in Cell2." }
];

window.__VIDEO_PLAN__ = PLAN;

const tableData = [
  ["Gene1", "3", "0.25", "2.8", "0.1", "..."],
  ["Gene2", "2.9", "0.8", "2.2", "1.8", "..."],
  ["Gene3", "2.2", "1", "1.5", "3.2", "..."],
  ["Gene4", "2", "1.4", "2", "0.3", "..."],
  ["Gene5", "1.3", "1.6", "1.6", "0", "..."],
  ["Gene6", "1.5", "2.1", "2.1", "3", "..."],
  ["Gene7", "1.1", "2.2", "1.2", "2.8", "..."],
  ["Gene8", "1", "2.7", "0.9", "0.3", "..."],
  ["Gene9", "0.4", "3", "0.6", "0.1", "..."]
];

function initTable() {
  const tbody = document.querySelector("#data_table tbody");
  tableData.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="gene-col">${row[0]}</td>
      <td class="data-cell col1">${row[1]}</td>
      <td class="data-cell col2">${row[2]}</td>
      <td class="data-cell col3 col-hide">${row[3]}</td>
      <td class="data-cell col4 col-hide">${row[4]}</td>
      <td class="data-cell col5 col-hide">${row[5]}</td>
    `;
    tbody.appendChild(tr);
  });
  
  const ths = document.querySelectorAll("#data_table th");
  if(ths.length > 5) {
      ths[1].classList.add("th-col1");
      ths[2].classList.add("th-col2");
      ths[3].classList.add("th-col3");
  }
}
initTable();

const plotData = [
  [0.25, 3],
  [0.8, 2.9],
  [1, 2.2],
  [1.4, 2],
  [1.6, 1.3],
  [2.1, 1.5],
  [2.2, 1.1],
  [2.7, 1],
  [3, 0.4]
];

function initPlot() {
  const g = document.getElementById("plot_dots");
  plotData.forEach((pt, index) => {
    const cx = pt[0] * (100/4);
    const cy = 100 - (pt[1] * (100/4));
    g.innerHTML += `<circle id="dot${index+1}" cx="${cx}" cy="${cy}" r="3" class="dot" />`;
  });
}
initPlot();

function hideAll() {
  const els = ["main_title", "cells_diagram", "caption_text", "psst_text", "data_table", "scatter_plot", "pointer_text1", "pointer_text2", "pointer_text3", "pointer_text4", "pointer_text5"];
  els.forEach(id => document.getElementById(id).classList.add("hidden"));
}

function setCirclesColorAndHighlight(highlightIndices, isHighlighted, color) {
  const circles = document.querySelectorAll(".circle");
  circles.forEach((c, i) => {
    c.style.fill = highlightIndices.includes(i) || highlightIndices === "all" ? color : "green";
    
    if (isHighlighted && highlightIndices !== "all" && highlightIndices.includes(i)) {
      c.classList.add("highlight-circle");
    } else {
      c.classList.remove("highlight-circle");
    }
  });
}

function highlightTableColumn(colNum, isHighlighted) {
  const cells = document.querySelectorAll(".col" + colNum + ", .th-col" + colNum);
  cells.forEach(c => {
    if (isHighlighted) c.classList.add("highlighted-col");
    else c.classList.remove("highlighted-col");
  });
}

function renderSection(segment, localTime, globalTime) {
  hideAll();

  // Reset visual state
  setCirclesColorAndHighlight("all", false, "green");
  document.querySelectorAll(".col-hide").forEach(e => e.style.display = "");
  highlightTableColumn(1, false);
  highlightTableColumn(3, false);
  document.querySelectorAll(".dot").forEach(d => {
      d.classList.remove("highlight-dot");
      d.setAttribute("r", "3");
  });

  if (segment.id.startsWith("intro-")) {
    document.getElementById("top_area").style.height = "100%";
    document.getElementById("visual_stage").style.display = "none";
    document.getElementById("bottom_area").style.display = "none";

    const mt = document.getElementById("main_title");
    mt.classList.remove("hidden");
    if (segment.id === "intro-1") mt.innerText = "StatQuest...";
    if (segment.id === "intro-2") mt.innerText = "StatQuest...\n...is the best!!";
    if (segment.id === "intro-3") mt.innerText = "If you don't think so...";
    if (segment.id === "intro-4") mt.innerText = "If you don't think so...\n...then we have different opinions!!!";
    if (segment.id === "intro-5" || segment.id === "intro-6") mt.innerText = "StatQuest:\nPrincipal Component\nAnalysis (PCA) concepts in 5\nminutes!";
  } else {
    document.getElementById("top_area").style.height = "15%";
    document.getElementById("visual_stage").style.display = "flex";
    document.getElementById("bottom_area").style.display = "flex";
  }

  if (segment.id.startsWith("cells-")) {
    document.getElementById("cells_diagram").classList.remove("hidden");
    const cap = document.getElementById("caption_text");
    cap.classList.remove("hidden");

    if (segment.id === "cells-1" || segment.id === "cells-2") {
      cap.innerText = "Let's say we had some normal cells...";
    }
    if (segment.id === "cells-2") {
      const psst = document.getElementById("psst_text");
      psst.classList.remove("hidden");
      psst.innerText = "(psst - if you're not a biologist, these could be people, or cars, or cities, etc...)";
    }
    if (segment.id === "cells-3") {
      cap.innerText = "Even though they look the same, we suspect that there are differences...";
    }
    if (segment.id === "cells-4" || segment.id === "cells-5") {
      setCirclesColorAndHighlight([3, 4, 5, 6, 7], true, "teal"); 
      const p1 = document.getElementById("pointer_text1");
      p1.classList.remove("hidden");
      p1.innerText = "These might be one type of cell...";
    }
    if (segment.id === "cells-5") {
      const psst = document.getElementById("psst_text");
      psst.classList.remove("hidden");
      psst.innerText = "(or one type of person, or car, or city, etc...)";
    }
    if (segment.id === "cells-6") {
      setCirclesColorAndHighlight([8, 9, 10], true, "red");
      const p2 = document.getElementById("pointer_text2");
      p2.classList.remove("hidden");
      p2.innerText = "These might be another type of cell...";
    }
    if (segment.id === "cells-7") {
      setCirclesColorAndHighlight([11, 12, 13, 14, 15], true, "yellow"); 
      const p3 = document.getElementById("pointer_text3");
      p3.classList.remove("hidden");
      p3.innerText = "And lastly, these might be a third type of cell.";
    }
  }

  if (segment.id.startsWith("seq-")) {
    document.getElementById("cells_diagram").classList.remove("hidden");
    const cap = document.getElementById("caption_text");
    cap.classList.remove("hidden");
    
    if (segment.id === "seq-1") {
      cap.innerText = "Unfortunately, we can't observe the differences from the outside...";
    }
    if (segment.id === "seq-2" || segment.id === "seq-3") {
      cap.innerText = "...so we sequence the mRNA in each cell to identify which genes are active.\nThis tells us what the cell is doing.";
    }
    if (segment.id === "seq-3") {
      const psst = document.getElementById("psst_text");
      psst.classList.remove("hidden");
      psst.innerText = "(If they were people, we could measure their height, blood pressure, reading level etc...)";
    }
  }

  if (segment.id.startsWith("data-")) {
    document.getElementById("data_table").classList.remove("hidden");
    const cap = document.getElementById("caption_text");
    cap.classList.remove("hidden");
    
    if (segment.id === "data-1") {
      cap.innerText = "Okay, here's the data...";
    }
    if (segment.id === "data-2") {
      cap.innerText = "Each column shows how much each gene is transcribed in each cell.";
      highlightTableColumn(1, true);
      highlightTableColumn(3, true);
    }
    if (segment.id === "data-3") {
      cap.innerText = "For now, let's imagine there were only 2 cells.";
      document.querySelectorAll(".col-hide").forEach(e => e.style.display = "none");
    }
  }

  if (segment.id.startsWith("plot-")) {
    document.getElementById("data_table").classList.remove("hidden");
    document.querySelectorAll(".col-hide").forEach(e => e.style.display = "none");
    document.getElementById("scatter_plot").classList.remove("hidden");
    
    const cap = document.getElementById("caption_text");
    cap.classList.remove("hidden");

    if (segment.id === "plot-1") {
        cap.innerText = "If we just have 2 cells, we can plot the measurements for each gene.";
    }
    if (segment.id === "plot-2") {
      const p4 = document.getElementById("pointer_text4");
      p4.classList.remove("hidden");
      p4.innerText = "This gene, Gene1, is highly transcribed in Cell1 and lowly transcribed in Cell2...";
      const dot1 = document.getElementById("dot1");
      dot1.classList.add("highlight-dot");
      dot1.setAttribute("r", "6");
    }
    if (segment.id === "plot-3") {
      const p5 = document.getElementById("pointer_text5");
      p5.classList.remove("hidden");
      p5.innerText = "... and this gene, Gene9, is lowly transcribed in Cell1 and highly transcribed in Cell2.";
      const dot9 = document.getElementById("dot9");
      dot9.classList.add("highlight-dot");
      dot9.setAttribute("r", "6");
    }
  }
}

window.__RENDER_SECTION__ = renderSection;

</script>
</body>
</html>
