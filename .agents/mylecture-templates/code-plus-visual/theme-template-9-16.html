<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9:16 Video Theme Template</title>
    <style>
        /* ==========================================================================
           BASE RESET & FONTS
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* ==========================================================================
           MAIN VIDEO FRAME (STRICT 9:16 ASPECT RATIO)
           ========================================================================== */
        .video-frame {
            width: 1080px;
            height: 1920px;
            position: relative;
            background-color: #121212;
            transform-origin: center center;
            overflow: hidden;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            z-index: 0;
            pointer-events: none;
        }

        /* ==========================================================================
           LAYOUT AREAS (Top 10% Empty, Bottom 15% Empty)
           ========================================================================== */
        .content-safe-area {
            position: absolute;
            top: 10%;
            height: 65%; /* Leaves 25% at bottom to avoid subtitles entirely */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            z-index: 1;
        }

        .subtitles {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            font-family: sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: #facc15; 
            background: transparent;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.95), -1px -1px 4px rgba(0, 0, 0, 0.8);
            padding: 10px;
            z-index: 10;
            line-height: 1.5;
            display: none; /* Managed by JS */
        }

        /* ==========================================================================
           THEME COMPONENTS
           ========================================================================== */
        .header { text-align: center; }
        .title { font-size: 56px; letter-spacing: 6px; color: #f4f4f5; font-weight: 600; text-transform: uppercase; }
        .subtitle-text { font-size: 36px; color: #d1d5db; letter-spacing: 2px; margin-top: 20px; }

        .placeholder { display: flex; justify-content: center; align-items: center; border-radius: 16px; font-size: 32px; font-weight: bold; color: rgba(255, 255, 255, 0.6); text-align: center; padding: 40px; }
        .primary-placeholder { width: 900px; height: 550px; border: 4px dashed #64748b; background-color: rgba(59, 75, 102, 0.15); }
        .secondary-placeholder { width: 980px; height: 350px; border: 4px dashed #10b981; background-color: rgba(16, 185, 129, 0.1); }

        /* Mock Player Start Button (Hidden in export mode) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 50; flex-direction: column; backdrop-filter: blur(10px);
        }
        .start-btn { background-color: #10b981; color: #000; border: none; padding: 30px 60px; font-size: 40px; font-weight: bold; border-radius: 20px; cursor: pointer; font-family: sans-serif; }
    </style>
</head>
<body>

<div class="video-frame" id="frame">
    <canvas id="bgCanvas"></canvas>

    <div class="content-safe-area">
        <div class="header">
            <div class="title" id="mainTitle">Video Title</div>
            <div class="subtitle-text" id="subInfo">Information</div>
        </div>

        <div class="placeholder primary-placeholder" id="animArea">
            SVG ANIMATION AREA
        </div>

        <div class="placeholder secondary-placeholder">
            CODE / SECONDARY AREA
        </div>
    </div>

    <div class="subtitles" id="subtitles"></div>

    <div class="overlay" id="startOverlay">
        <button class="start-btn" onclick="startMockPlayer()">Play Preview</button>
    </div>
</div>

<script>
    function fitFrameToScreen() {
        const frame = document.getElementById('frame');
        const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
        frame.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitFrameToScreen);
    fitFrameToScreen();

    // ============================================================================
    // 1. VIDEO PLAN (Contract Required)
    // ============================================================================
    window.__VIDEO_PLAN__ = [
        { 
            id: "intro", 
            kind: "narration+visual", 
            audio: "audio/intro.wav", 
            text: "This is a compliant template segment." 
        },
        { 
            id: "animation-only", 
            kind: "visual-only", 
            duration: 3 
        }
    ];

    // ============================================================================
    // 2. RENDER ENGINE HELPERS
    // ============================================================================
    let isDOMInitialized = false;
    const canvas = document.getElementById('bgCanvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');

    function drawFluidBackground(globalTime) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        const spacing = 48; 
        for(let x = 0; x < canvas.width; x += spacing) {
            for(let y = 0; y < canvas.height; y += spacing) {
                 let dx = Math.sin(x * 0.005 + globalTime * 1.2) * 10;
                 let dy = Math.cos(y * 0.005 + globalTime * 1.2) * 10;
                 ctx.beginPath();
                 ctx.arc(x + dx, y + dy, 3, 0, Math.PI * 2);
                 ctx.fill();
            }
        }
    }

    function initDOM() {
        // AI: Inject SVG elements or state initialization here
        isDOMInitialized = true;
    }

    // ============================================================================
    // 3. RENDER FUNCTION (Contract Required)
    // ============================================================================
    window.__RENDER_SECTION__ = function(segment, localTime, globalTime) {
        if (!isDOMInitialized) initDOM();

        // Compute fluid motion using globalTime (no CSS transitions)
        drawFluidBackground(globalTime);

        // Subtitles derived exactly from the plan
        const subEl = document.getElementById('subtitles');
        if (segment.text) {
            subEl.innerText = segment.text;
            subEl.style.display = 'block';
        } else {
            subEl.style.display = 'none';
        }

        // --- Logic computed purely from localTime / globalTime ---
        if (segment.id === "intro") {
            // Example animation tied strictly to localTime
            let bounce = Math.abs(Math.sin(localTime * 4)) * 20;
            document.getElementById('animArea').style.transform = `translateY(-${bounce}px)`;
        } else if (segment.id === "animation-only") {
            document.getElementById('animArea').style.transform = `translateY(0px)`;
            document.getElementById('animArea').style.backgroundColor = 'rgba(234, 179, 8, 0.2)'; // Turns yellow
        }
    };

    // ============================================================================
    // 4. EXPORT MODE SUPPORT (Contract Required)
    // ============================================================================
    const isExport = new URLSearchParams(window.location.search).get('export') === '1';

    if (!isExport) {
        // Show mock player overlay if NOT in headless export mode
        document.getElementById('startOverlay').style.display = 'flex';
        initDOM();
    }

    // --- Local Mock Player (Ignored by renderer pipeline) ---
    function startMockPlayer() {
        document.getElementById('startOverlay').style.display = 'none';
        
        let currentSegmentIdx = 0;
        let segmentStartTime = performance.now() / 1000;
        
        const speakSegment = (text) => {
            window.speechSynthesis.cancel();
            if(text) {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        };

        speakSegment(window.__VIDEO_PLAN__[0].text);

        function tick(timestamp) {
            let now = timestamp / 1000;
            let segment = window.__VIDEO_PLAN__[currentSegmentIdx];
            
            // Auto-calculate mock duration for preview if not provided
            let duration = segment.duration;
            if (!duration) {
                duration = Math.max(3, (segment.text.split(" ").length * 0.35) + 1.0);
            }
            
            let localTime = now - segmentStartTime;
            
            if (localTime >= duration) {
                currentSegmentIdx++;
                segmentStartTime = now;
                if (currentSegmentIdx >= window.__VIDEO_PLAN__.length) return; 
                segment = window.__VIDEO_PLAN__[currentSegmentIdx];
                localTime = 0;
                speakSegment(segment.text);
            }
            
            window.__RENDER_SECTION__(segment, localTime, now);
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }
</script>
</body>
</html>
