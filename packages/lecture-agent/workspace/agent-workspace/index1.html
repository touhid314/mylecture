<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>What is a Prime Number?</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-weight: 400;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      background-color: #000000;
      overflow: hidden;
    }
    .title {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 72px;
      color: #ffffff;
    }
    .definition {
      position: absolute;
      top: 220px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 44px;
      color: #aaaaaa;
    }
    .main-number {
      position: absolute;
      top: 380px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 126px;
      color: #ffffff;
    }
    .factor-container {
      position: absolute;
      top: 600px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 80px;
    }
    .factor-box {
      font-size: 30px;
      padding: 20px;
      border: 2px solid transparent;
      border-radius: 10px;
      text-align: center;
    }
    .other-container {
      position: absolute;
      top: 780px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 50px;
    }
    .other-box {
      font-size: 30px;
      padding: 15px;
      border: 2px dashed #444444;
      border-radius: 8px;
      text-align: center;
      position: relative;
    }
    .cross {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      color: #ff3333;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="title" class="title">Prime Numbers</div>
    <div id="definition" class="definition">Only divisible by 1 and itself</div>
    <div id="main-number" class="main-number">5</div>
    
    <div class="factor-container">
      <div id="factor1" class="factor-box"></div>
      <div id="factor5" class="factor-box"></div>
    </div>
    
    <div class="other-container">
      <div id="other2" class="other-box"></div>
      <div id="other3" class="other-box"></div>
      <div id="other4" class="other-box"></div>
    </div>
  </div>

  <script>
    // Define metadata
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "What is a Prime Number?",
      aspectRatio: "16:9"
    };

    // Define video plan
    window.__VIDEO_PLAN__ = [
      {
        id: "intro",
        kind: "narration+visual",
        audio: "audio/intro.wav",
        text: "A prime number is a whole number greater than 1 that has only two factors: 1 and itself."
      },
      {
        id: "example",
        kind: "narration+visual",
        audio: "audio/example.wav",
        text: "For example, 5 is prime because only 1 and 5 can divide it perfectly."
      }
    ];

    // Helper to render KaTeX elements once loaded or dynamically
    function renderMath(id, tex) {
      const el = document.getElementById(id);
      if (el) {
        katex.render(tex, el);
      }
    }

    // Render static KaTeX once DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      renderMath('factor1', "5 \\div 1 = 5");
      renderMath('factor5', "5 \\div 5 = 1");
      renderMath('other2', "5 \\div 2 = 2.5");
      renderMath('other3', "5 \\div 3 = 1.67");
      renderMath('other4', "5 \\div 4 = 1.25");
    });

    // Render section function
    function renderSection(segment, localTime, globalTime) {
      const titleEl = document.getElementById('title');
      const defEl = document.getElementById('definition');
      const mainNumEl = document.getElementById('main-number');
      const factor1El = document.getElementById('factor1');
      const factor5El = document.getElementById('factor5');
      const other2El = document.getElementById('other2');
      const other3El = document.getElementById('other3');
      const other4El = document.getElementById('other4');

      // Reset styles as basis
      titleEl.style.opacity = 0;
      defEl.style.opacity = 0;
      mainNumEl.style.opacity = 0;
      factor1El.style.opacity = 0;
      factor5El.style.opacity = 0;
      other2El.style.opacity = 0;
      other3El.style.opacity = 0;
      other4El.style.opacity = 0;
      
      factor1El.style.borderColor = 'transparent';
      factor5El.style.borderColor = 'transparent';
      factor1El.style.color = '#ffffff';
      factor5El.style.color = '#ffffff';

      // Remove any cross overlays from prior runs
      ['cross2', 'cross3', 'cross4'].forEach(id => {
        const cross = document.getElementById(id);
        if (cross) cross.remove();
      });

      if (segment.id === "intro") {
        // --- INTRO SCENE ---
        // 0 to 1.5s: Title, definition and "5" fade in
        let introOpacity = Math.min(localTime / 1.5, 1);
        titleEl.style.opacity = introOpacity;
        defEl.style.opacity = introOpacity;
        mainNumEl.style.opacity = introOpacity;

        // 1.5s to 3.5s: Factor equations fade in
        if (localTime > 1.5) {
          let factorOpacity = Math.min((localTime - 1.5) / 2.0, 1);
          factor1El.style.opacity = factorOpacity;
          factor5El.style.opacity = factorOpacity;
        }
      } else if (segment.id === "example") {
        // --- EXAMPLE SCENE ---
        // Title, definition, "5" and factors are fully visible
        titleEl.style.opacity = 1;
        defEl.style.opacity = 1;
        mainNumEl.style.opacity = 1;
        factor1El.style.opacity = 1;
        factor5El.style.opacity = 1;

        // Highlight factor1 and factor5 in gold (0 to 1s transition, then remains)
        let glowProgress = Math.min(localTime / 1.0, 1);
        let goldColor = `rgb(${Math.round(255 * glowProgress + 255 * (1 - glowProgress))}, ${Math.round(215 * glowProgress + 255 * (1 - glowProgress))}, ${Math.round(0 * glowProgress + 255 * (1 - glowProgress))})`;
        factor1El.style.color = goldColor;
        factor5El.style.color = goldColor;
        factor1El.style.borderColor = `rgba(255, 215, 0, ${glowProgress})`;
        factor5El.style.borderColor = `rgba(255, 215, 0, ${glowProgress})`;

        // 1s to 2s: Non-factors (2, 3, 4) fade in
        if (localTime > 1.0) {
          let othersOpacity = Math.min((localTime - 1.0) / 1.0, 1);
          other2El.style.opacity = othersOpacity;
          other3El.style.opacity = othersOpacity;
          other4El.style.opacity = othersOpacity;
        }

        // 2s to 3s: Red crosses appear on non-factors to show they don't divide perfectly
        if (localTime > 2.0) {
          other2El.style.opacity = 1;
          other3El.style.opacity = 1;
          other4El.style.opacity = 1;

          let crossProgress = Math.min((localTime - 2.0) / 1.0, 1);
          
          addCross(other2El, 'cross2', crossProgress);
          addCross(other3El, 'cross3', crossProgress);
          addCross(other4El, 'cross4', crossProgress);
        }

        // 3s to 4s: Non-factors fade out, leaving only the prime factors
        if (localTime > 3.0) {
          let fadeOutProgress = 1 - Math.min((localTime - 3.0) / 1.0, 1);
          other2El.style.opacity = fadeOutProgress;
          other3El.style.opacity = fadeOutProgress;
          other4El.style.opacity = fadeOutProgress;

          const c2 = document.getElementById('cross2');
          const c3 = document.getElementById('cross3');
          const c4 = document.getElementById('cross4');
          if (c2) c2.style.opacity = fadeOutProgress;
          if (c3) c3.style.opacity = fadeOutProgress;
          if (c4) c4.style.opacity = fadeOutProgress;
        }
      }
    }

    function addCross(parentEl, id, progress) {
      if (!document.getElementById(id)) {
        const cross = document.createElement('div');
        cross.id = id;
        cross.className = 'cross';
        cross.innerHTML = '✕';
        cross.style.opacity = progress;
        parentEl.appendChild(cross);
      } else {
        document.getElementById(id).style.opacity = progress;
      }
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
