<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOM Text Inside Opaque Panel Pass Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #htmlLayer { position: absolute; inset: 0; pointer-events: none; }
  .panel {
    position: absolute;
    box-sizing: border-box;
    background: #2a4a5c;
    border-radius: 8px;
    padding: 28px 32px;
    font-size: 28px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="htmlLayer">
      <div id="panel" class="panel">Nested label</div>
    </div>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "DOM Text Inside Opaque Panel Pass Fixture",
      aspectRatio: "16:9"
    };
    window.__VIDEO_PLAN__ = [
      { id: "dom_text_in_panel", kind: "visual-only", duration: 2 }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const panel = document.getElementById("panel");

    function renderSection() {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);

      panel.style.left = "810px";
      panel.style.top = "500px";
      panel.style.width = "300px";
      panel.style.height = "80px";
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
