<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas Text Tight Panel Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "Canvas Text Tight Panel Fixture",
      aspectRatio: "16:9"
    };
    window.__VIDEO_PLAN__ = [
      { id: "tight_panel_text", kind: "visual-only", duration: 2 }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    // Chip-like panel: text is mostly inside (should not be "overlap") but insets are
    // well below the 24px theme pad (should still fail panel padding above 12px floor).
    const CHIP_X = 860;
    const CHIP_Y = 500;
    const CHIP_W = 140;
    const CHIP_H = 48;

    function renderSection() {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);

      ctx.fillStyle = "#2a4a5c";
      ctx.fillRect(CHIP_X, CHIP_Y, CHIP_W, CHIP_H);
      ctx.fillStyle = "#f4f7fb";
      ctx.font = "600 28px Georgia, serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      // Top inset ~4px vs required 24px → ~20px shortfall (above 12px floor).
      ctx.fillText("CHIP", CHIP_X + 8, CHIP_Y + 4);
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
