<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Partial Alpha Mid Overlap Skip Pass Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "Partial Alpha Mid Overlap Skip Pass Fixture",
      aspectRatio: "16:9",
      layoutMidProbe: true
    };
    window.__VIDEO_PLAN__ = [
      { id: "partial_alpha_mid", kind: "visual-only", duration: 10 }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const BOX_A = { x: 500, y: 500, w: 100, h: 100 };
    const SEPARATED_B = { x: 800, y: 800, w: 100, h: 100 };
    const OVERLAP_B = { x: 511, y: 550, w: 100, h: 100 };
    const DURATION = 10;
    const END_TIME = DURATION - (1 / 30);
    const TAIL_START = END_TIME * 0.75;

    function boxBForTime(localTime) {
      const t = Number(localTime) || 0;
      if (t > 0 && t < TAIL_START) {
        return { box: OVERLAP_B, alpha: 0.5 };
      }
      return { box: SEPARATED_B, alpha: 1 };
    }

    function renderSection(_segment, localTime) {
      const { box, alpha } = boxBForTime(localTime);
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);

      ctx.globalAlpha = 1;
      ctx.fillStyle = "#2a4a5c";
      ctx.fillRect(BOX_A.x, BOX_A.y, BOX_A.w, BOX_A.h);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#4a6a7c";
      ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.globalAlpha = 1;
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
