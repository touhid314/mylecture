<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overlap Exemptions Fail Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #title { position: absolute; left: 6vw; top: 8vh; font-size: 48px; font-weight: 700; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="title">Overlap collision fixture</div>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "Overlap Exemptions Fail Fixture",
      aspectRatio: "16:9"
    };
    window.__VIDEO_PLAN__ = [
      {
        id: "collision",
        kind: "visual-only",
        duration: 2
      }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function renderSection(segment, localTime) {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);

      ctx.fillStyle = "#f4f7fb";
      ctx.font = "700 48px Georgia, serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("Competing label", 400, 500);
      ctx.fillText("Competing label", 400, 500);
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
