<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distinct Overlap Geometry Dedupe Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "Distinct Overlap Geometry Dedupe Fixture",
      aspectRatio: "16:9"
    };
    window.__VIDEO_PLAN__ = [
      { id: "distinct_overlap", kind: "visual-only", duration: 2 }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const PAIR_A = [
      { x: 200, y: 200, w: 100, h: 100 },
      { x: 211, y: 250, w: 100, h: 100 }
    ];
    const PAIR_B = [
      { x: 900, y: 500, w: 100, h: 100 },
      { x: 911, y: 550, w: 100, h: 100 }
    ];

    function drawOverlapPair(a, b, fillA, fillB) {
      ctx.fillStyle = fillA;
      ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = fillB;
      ctx.fillRect(b.x, b.y, b.w, b.h);
    }

    function renderSection() {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);
      drawOverlapPair(PAIR_A[0], PAIR_A[1], "#2a4a5c", "#4a6a7c");
      drawOverlapPair(PAIR_B[0], PAIR_B[1], "#2a4a5c", "#4a6a7c");
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
