<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Small Panel Pad Shortfall Pass Fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; color: #f4f7fb; font-family: Georgia, serif; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
  <main id="stage">
    <canvas id="canvas" width="1920" height="1080"></canvas>
  </main>
  <script>
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.2",
      title: "Small Panel Pad Shortfall Pass Fixture",
      aspectRatio: "16:9"
    };
    window.__VIDEO_PLAN__ = [
      { id: "small_pad_shortfall", kind: "visual-only", duration: 2 }
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const PANEL_X = 810;
    const PANEL_Y = 500;
    const PANEL_W = 300;
    const PANEL_H = 80;

    function renderSection() {
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.fillStyle = "#101820";
      ctx.fillRect(0, 0, 1920, 1080);

      ctx.fillStyle = "#2a4a5c";
      ctx.fillRect(PANEL_X, PANEL_Y, PANEL_W, PANEL_H);
      ctx.fillStyle = "#f4f7fb";
      ctx.font = "600 28px Georgia, serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      // Required pad 24px; top inset 15px → 9px shortfall (below 12px floor).
      ctx.fillText("OK PAD", PANEL_X + 30, PANEL_Y + 15);
    }

    window.__RENDER_SECTION__ = renderSection;
  </script>
</body>
</html>
