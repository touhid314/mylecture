# Builds MyLecture for Windows, checks the packaged app actually starts (and can
# speak, run ffmpeg and check scenes), then publishes a GitHub Release with the
# installers when a version tag is pushed. The in-app updater and website link
# use `npm run release:publish` instead (docs/RELEASING.md). macOS jobs were removed while
# releases are Windows-only; restore them from git history when needed.
#
#   git tag v1.0.0 && git push origin v1.0.0   -> GitHub Release with the installers
#   Actions -> Release -> Run workflow          -> builds + smoke tests only (artifacts)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: --win --x64
            artifacts: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # Signing is optional: without these secrets Windows builds are unsigned
      # (SmartScreen warns) and macOS builds are ad-hoc signed, not notarized
      # (users right-click -> Open the first time).
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || secrets.WIN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          extra=""
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # No certificate: ad-hoc sign on macOS (Apple silicon refuses unsigned apps).
            if [ "$RUNNER_OS" = "macOS" ]; then extra="-c.mac.identity=-"; fi
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID" ]; then
            extra="-c.mac.notarize=true"
          fi
          npx electron-builder ${{ matrix.target }} --publish never $extra

      # Launch the packaged app: it must boot into Create, synthesize speech with
      # Kokoro, run the bundled ffmpeg and validate a scene in the bundled browser.
      - name: Smoke test the packaged app
        shell: bash
        env:
          MYLECTURE_SMOKE_DEEP: "1"
        run: node scripts/smoke-packaged.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: MyLecture-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes \
            --title "MyLecture ${GITHUB_REF_NAME#v}"
