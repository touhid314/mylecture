name: Hermes Intel Mac wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
      - name: Build the pinned packages
        run: |
          python -m pip install --upgrade pip delocate
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          python -m pip wheel --no-deps --wheel-dir raw cryptography==50.0.2 nemo-relay==0.10.3
          mkdir wheels
          delocate-wheel -v -w wheels raw/*.whl
          python -m pip install --no-index --no-deps wheels/*.whl
          python -m pip install cffi
          python -c "from cryptography.hazmat.primitives import hashes; h = hashes.Hash(hashes.SHA256()); h.update(b'check'); print(h.finalize().hex()); import nemo_relay; print(nemo_relay.__file__)"
          delocate-listdeps wheels/*.whl
          shasum -a 256 wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-intel-wheels
          path: wheels/*.whl
          if-no-files-found: error
