<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatQuest: PCA concepts</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; background-color: #ffffff; font-family: 'Helvetica', 'Arial', sans-serif; overflow: hidden; }
        #canvas-container { width: 100%; height: 100%; position: relative; }
        .text-element { position: absolute; font-weight: bold; color: black; text-align: center; width: 100%; left: 0; box-sizing: border-box; padding: 0 5%; }
        .title { font-size: 4vw; top: 40%; }
        .subtitle { font-size: 3vw; top: 50%; }
        .small-text { font-size: 2vw; bottom: 10%; }
        .top-text { font-size: 3vw; top: 10%; }
        svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
        
        table { border-collapse: collapse; background: white; font-size: 1.5vw; }
        th, td { border: 2px solid black; padding: 0.5vw 1vw; text-align: center; font-weight: bold; }
        th { background-color: #00008b; color: white; }
        td:first-child { background-color: #00008b; color: white; }
        .table-container { position: absolute; left: 55%; top: 30%; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <script>
        window.__VIDEO_METADATA__ = {
            contractVersion: "0.2",
            title: "StatQuest: Principal Component Analysis (PCA) concepts in 5 minutes!",
            aspectRatio: "16:9"
        };

        window.__VIDEO_PLAN__ = [
            { id: "intro", kind: "narration+visual", audio: "audio/intro.wav", text: "StatQuest is the best! If you don't think so, then we have different opinions!" },
            { id: "title", kind: "narration+visual", audio: "audio/title.wav", text: "Hello, I'm Josh Starmer and welcome to StatQuest. Today we're going to be talking about the main ideas behind principal component analysis, and we're going to cover those concepts in 5 minutes. If you want more details than you get here, be sure to check out my other PCA video." },
            { id: "cells", kind: "narration+visual", audio: "audio/cells.wav", text: "Let's say we had some normal cells... psst, if you're not a biologist, imagine that these could be people, or cars, or cities, they could be anything. Even though they look the same, we suspect that there are differences... These might be one type of cell, or one type of person or car or city etc. These might be another type of cell, and lastly these might be a third type of cell. Unfortunately, we can't observe the differences from the outside..." },
            { id: "rna", kind: "narration+visual", audio: "audio/rna.wav", text: "...so we sequence the messenger RNA in each cell to identify which genes are active. This tells us what the cell is doing. If they were people, we could measure their weight, blood pressure, reading level, etc. Okay, here's the data. Each column shows how much each gene is transcribed in each cell. For now, let's imagine there are only two cells." },
            { id: "plot2", kind: "narration+visual", audio: "audio/plot2.wav", text: "If we just have two cells, then we can plot the measurements for each gene. This gene, Gene 1, is highly transcribed in Cell 1, and lowly transcribed in Cell 2. And this gene, Gene 9, is lowly transcribed in Cell 1, and highly transcribed in Cell 2. In general, Cell 1 and Cell 2 have an inverse correlation. This means that they are probably two different types of cells, since they are using different genes." },
            { id: "plot3", kind: "narration+visual", audio: "audio/plot3.wav", text: "Now let's imagine there are 3 cells. We've already seen how we can plot the first 2 cells to see how closely they are related. Now we can also compare Cell 1 to Cell 3. Cell 1 and Cell 3 are positively correlated, suggesting they are doing similar things. Lastly, we can also compare Cell 2 to Cell 3. The negative correlation suggests that Cell 2 is doing something different from Cell 3. Alternatively, we could try to plot all three cells at once on a 3-dimensional graph. Cell 1 could be the vertical axis, Cell 2 could be the horizontal axis, and Cell 3 could be depth. We could then rotate this graph around to see how the cells are related to each other." },
            { id: "pca_intro", kind: "narration+visual", audio: "audio/pca_intro.wav", text: "But what do we do when we have 4 or more cells? Draw tons and tons of 2 cell plots and try to make sense of them all? Or draw some crazy graph that has an axis for each cell and makes our brain explode? No, both of those options are just plain silly. Instead, we draw a Principal Component Analysis or PCA plot. A PCA plot converts the correlations (or lack thereof) among all of the cells into a 2-D graph." },
            { id: "pca_clusters", kind: "narration+visual", audio: "audio/pca_clusters.wav", text: "Cells that are highly correlated cluster together. This cluster of cells are highly correlated with each other, so are these, and so are these. To make the clusters easier to see, we can color code them. Once we've identified the clusters in the PCA plot, we can go back to the original cells and see that they represent 3 different types of cells doing 3 different types of things with their genes! BAM!!!" },
            { id: "pca_axes", kind: "narration+visual", audio: "audio/pca_axes.wav", text: "Here's one last main idea about how to interpret PCA plots. The axes are ranked in order of importance. Differences along the first principal component axis (PC1) are more important than differences along the second principal component axis (PC2). If the plot looked like this, where the distance between these two clusters is about the same as the distance between these two clusters, then these two clusters (on the left) are more different from each other than these two clusters (on the bottom)." },
            { id: "conclusion", kind: "narration+visual", audio: "audio/conclusion.wav", text: "Before we go, you should know that PCA is just one way to make sense of this type of data. There are lots of other methods that are variations on this theme of dimension reduction. These methods include heatmaps, t-SNE plots, and multiple dimension scaling plots. The good news is that I've got StatQuests for all of these, so you can check those out if you want to learn more. Note, if the concept of dimension reduction is freaking you out, check out the original StatQuest on PCA. I take it nice and slow so it's clearly explained. Hooray, we've made it to the end of another exciting StatQuest. If you like this StatQuest and want to see more, please subscribe. And if you have any ideas for future StatQuests, well, put them in the comments below. Until next time, Quest on!" }
        ];

        // Hex cluster points
        const cellCoords = [
            [-60,-30], [-60,30], [0,-60], [0,0], [0,60], [60,-30], [60,30],
            [-120,0], [-120,-60], [120,0], [120,60], [60,-90], [-60,-90], [60,90], [-60,90]
        ];

        function drawCells(colorOverrides = {}) {
            let svg = `<svg viewBox="0 0 1000 1000"><g transform="translate(500, 500)">`;
            cellCoords.forEach((p, i) => {
                let fill = colorOverrides[i] || "#39FF14"; // Default green
                svg += `<circle cx="${p[0]}" cy="${p[1]}" r="28" fill="${fill}" stroke="black" stroke-width="3"/>`;
            });
            svg += `</g></svg>`;
            return svg;
        }

        function drawTable(cols = 4, highlightCol = -1) {
            let html = `<div class="table-container"><table><tr><th></th>`;
            for(let i = 1; i <= cols; i++) {
                let bg = (i === highlightCol) ? "style='background-color: rgba(255,0,0,0.3);'" : "";
                html += `<th ${bg}>Cell${i}</th>`;
            }
            if(cols >= 4) html += `<th>...</th>`;
            html += `</tr>`;
            for(let g = 1; g <= 5; g++) {
                html += `<tr><td>Gene${g}</td>`;
                for(let i = 1; i <= cols; i++) {
                    let bg = (i === highlightCol) ? "style='background-color: rgba(255,0,0,0.3);'" : "";
                    html += `<td ${bg}>${(Math.random() * 3).toFixed(1)}</td>`;
                }
                if(cols >= 4) html += `<td>...</td>`;
                html += `</tr>`;
            }
            html += `</table></div>`;
            return html;
        }

        function drawPlot(x, y, w, h, points, xl, yl, line = false, colors = null) {
            let svg = `<svg viewBox="0 0 1000 1000">`;
            svg += `<g transform="translate(${x}, ${y})">`;
            // Axes
            svg += `<line x1="0" y1="0" x2="0" y2="${h}" stroke="black" stroke-width="4" />`;
            svg += `<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="black" stroke-width="4" />`;
            // Labels
            svg += `<text x="-50" y="${h/2}" font-size="30" font-weight="bold" transform="rotate(-90, -50, ${h/2})" text-anchor="middle">${yl}</text>`;
            svg += `<text x="${w/2}" y="${h + 50}" font-size="30" font-weight="bold" text-anchor="middle">${xl}</text>`;
            // Points
            points.forEach((p, i) => {
                let col = colors ? colors[i] : "#00FFFF";
                svg += `<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="${col}" stroke="black" stroke-width="2" />`;
            });
            // Best fit line
            if (line) {
                svg += `<line x1="20" y1="20" x2="${w-20}" y2="${h-20}" stroke="black" stroke-width="3" />`;
            }
            svg += `</g></svg>`;
            return svg;
        }

        function renderSection(segment, localTime, globalTime) {
            const container = document.getElementById("canvas-container");
            container.innerHTML = ""; 
            
            if (segment.id === "intro") {
                if (localTime < 3) {
                    container.innerHTML += `<div class="text-element title">StatQuest...</div>`;
                } else if (localTime < 6) {
                    container.innerHTML += `<div class="text-element title">StatQuest...</div>`;
                    container.innerHTML += `<div class="text-element subtitle" style="margin-top: 5%;">...is the best!!</div>`;
                } else {
                    container.innerHTML += `<div class="text-element title">If you don't think so...</div>`;
                    container.innerHTML += `<div class="text-element subtitle" style="margin-top: 5%;">...then we have different opinions!!!</div>`;
                }
            }
            else if (segment.id === "title") {
                container.innerHTML += `<div class="text-element title" style="top: 30%;">StatQuest:</div>`;
                container.innerHTML += `<div class="text-element subtitle" style="top: 45%;">Principal Component Analysis (PCA)<br>concepts in 5 minutes!</div>`;
            }
            else if (segment.id === "cells") {
                let text = "Let's say we had some normal cells...";
                let subtext = "(psst - if you're not a biologist, these could be people, or cars, or cities, etc...)";
                let colorOverrides = {};
                
                if (localTime > 12) {
                    subtext = "Even though they look the same, we suspect that there are differences...";
                }
                if (localTime > 18) {
                    text = "These might be one type of cell...";
                    subtext = "(or one type of person, or car, or city, etc...)";
                    colorOverrides = {0:"cyan", 1:"cyan", 2:"cyan", 3:"cyan", 4:"cyan"};
                }
                if (localTime > 24) {
                    text = "These might be another type of cell...";
                    colorOverrides = {9:"red", 10:"red", 11:"red"};
                }
                if (localTime > 28) {
                    text = "...and lastly these might be a third type of cell.";
                    colorOverrides = {12:"yellow", 13:"yellow", 14:"yellow", 5:"yellow", 6:"yellow"};
                }
                if (localTime > 34) {
                    text = "Unfortunately, we can't observe the differences from the outside...";
                    colorOverrides = {};
                }

                container.innerHTML += `<div class="text-element top-text">${text}</div>`;
                container.innerHTML += `<div class="text-element small-text">${subtext}</div>`;
                container.innerHTML += drawCells(colorOverrides);
            }
            else if (segment.id === "rna") {
                let text = "...so we sequence the mRNA in each cell to identify which genes are active. This tells us what the cell is doing.";
                let subtext = "(If they were people, we could measure their height, blood pressure, reading level etc...)";
                
                if (localTime > 15) {
                    text = "Here's the data...";
                    subtext = "Each column shows how much each gene is transcribed in each cell.";
                    let hl = -1;
                    if (localTime > 18 && localTime < 22) hl = 1;
                    else if (localTime >= 22 && localTime < 25) hl = 2;
                    container.innerHTML += drawTable(4, hl);
                }
                if (localTime > 25) {
                    text = "For now, let's imagine there were only 2 cells.";
                    container.innerHTML += drawTable(2, -1);
                }

                container.innerHTML += `<div class="text-element top-text">${text}</div>`;
                container.innerHTML += `<div class="text-element small-text">${subtext}</div>`;
            }
            else if (segment.id === "plot2") {
                container.innerHTML += `<div class="text-element top-text">If we just have 2 cells, we can plot the measurements for each gene.</div>`;
                container.innerHTML += drawTable(2, -1);
                let pts = [[50,50],[100,100],[150,150],[200,200],[250,250],[300,300]];
                let line = localTime > 18;
                container.innerHTML += drawPlot(100, 300, 400, 400, pts, "Cell2", "Cell1", line);
                
                if (line) {
                    container.innerHTML += `<div class="text-element small-text">In general, Cell1 and Cell2 have an inverse correlation.</div>`;
                }
            }
            else if (segment.id === "plot3") {
                container.innerHTML += `<div class="text-element top-text" style="top:5%;">Now let's imagine there are 3 cells.</div>`;
                container.innerHTML += drawTable(3, -1);
                let pts1 = [[20,20],[60,60],[100,100],[140,140]];
                container.innerHTML += drawPlot(100, 150, 200, 200, pts1, "Cell2", "Cell1", true);
                
                if (localTime > 10) {
                    let pts2 = [[20,180],[60,140],[100,100],[140,60]];
                    container.innerHTML += drawPlot(100, 450, 200, 200, pts2, "Cell3", "Cell1", true);
                }
                if (localTime > 20) {
                    let pts3 = [[20,20],[60,60],[100,100],[140,140]];
                    container.innerHTML += drawPlot(100, 750, 200, 200, pts3, "Cell3", "Cell2", true);
                }
            }
            else if (segment.id === "pca_intro") {
                container.innerHTML += `<div class="text-element top-text">But what do we do when we have 4 or more cells?</div>`;
                if (localTime > 15) {
                    container.innerHTML += `<div class="text-element small-text">Instead, we draw a Principal Component Analysis (PCA) plot...</div>`;
                    let pts = [[50,50],[60,70],[80,40], [300,300],[320,310],[310,290], [50,300],[70,320],[40,310]];
                    container.innerHTML += drawPlot(300, 300, 400, 400, pts, "PC1", "PC2", false);
                } else {
                    container.innerHTML += `<div class="text-element subtitle">Draw tons and tons of 2 cell plots?</div>`;
                }
            }
            else if (segment.id === "pca_clusters") {
                container.innerHTML += `<div class="text-element top-text">Cells that are highly correlated cluster together...</div>`;
                let pts = [[50,50],[60,70],[80,40], [300,300],[320,310],[310,290], [50,300],[70,320],[40,310]];
                let colors = pts.map((p,i) => i < 3 ? "cyan" : (i < 6 ? "yellow" : "red"));
                
                if (localTime > 15) {
                    container.innerHTML += `<div class="text-element small-text">Once we've identified the clusters, we can go back to the original cells...</div>`;
                    container.innerHTML += drawCells({0:"cyan",1:"cyan",2:"cyan", 10:"red",11:"red",12:"red", 5:"yellow",6:"yellow",7:"yellow"});
                } else {
                    container.innerHTML += drawPlot(300, 300, 400, 400, pts, "PC1", "PC2", false, localTime > 8 ? colors : null);
                }
                if (localTime > 25) {
                    container.innerHTML += `<div class="text-element title" style="top:20%; font-size:6vw;">BAM!!!</div>`;
                }
            }
            else if (segment.id === "pca_axes") {
                container.innerHTML += `<div class="text-element top-text">The axes are ranked in order of importance.</div>`;
                let pts = [[50,50],[60,70],[80,40], [300,300],[320,310],[310,290], [50,300],[70,320],[40,310]];
                let colors = pts.map((p,i) => i < 3 ? "cyan" : (i < 6 ? "yellow" : "red"));
                container.innerHTML += drawPlot(300, 300, 400, 400, pts, "PC1", "PC2", false, colors);
                
                if (localTime > 10) {
                    container.innerHTML += `<div class="text-element small-text">Differences along PC1 are more important than differences along PC2.</div>`;
                }
            }
            else if (segment.id === "conclusion") {
                container.innerHTML += `<div class="text-element top-text" style="font-size:2.5vw;">Before we go, you should know that PCA is just one way to make sense of this type of data.</div>`;
                if (localTime < 15) {
                    container.innerHTML += `<div class="text-element subtitle">Other methods: Heatmaps, t-SNE, MDS</div>`;
                } else {
                    container.innerHTML += `<div class="text-element title" style="font-size:8vw;">The End!!!</div>`;
                }
            }
        }
        
        window.__RENDER_SECTION__ = renderSection;
    </script>
</body>
</html>
