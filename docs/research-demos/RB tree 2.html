<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red-Black Tree Walkthrough</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: 'Roboto', sans-serif;
        overflow: hidden;
    }

    #start-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
        transition: opacity 0.5s ease;
    }

    #start-screen h1 { font-size: 32px; margin-bottom: 20px; }
    
    button {
        padding: 15px 40px;
        font-size: 22px;
        cursor: pointer;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 8px;
        font-family: 'Roboto', sans-serif;
        font-weight: bold;
        transition: transform 0.2s, background 0.2s;
    }
    button:hover { transform: scale(1.05); background: #eee; }

    #container {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        transition: transform 1s ease;
        transform-origin: center center;
    }

    svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
    }

    line {
        stroke: #444;
        stroke-width: 3;
        transition: all 0.5s ease;
        opacity: 0;
    }
    
    line.visible { opacity: 1; }
    line.highlight-path { stroke: #00e676; stroke-width: 6; z-index: 10; }
    line.dim { opacity: 0.1 !important; }

    .node {
        position: absolute;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 18px;
        z-index: 2;
        transform: translate(-50%, -50%);
        transition: all 1s ease, box-shadow 0.3s;
        opacity: 0;
        box-sizing: border-box;
    }

    .node.B { background: #111; border: 3px solid #fff; color: #fff; }
    .node.R { background: #d32f2f; border: 3px solid #ff5252; color: #fff; }
    .node.N { width: 20px; height: 20px; border-radius: 2px; background: #111; border: 2px solid #fff; font-size: 0; transition: opacity 0.5s ease; }

    .highlight { box-shadow: 0 0 25px 8px rgba(255, 255, 255, 0.9); border-color: #fff; z-index: 10;}
    
    .pulse { animation: pulsing 1.2s infinite alternate; z-index: 10;}
    @keyframes pulsing {
        from { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 10px #ff5252; }
        to { transform: translate(-50%, -50%) scale(1.35); box-shadow: 0 0 35px #ff5252; }
    }

    .dim { opacity: 0.15 !important; }

    .flash { animation: flashing 0.5s 4; z-index: 10;}
    @keyframes flashing {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(2); box-shadow: 0 0 30px 10px #ff5252; transform: translate(-50%,-50%) scale(1.15); }
    }

    #counter-panel {
        position: absolute;
        top: 30px;
        right: 30px;
        background: #1a1a1a;
        border: 2px solid #333;
        padding: 20px 30px;
        border-radius: 12px;
        font-size: 28px;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.5s;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }

    .shake { animation: shaking 0.4s cubic-bezier(.36,.07,.19,.97) both; color: #ff5252; }
    @keyframes shaking {
        0%, 100% { transform: translateX(0); }
        25%, 75% { transform: translateX(-15px); }
        50% { transform: translateX(15px); }
    }

    #checkmark { color: #00e676; font-size: 32px; opacity: 0; transition: opacity 0.5s; display: none; }
    #checkmark.show { opacity: 1; display: inline-block; }

    #subtitles {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 1000px;
        text-align: center;
        font-size: 26px;
        background: rgba(0, 0, 0, 0.85);
        padding: 15px 30px;
        border-radius: 12px;
        z-index: 100;
        border: 1px solid #333;
        line-height: 1.5;
        text-shadow: 1px 1px 3px #000;
        min-height: 40px;
        transition: opacity 0.3s;
    }
</style>
</head>
<body>

<div id="start-screen">
    <h1>Red-Black Tree Walkthrough</h1>
    <button onclick="startWalkthrough()">Start Lecture</button>
</div>

<div id="counter-panel">
    Black Nodes: <span id="c-val">0</span>
    <div id="checkmark">✔</div>
</div>

<div id="container">
    <svg id="edges-layer"></svg>
    <div id="nodes-layer"></div>
</div>

<div id="subtitles"></div>

<script>
const nodes = [
    { id: 'n10', v: '10', t: 'B', x: 50, y: 15, p: null },
    { id: 'n7', v: '7', t: 'B', x: 30, y: 30, p: 'n10' },
    { id: 'n40', v: '40', t: 'B', x: 70, y: 30, p: 'n10' },
    { id: 'n3', v: '3', t: 'B', x: 20, y: 45, p: 'n7' },
    { id: 'n8', v: '8', t: 'B', x: 40, y: 45, p: 'n7' },
    { id: 'n30', v: '30', t: 'B', x: 60, y: 45, p: 'n40' },
    { id: 'n60', v: '60', t: 'B', x: 80, y: 45, p: 'n40' },
    { id: 'n1', v: '1', t: 'R', x: 15, y: 60, p: 'n3' },
    { id: 'n5', v: '5', t: 'R', x: 25, y: 60, p: 'n3' },
    { id: 'n20', v: '20', t: 'R', x: 55, y: 60, p: 'n30' },
    { id: 'n35', v: '35', t: 'R', x: 65, y: 60, p: 'n30' },
    { id: 'n45', v: '45', t: 'R', x: 75, y: 60, p: 'n60' },
    { id: 'n25', v: '25', t: 'B', x: 50, y: 75, p: 'n20' }, 
    { id: 'nl1', v: '', t: 'N', x: 12, y: 75, p: 'n1' },
    { id: 'nr1', v: '', t: 'N', x: 18, y: 75, p: 'n1' },
    { id: 'nl8', v: '', t: 'N', x: 37, y: 60, p: 'n8' },
    { id: 'nr8', v: '', t: 'N', x: 43, y: 60, p: 'n8' }
];

const script = [
    { t: "Visualizing the Properties... a walkthrough.", a: null },
    { t: "So, to really get why these rules matter, we kind of need to see them in action.", a: null },
    { t: "Let’s walk through a concrete example of a Red-Black Search Tree.", a: null },
    { t: "Imagine, if you will, a tree containing the following keys... ten, seven, three, one, five, eight, forty, thirty, twenty, twenty-five, thirty-five, forty-five... and sixty.", a: 'showTopRow' },
    { t: "Basically, let’s look at the structure in action.", a: 'formTree' },
    { t: "Look at the root of our tree, the number ten.", a: 'hl10' },
    { t: "It’s colored black, which—you know—satisfies our very first rule.", a: null },
    { t: "If we move down to its children, we find seven and forty, which are also black.", a: 'hl7_40' },
    { t: "However, as we go deeper, we start to see some variety.", a: 'clearHl' },
    { t: "Let's look at the path to the far left.", a: null },
    { t: "From ten, we go to seven—which is black—", a: 'line10_7' },
    { t: "then to three, also black,", a: 'line7_3' },
    { t: "and finally to one... which is red.", a: 'line3_1_pulse' },
    { t: "Below the one, we hit the external nodes... you know, those \"null\" markers represented by black squares.", a: 'zoom1_showNulls' },
    { t: "Now, notice that even though one is red, its parent, three,", a: 'hl3' },
    { t: "and its children, the external nodes, are all black.", a: 'hlNulls1' },
    { t: "At no point in this tree—and let me say it again—at no point in this tree will you see a red node directly connected to another red node.", a: 'flashReds' },
    { t: "This is the \"No Consecutive Red Nodes\" rule, and it’s—honestly—the key to keeping the tree from becoming too \"lopsided.\"", a: null },
    { t: "Next, let's try verifying the black node count.", a: 'clearAll' },
    { t: "The most striking property of a Red-Black tree is that it’s \"balanced\" by its black nodes.", a: 'showCounter0' },
    { t: "Let's trace a few paths from the root, ten, down to different external nodes and count the black nodes we encounter.", a: null },
    { t: "So, first, the path to the left of one.", a: null },
    { t: "We go from ten, which is black...", a: 'path10_c1' },
    { t: "to seven, black...", a: 'path7_c2' },
    { t: "to three, black...", a: 'path3_c3' },
    { t: "to one, which is red...", a: 'path1_shake' },
    { t: "and then finally to the external node, which is black.", a: 'pathNl1_c4' },
    { t: "Total black nodes? Four.", a: null },
    { t: "Now, let's try the path to the right of eight.", a: 'resetForPath2' },
    { t: "We go from ten, black...", a: 'path10_c1_2' },
    { t: "to seven, black...", a: 'path7_c2_2' },
    { t: "to eight, black...", a: 'path8_c3' },
    { t: "and then to the external node, black.", a: 'pathNr8_c4' },
    { t: "Again, the total black nodes is four.", a: 'showCheck' }
];

let ukFemaleVoice = null;
let utterances = [];

function initVoices() {
    let voices = speechSynthesis.getVoices();
    ukFemaleVoice = voices.find(v => v.name.includes('Google UK English Female')) ||
                    voices.find(v => v.lang === 'en-GB' && v.name.includes('Female')) ||
                    voices.find(v => v.lang === 'en-GB') ||
                    voices[0];
}

if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
}

function initNodes() {
    const container = document.getElementById('nodes-layer');
    nodes.forEach((n, i) => {
        let el = document.createElement('div');
        el.className = `node ${n.t}`;
        el.id = n.id;
        el.innerText = n.v;
        if (n.t !== 'N') {
            el.style.left = `${(i % 13) * 7 + 8}%`;
            el.style.top = '-10%'; 
        } else {
            el.style.left = n.x + '%';
            el.style.top = n.y + '%';
        }
        container.appendChild(el);
    });
}

function drawLine(id1, id2) {
    if(document.getElementById(`line-${id1}-${id2}`)) return; 
    let n1 = nodes.find(x => x.id === id1);
    let n2 = nodes.find(x => x.id === id2);
    let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', n1.x + '%');
    line.setAttribute('y1', n1.y + '%');
    line.setAttribute('x2', n2.x + '%');
    line.setAttribute('y2', n2.y + '%');
    line.id = `line-${id1}-${id2}`;
    document.getElementById('edges-layer').appendChild(line);
    setTimeout(() => line.classList.add('visible'), 50);
}

function hl(ids) { ids.forEach(id => document.getElementById(id).classList.add('highlight')); }
function unhl(ids) { ids.forEach(id => document.getElementById(id).classList.remove('highlight')); }
function highlightPath(id1, id2) { 
    let l = document.getElementById(`line-${id1}-${id2}`);
    if(l) l.classList.add('highlight-path');
}

const actions = {
    showTopRow: () => {
        nodes.filter(n=>n.t!=='N').forEach((n, i) => {
            setTimeout(() => {
                let el = document.getElementById(n.id);
                el.style.top = '10%';
                el.style.opacity = 1;
            }, i * 350);
        });
    },
    formTree: () => {
        nodes.filter(n=>n.t!=='N').forEach(n => {
            let el = document.getElementById(n.id);
            el.style.left = n.x + '%';
            el.style.top = n.y + '%';
        });
        setTimeout(() => {
            nodes.filter(n=>n.t!=='N').forEach(n => {
                if(n.p && n.t !== 'N') drawLine(n.p, n.id);
            });
        }, 1000);
    },
    hl10: () => hl(['n10']),
    hl7_40: () => hl(['n7', 'n40']),
    clearHl: () => unhl(['n10', 'n7', 'n40']),
    line10_7: () => highlightPath('n10', 'n7'),
    line7_3: () => highlightPath('n7', 'n3'),
    line3_1_pulse: () => {
        highlightPath('n3', 'n1');
        document.getElementById('n1').classList.add('pulse');
    },
    zoom1_showNulls: () => {
        document.getElementById('container').style.transform = 'scale(1.6) translate(15%, -20%)';
        nodes.filter(n => n.t !== 'N' && !['n1','n3'].includes(n.id)).forEach(n => document.getElementById(n.id).classList.add('dim'));
        document.querySelectorAll('line').forEach(l => {
            if(!l.id.includes('n3-n1')) l.classList.add('dim');
        });
        ['nl1', 'nr1'].forEach(id => {
            let el = document.getElementById(id);
            el.style.opacity = 1;
            drawLine('n1', id);
        });
    },
    hl3: () => hl(['n3']),
    hlNulls1: () => hl(['nl1', 'nr1']),
    flashReds: () => {
        document.getElementById('container').style.transform = 'scale(1) translate(0, 0)';
        document.querySelectorAll('.dim').forEach(el => el.classList.remove('dim'));
        unhl(['n3', 'nl1', 'nr1']);
        document.getElementById('n1').classList.remove('pulse');
        document.querySelectorAll('.R').forEach(el => el.classList.add('flash'));
        setTimeout(() => {
            document.querySelectorAll('.R').forEach(el => el.classList.remove('flash'));
        }, 2500);
    },
    clearAll: () => {
        document.querySelectorAll('.highlight-path').forEach(l => l.classList.remove('highlight-path'));
        document.querySelectorAll('.highlight').forEach(n => n.classList.remove('highlight'));
        document.getElementById('checkmark').classList.remove('show');
    },
    showCounter0: () => {
        let c = document.getElementById('counter-panel');
        c.style.opacity = 1;
        document.getElementById('c-val').innerText = '0';
        document.getElementById('c-val').style.color = '#fff';
    },
    path10_c1: () => { hl(['n10']); document.getElementById('c-val').innerText = '1'; },
    path7_c2: () => { highlightPath('n10', 'n7'); hl(['n7']); document.getElementById('c-val').innerText = '2'; },
    path3_c3: () => { highlightPath('n7', 'n3'); hl(['n3']); document.getElementById('c-val').innerText = '3'; },
    path1_shake: () => {
        highlightPath('n3', 'n1');
        hl(['n1']);
        let c = document.getElementById('counter-panel');
        c.classList.remove('shake');
        void c.offsetWidth;
        c.classList.add('shake');
    },
    pathNl1_c4: () => { 
        highlightPath('n1', 'nl1'); 
        hl(['nl1']); 
        document.getElementById('c-val').innerText = '4'; 
        let c = document.getElementById('counter-panel');
        c.classList.remove('shake');
        document.getElementById('c-val').style.color = '#fff';
    },
    resetForPath2: () => {
        document.getElementById('c-val').innerText = '0';
        actions.clearAll();
    },
    path10_c1_2: () => { hl(['n10']); document.getElementById('c-val').innerText = '1'; },
    path7_c2_2: () => { highlightPath('n10', 'n7'); hl(['n7']); document.getElementById('c-val').innerText = '2'; },
    path8_c3: () => { highlightPath('n7', 'n8'); hl(['n8']); document.getElementById('c-val').innerText = '3'; },
    pathNr8_c4: () => {
        ['nl8', 'nr8'].forEach(id => {
            let el = document.getElementById(id);
            el.style.opacity = 1;
            drawLine('n8', id);
        });
        setTimeout(() => { highlightPath('n8', 'nr8'); hl(['nr8']); }, 50);
        document.getElementById('c-val').innerText = '4';
    },
    showCheck: () => {
        document.getElementById('checkmark').classList.add('show');
    }
};

function speak(text) {
    return new Promise(resolve => {
        let u = new SpeechSynthesisUtterance(text);
        if(ukFemaleVoice) u.voice = ukFemaleVoice;
        u.rate = 0.95;
        u.pitch = 1.05;
        
        utterances.push(u); 
        
        u.onend = () => resolve();
        u.onerror = () => resolve(); 
        
        document.getElementById('subtitles').innerText = text;
        speechSynthesis.speak(u);
    });
}

async function startWalkthrough() {
    initVoices();
    document.getElementById('start-screen').style.opacity = 0;
    setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500);
    
    initNodes();

    for (let step of script) {
        if (step.a && actions[step.a]) {
            actions[step.a]();
        }
        await speak(step.t);
    }
    
    setTimeout(() => {
        document.getElementById('subtitles').innerText = "Walkthrough Complete.";
    }, 1000);
}

window.onload = () => {
    initVoices();
};
</script>
</body>
</html>
