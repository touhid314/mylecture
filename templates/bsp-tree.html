<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myLecture: BSP Tree</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    :root {
        --bg-color: #1e1e1e;
        --text-color: #eceff4;
        --accent-blue: #61AFEF;
        --accent-green: #98c379;
        --accent-red: #E06C75;
        --accent-yellow: #E5C07B;
        --accent-purple: #C678DD;
        --node-bg: #282c34;
        --edge-color: #5c6370;
    }

    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #000;
        font-family: 'Roboto', sans-serif;
    }

    body.export-mode *,
    body.export-mode *::before,
    body.export-mode *::after {
        animation: none !important;
        transition: none !important;
    }

    body.export-mode #play-overlay {
        display: none !important;
    }

    /* 9:16 Aspect Ratio Container */
    #player-container {
        position: relative;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        container-type: size;
        --reels-safe-bottom: clamp(240px, 22cqh, 430px);
        --subtitle-space: clamp(92px, 10cqh, 170px);
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    #progress-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: #333;
        z-index: 100;
    }

    #progress-bar {
        height: 100%;
        width: 0%;
        background: var(--accent-blue);
    }

    #play-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 200;
        cursor: pointer;
    }

    #play-btn {
        font-size: 24px;
        padding: 15px 30px;
        background: var(--accent-blue);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
    }

    /* Scene Layouts */
    .scene {
        position: absolute;
        inset: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        padding: clamp(20px, 5cqw, 64px) clamp(20px, 5cqw, 64px) calc(var(--reels-safe-bottom) + var(--subtitle-space));
    }

    .scene.active {
        opacity: 1;
        pointer-events: auto;
    }

    .title {
        color: var(--accent-blue);
        font-weight: bold;
        text-align: center;
        border: 2px solid var(--accent-blue);
        background: rgba(97, 175, 239, 0.1);
        font-size: clamp(28px, 6.1cqw, 76px);
        margin-top: clamp(36px, 7cqh, 130px);
        padding: clamp(12px, 3cqw, 36px) clamp(18px, 5cqw, 58px);
        border-width: 3px;
        border-radius: 12px;
        opacity: 0;
    }

    .subtitle {
        color: var(--accent-yellow);
        text-align: center;
        opacity: 0;
        font-size: clamp(20px, 4.4cqw, 54px);
        margin-top: clamp(14px, 4cqh, 64px);
    }

    /* Text Boxes */
    .info-box {
        margin-top: auto;
        border: 1px solid #555;
        background: #2a2a2a;
        text-align: center;
        opacity: 0;
        border-radius: 12px;
        width: min(94%, 960px);
        margin-bottom: clamp(48px, 9cqh, 170px);
        padding: clamp(18px, 4.2cqw, 54px);
        font-size: clamp(20px, 4.5cqw, 54px);
        line-height: 1.28;
        border-width: 2px;
    }

    .status-text {
        font-weight: bold;
        opacity: 0;
        font-size: clamp(28px, 5.6cqw, 70px);
        margin-top: clamp(14px, 4cqh, 64px);
        text-align: center;
    }

    .text-green { color: var(--accent-green); }
    .text-yellow { color: var(--accent-yellow); }
    .text-blue { color: var(--accent-blue); }
    .text-red { color: var(--accent-red); }
    .text-purple { color: var(--accent-purple); }

    /* SVGs */
    svg {
        width: 100%;
        height: 65%;
        margin-top: clamp(10px, 2cqh, 40px);
    }

    .bsp-wall {
        stroke-width: 12;
        stroke-linecap: round;
        opacity: 0;
        transition: stroke 0.3s, opacity 0.3s;
    }
    .bsp-wall.wall-a { stroke: var(--accent-blue); }
    .bsp-wall.wall-b { stroke: var(--accent-yellow); }
    .bsp-wall.wall-c { stroke: var(--accent-purple); }

    .bsp-slice {
        stroke-width: 4;
        stroke-dasharray: 10, 10;
        opacity: 0;
        transition: opacity 0.3s;
    }
    .bsp-slice.slice-a { stroke: var(--accent-blue); }
    .bsp-slice.slice-b { stroke: var(--accent-yellow); }
    .bsp-slice.slice-c { stroke: var(--accent-purple); }

    .bsp-region {
        opacity: 0;
        transition: opacity 0.3s, fill 0.3s;
    }
    .region-front { fill: rgba(97, 175, 239, 0.15); }
    .region-back { fill: rgba(229, 192, 123, 0.15); }

    .player-dot {
        fill: var(--accent-green);
        stroke: #fff;
        stroke-width: 3;
        r: 12;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .vision-cone {
        fill: rgba(152, 195, 121, 0.2);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .tree-edge {
        stroke: var(--edge-color);
        stroke-width: 6;
        fill: none;
        opacity: 0;
        transition: opacity 0.3s, stroke 0.3s;
    }

    .tree-edge.active {
        stroke: var(--accent-green);
    }

    .tree-node {
        fill: var(--node-bg);
        stroke-width: 6;
        rx: 12;
        opacity: 0;
        transition: opacity 0.3s, stroke 0.3s, fill 0.3s;
    }
    .tree-node.wall-a { stroke: var(--accent-blue); }
    .tree-node.wall-b { stroke: var(--accent-yellow); }
    .tree-node.wall-c { stroke: var(--accent-purple); }

    .tree-text {
        fill: #fff;
        font-size: 28px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: central;
        opacity: 0;
        transition: opacity 0.3s;
    }

    /* Solid Draw Animation */
    .drawn-solid {
        stroke: #fff !important;
        stroke-width: 16 !important;
        box-shadow: 0 0 20px #fff;
        z-index: 100;
    }

    /* Subtitles */
    #subtitle-caption {
        position: absolute;
        left: clamp(52px, 8cqw, 110px);
        right: clamp(52px, 8cqw, 110px);
        bottom: calc(var(--reels-safe-bottom) + clamp(18px, 2.4cqh, 42px));
        z-index: 80;
        min-height: clamp(56px, 6cqh, 104px);
        color: #f8fafc;
        font-size: clamp(28px, 4.4cqw, 56px);
        font-weight: 800;
        line-height: 1.12;
        text-align: center;
        text-shadow: 0 3px 9px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,1);
        opacity: 0;
        pointer-events: none;
    }

    #subtitle-caption.visible { opacity: 1; }

    /* Summary */
    #scene3 .title { margin-top: clamp(36px, 7cqh, 120px); }
    .summary-panel {
        width: min(92%, 900px);
        margin-top: clamp(28px, 5cqh, 88px);
        display: grid;
        gap: clamp(18px, 3cqh, 34px);
    }
    #summary-focus {
        min-height: clamp(86px, 9cqh, 142px);
        display: grid;
        place-items: center;
        padding: clamp(14px, 2.6cqw, 30px);
        border: 2px solid rgba(97, 175, 239, 0.42);
        border-radius: 10px;
        background: rgba(17, 24, 32, 0.86);
        color: #f8fafc;
        font-size: clamp(28px, 5cqw, 60px);
        font-weight: 800;
        line-height: 1.08;
        text-align: center;
        text-shadow: 0 3px 8px rgba(0,0,0,0.65);
    }
    .summary-meter {
        height: clamp(10px, 1.5cqh, 18px);
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        overflow: hidden;
    }
    #summary-meter-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-blue), var(--accent-green), var(--accent-yellow));
    }
    .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(12px, 2cqh, 24px);
    }
    .summary-item {
        display: grid;
        grid-template-columns: clamp(46px, 6.4cqw, 70px) 1fr;
        gap: clamp(10px, 2cqw, 20px);
        align-items: center;
        min-height: clamp(74px, 8cqh, 118px);
        padding: clamp(12px, 2.3cqw, 24px);
        border: 1px solid rgba(255,255,255,0.13);
        border-radius: 10px;
        background: rgba(36, 43, 53, 0.72);
        opacity: 0.36;
        transform: translateX(-22px) scale(0.96);
    }
    .summary-item.active {
        opacity: 1;
        transform: translateX(0) scale(1.03);
        border-color: var(--accent-blue);
        background: rgba(97, 175, 239, 0.16);
        box-shadow: 0 0 22px rgba(97, 175, 239, 0.2);
    }
    .summary-item.done {
        opacity: 0.82;
        transform: translateX(0) scale(1);
        border-color: rgba(152, 195, 121, 0.5);
        background: rgba(152, 195, 121, 0.1);
    }
    .summary-icon {
        display: grid;
        place-items: center;
        width: clamp(46px, 6.4cqw, 70px);
        height: clamp(46px, 6.4cqw, 70px);
        border-radius: 50%;
        background: rgba(255,255,255,0.1);
        font-size: clamp(24px, 4cqw, 44px);
    }
    .summary-copy {
        display: grid;
        gap: clamp(4px, 0.9cqh, 10px);
        min-width: 0;
    }
    .summary-label {
        font-size: clamp(20px, 3.2cqw, 36px);
        font-weight: 800;
        line-height: 1.05;
    }
    .summary-note {
        color: #cbd5e1;
        font-size: clamp(15px, 2.35cqw, 26px);
        line-height: 1.12;
    }

</style>
</head>
<body>

<div id="player-container">
    <div id="play-overlay" onclick="startLecture()">
        <button id="play-btn">Play Lecture</button>
    </div>

    <!-- Intro Scene -->
    <div id="scene1" class="scene active">
        <div id="title-main" class="title">The BSP Tree</div>
        <div id="title-sub" class="subtitle">Classic Gaming Secret</div>
        
        <div id="doom-preview" style="position: absolute; left: 0; right: 0; top: clamp(200px, 28cqh, 400px); opacity: 0; transform: scale(0.85); overflow: hidden; border-top: 4px solid var(--accent-red); border-bottom: 4px solid var(--accent-red); box-shadow: 0 0 40px rgba(224, 108, 117, 0.3); z-index: 5;">
            <img src="doom.png" alt="DOOM Gameplay" style="width: 100%; height: clamp(220px, 32cqh, 450px); display: block; object-fit: cover; object-position: center;">
        </div>
        
        <div id="intro-box" class="info-box" style="margin-top: clamp(200px, 32cqh, 450px); position: relative; z-index: 10;">
            A recursive structure that slices space to sort 3D scenes<br><br>
            <span class="text-green">Binary Space Partitioning</span>
        </div>
    </div>

    <!-- Main Visual Scene -->
    <div id="scene2" class="scene">
        <svg id="stage" viewBox="20 50 350 510">
            <!-- Map Grid Background -->
            <g id="grid-lines" opacity="0.1">
                <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250 M 0 300 L 400 300 M 0 350 L 400 350 M 0 400 L 400 400" stroke="#fff" stroke-width="1" />
                <path d="M 50 0 L 50 400 M 100 0 L 100 400 M 150 0 L 150 400 M 200 0 L 200 400 M 250 0 L 250 400 M 300 0 L 300 400 M 350 0 L 350 400" stroke="#fff" stroke-width="1" />
            </g>

            <!-- Regions -->
            <rect id="reg-front-a" class="bsp-region region-front" x="30" y="70" width="150" height="280" />
            <rect id="reg-back-a" class="bsp-region region-back" x="180" y="70" width="160" height="280" />

            <!-- Slices -->
            <line id="slice-a" class="bsp-slice slice-a" x1="180" y1="70" x2="180" y2="350" />
            <line id="slice-b" class="bsp-slice slice-b" x1="40" y1="110" x2="180" y2="250" />
            <line id="slice-c" class="bsp-slice slice-c" x1="180" y1="200" x2="340" y2="160" />

            <!-- Walls -->
            <line id="wall-a" class="bsp-wall wall-a" x1="180" y1="120" x2="180" y2="280" />
            <text id="lbl-wall-a" class="tree-text" x="200" y="140" fill="var(--accent-blue)">A</text>

            <line id="wall-b" class="bsp-wall wall-b" x1="80" y1="150" x2="130" y2="200" />
            <text id="lbl-wall-b" class="tree-text" x="90" y="185" fill="var(--accent-yellow)">B</text>

            <line id="wall-c" class="bsp-wall wall-c" x1="220" y1="190" x2="280" y2="175" />
            <text id="lbl-wall-c" class="tree-text" x="250" y="160" fill="var(--accent-purple)">C</text>

            <!-- Player & Vision -->
            <polygon id="vision" class="vision-cone" points="130,240 100,60 260,60" />
            <circle id="player" class="player-dot" cx="130" cy="240" />

            <!-- Tree Diagram (Bottom Section 400-600) -->
            <!-- Edges -->
            <path id="edge-b" class="tree-edge" d="M 195 470 L 125 500" />
            <path id="edge-c" class="tree-edge" d="M 195 470 L 265 500" />

            <!-- Nodes -->
            <rect id="tn-a" class="tree-node wall-a" x="150" y="420" width="90" height="50" />
            <text id="tt-a" class="tree-text" x="195" y="445">Wall A</text>

            <rect id="tn-b" class="tree-node wall-b" x="80" y="500" width="90" height="50" />
            <text id="tt-b" class="tree-text" x="125" y="525">Wall B</text>

            <rect id="tn-c" class="tree-node wall-c" x="220" y="500" width="90" height="50" />
            <text id="tt-c" class="tree-text" x="265" y="525">Wall C</text>
        </svg>

        <div id="dynamic-status" class="status-text"></div>
    </div>

    <!-- Summary Scene -->
    <div id="scene3" class="scene">
        <div class="title" style="opacity: 1;">Summary</div>
        <div class="summary-panel">
            <div id="summary-focus">BSP Tree recap</div>
            <div class="summary-meter">
                <div id="summary-meter-fill"></div>
            </div>
            <div class="summary-grid">
                <div id="summary-slice" class="summary-item">
                    <div class="summary-icon">🔪</div>
                    <div class="summary-copy">
                        <div class="summary-label text-blue">Slices Space</div>
                        <div class="summary-note">Divides map in half.</div>
                    </div>
                </div>
                <div id="summary-tree" class="summary-item">
                    <div class="summary-icon">🌳</div>
                    <div class="summary-copy">
                        <div class="summary-label text-green">Binary Tree</div>
                        <div class="summary-note">Organizes geometry.</div>
                    </div>
                </div>
                <div id="summary-painter" class="summary-item">
                    <div class="summary-icon">🎨</div>
                    <div class="summary-copy">
                        <div class="summary-label text-red">Painter's Algo</div>
                        <div class="summary-note">Back-to-front draw.</div>
                    </div>
                </div>
                <div id="summary-doom" class="summary-item">
                    <div class="summary-icon">🎮</div>
                    <div class="summary-copy">
                        <div class="summary-label text-yellow">DOOM Secret</div>
                        <div class="summary-note">Powers retro 3D.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="subtitle-caption"></div>
</div>

<script>
    const VIDEO_PLAN = [
        { id: "step-01-intro", kind: "narration+visual", text: "Ever wonder how 90s games like DOOM rendered 3D worlds so fast? Meet the BSP Tree." },
        { id: "step-02-setup", kind: "narration+visual", text: "It stands for Binary Space Partitioning, and it’s a way of recursively slicing space in half." },
        { id: "step-03-process-1", kind: "narration+visual", text: "The BSP tree picks one wall and extends an infinite line straight through it." },
        { id: "step-04-process-2", kind: "narration+visual", text: "Everything in front goes to one side of the tree, and everything behind goes to the other." },
        { id: "step-05-search-1", kind: "narration+visual", text: "It keeps slicing these spaces until every wall is cleanly separated." },
        { id: "step-06-search-2", kind: "narration+visual", text: "Why do this? To draw the scene perfectly! The game checks where the player is standing..." },
        { id: "step-07-search-3", kind: "narration+visual", text: "...and walks the tree to draw walls from back-to-front. Far walls first, then close ones!" },
        { id: "step-08-conclusion", kind: "narration+visual", text: "Lightning-fast sorting, perfect 3D rendering, and a classic gaming secret. That's the BSP Tree!" }
    ];

    window.__VIDEO_PLAN__ = VIDEO_PLAN;

    function byId(id) { return document.getElementById(id); }

    function setOpacity(id, value) {
        const el = byId(id);
        if (!el) return;
        el.style.opacity = String(value);
        if (!['line', 'rect', 'circle', 'path', 'polygon'].includes(el.tagName.toLowerCase())) {
            el.classList.toggle('visible', Number(value) > 0.01);
        }
    }

    const SUBTITLE_CUES = {
        "step-01-intro": [
            [0, "🤔 Ever wonder how 90s games like DOOM rendered 3D worlds so fast?"],
            [3.5, "🌳 Meet the BSP Tree."]
        ],
        "step-02-setup": [
            [0, "🗺️ It stands for Binary Space Partitioning,"],
            [2.2, "🔪 and it’s a way of recursively slicing space in half."]
        ],
        "step-03-process-1": [
            [0, "📍 The BSP tree picks one wall"],
            [1.5, "📏 and extends an infinite line straight through it."]
        ],
        "step-04-process-2": [
            [0, "⬅️ Everything in front goes to one side of the tree,"],
            [2.8, "➡️ and everything behind goes to the other."]
        ],
        "step-05-search-1": [
            [0, "🔪 It keeps slicing these spaces"],
            [2.0, "✅ until every wall is cleanly separated."]
        ],
        "step-06-search-2": [
            [0, "🎮 Why do this? To draw the scene perfectly!"],
            [2.5, "📍 The game checks where the player is standing..."]
        ],
        "step-07-search-3": [
            [0, "🚶‍♂️ ...and walks the tree to draw walls from back-to-front."],
            [3.0, "🎨 Far walls first, then close ones!"]
        ],
        "step-08-conclusion": [
            [0, "⚡ Lightning-fast sorting, 🎨 perfect 3D rendering,"],
            [3.5, "🎮 and a classic gaming secret."],
            [5.5, "🌳 That's the BSP Tree!"]
        ]
    };

    function subtitleTextFor(segment, localTime) {
        const cues = SUBTITLE_CUES[segment.id] || [[0, String(segment.text || "")]];
        let text = cues[0][1];
        for (const [start, cueText] of cues) {
            if (localTime >= start) text = cueText;
            else break;
        }
        return text;
    }

    function showSubtitle(segment, localTime) {
        const subtitle = byId('subtitle-caption');
        if (!subtitle) return;
        const text = subtitleTextFor(segment, localTime);
        subtitle.textContent = text;
        subtitle.style.opacity = text ? "1" : "0";
        subtitle.classList.toggle('visible', Boolean(text));
    }

    function switchScene(sceneId) {
        document.querySelectorAll('.scene').forEach(s => {
            s.classList.remove('active');
            s.style.opacity = "0";
        });
        const scene = byId(sceneId);
        if (!scene) return;
        scene.classList.add('active');
        scene.style.opacity = "1";
    }

    function resetVisualState() {
        byId('play-overlay').style.display = 'none';
        switchScene('scene1');
        
        setOpacity('title-main', 0);
        setOpacity('title-sub', 0);
        setOpacity('intro-box', 0);
        setOpacity('doom-preview', 0);
        resetSummaryState();

        // Hide map elements
        document.querySelectorAll('.bsp-wall, .tree-text').forEach(w => w.style.opacity = "0");
        document.querySelectorAll('.bsp-slice, .bsp-region, .vision-cone, .player-dot').forEach(el => setOpacity(el.id, 0));
        
        // Hide tree elements
        document.querySelectorAll('.tree-node').forEach(n => {
            n.style.opacity = "0";
            n.style.fill = "var(--node-bg)";
        });
        document.querySelectorAll('.tree-edge').forEach(e => {
            e.style.opacity = "0";
            e.classList.remove('active');
        });
        
        document.querySelectorAll('.drawn-solid').forEach(el => el.classList.remove('drawn-solid'));

        setOpacity('dynamic-status', 0);
        byId('dynamic-status').innerText = "";
        byId('dynamic-status').className = 'status-text';
    }

    const SUMMARY_CUES = [
        { start: 0.0, id: 'summary-slice', text: '🔪 Slices Space' },
        { start: 1.5, id: 'summary-tree', text: '🌳 Binary Tree' },
        { start: 3.0, id: 'summary-painter', text: '🎨 Painter\'s Algo' },
        { start: 4.5, id: 'summary-doom', text: '🎮 DOOM Secret' }
    ];

    function resetSummaryState() {
        document.querySelectorAll('.summary-item').forEach(el => el.classList.remove('active', 'done'));
        const meter = byId('summary-meter-fill');
        if (meter) meter.style.width = '0%';
        const focus = byId('summary-focus');
        if (focus) focus.textContent = 'BSP Tree recap';
    }

    function setSummaryState(localTime) {
        const duration = 7;
        byId('summary-meter-fill').style.width = `${Math.max(0, Math.min(1, localTime / duration)) * 100}%`;

        let activeIndex = 0;
        for (let i = 0; i < SUMMARY_CUES.length; i++) {
            if (localTime >= SUMMARY_CUES[i].start) activeIndex = i;
        }

        SUMMARY_CUES.forEach((cue, index) => {
            const el = byId(cue.id);
            el.classList.toggle('done', index < activeIndex);
            el.classList.toggle('active', index === activeIndex);
        });

        byId('summary-focus').textContent = SUMMARY_CUES[activeIndex].text;
    }

    function estimateSegmentDuration(segment) {
        if (Number.isFinite(Number(segment.resolvedDuration))) return Number(segment.resolvedDuration);
        if (Number.isFinite(Number(segment.duration))) return Number(segment.duration);
        const words = String(segment.text || '').trim().split(/\s+/).filter(Boolean).length;
        return Math.max(2.5, words / 2.65);
    }

    function setProgress(index, localTime, globalTime) {
        let progress = 0;
        if (Number.isFinite(globalTime) && Number.isFinite(window.__VIDEO_DURATION__) && window.__VIDEO_DURATION__ > 0) {
            progress = globalTime / window.__VIDEO_DURATION__;
        } else {
            let elapsed = 0;
            let total = 0;
            for (let i = 0; i < VIDEO_PLAN.length; i++) {
                const duration = estimateSegmentDuration(VIDEO_PLAN[i]);
                total += duration;
                if (i < index) elapsed += duration;
                else if (i === index) elapsed += Math.min(Math.max(localTime, 0), duration);
            }
            progress = total > 0 ? elapsed / total : 0;
        }
        byId('progress-bar').style.width = `${Math.max(0, Math.min(1, progress)) * 100}%`;
    }

    function renderSection(segment, localTime, globalTime = NaN) {
        const index = Math.max(0, VIDEO_PLAN.findIndex(item => item.id === segment.id));
        resetVisualState();
        setProgress(index, localTime, globalTime);
        showSubtitle(segment, localTime);

        if (index <= 1) {
            setOpacity('title-main', 1);
            setOpacity('title-sub', 1);
        }

        switch (segment.id) {
            case 'step-01-intro':
                if (localTime > 3.5) {
                    setOpacity('intro-box', 1);
                }
                
                if (localTime > 0.1) {
                    let progress = Math.min(1, (localTime - 0.1) / 0.8);
                    // easeOutCubic
                    let eased = 1 - Math.pow(1 - progress, 3);
                    setOpacity('doom-preview', eased);
                    byId('doom-preview').style.transform = `scale(${0.85 + (0.15 * eased)})`;
                }
                break;
                
            case 'step-02-setup':
                switchScene('scene2');
                setOpacity('wall-a', 1); setOpacity('lbl-wall-a', 1);
                setOpacity('wall-b', 1); setOpacity('lbl-wall-b', 1);
                setOpacity('wall-c', 1); setOpacity('lbl-wall-c', 1);
                break;
                
            case 'step-03-process-1':
                switchScene('scene2');
                setOpacity('wall-a', 1); setOpacity('lbl-wall-a', 1);
                setOpacity('wall-b', 1); setOpacity('lbl-wall-b', 1);
                setOpacity('wall-c', 1); setOpacity('lbl-wall-c', 1);
                if (localTime > 1.5) {
                    setOpacity('slice-a', 1);
                }
                break;
                
            case 'step-04-process-2':
                switchScene('scene2');
                setOpacity('wall-a', 1); setOpacity('lbl-wall-a', 1);
                setOpacity('wall-b', 1); setOpacity('lbl-wall-b', 1);
                setOpacity('wall-c', 1); setOpacity('lbl-wall-c', 1);
                setOpacity('slice-a', 1);
                
                if (localTime > 0.5) {
                    setOpacity('reg-front-a', 1);
                    setOpacity('reg-back-a', 1);
                }
                if (localTime > 2.0) {
                    setOpacity('tn-a', 1); setOpacity('tt-a', 1);
                    setOpacity('tn-b', 1); setOpacity('tt-b', 1);
                    setOpacity('tn-c', 1); setOpacity('tt-c', 1);
                    setOpacity('edge-b', 1); setOpacity('edge-c', 1);
                }
                break;
                
            case 'step-05-search-1':
                switchScene('scene2');
                setOpacity('wall-a', 1); setOpacity('lbl-wall-a', 1);
                setOpacity('wall-b', 1); setOpacity('lbl-wall-b', 1);
                setOpacity('wall-c', 1); setOpacity('lbl-wall-c', 1);
                setOpacity('tn-a', 1); setOpacity('tt-a', 1);
                setOpacity('tn-b', 1); setOpacity('tt-b', 1);
                setOpacity('tn-c', 1); setOpacity('tt-c', 1);
                setOpacity('edge-b', 1); setOpacity('edge-c', 1);
                
                setOpacity('slice-a', 1);
                if (localTime > 1.0) {
                    setOpacity('slice-b', 1);
                    setOpacity('slice-c', 1);
                }
                break;
                
            case 'step-06-search-2':
                switchScene('scene2');
                setOpacity('wall-a', 1); setOpacity('lbl-wall-a', 1);
                setOpacity('wall-b', 1); setOpacity('lbl-wall-b', 1);
                setOpacity('wall-c', 1); setOpacity('lbl-wall-c', 1);
                setOpacity('slice-a', 1); setOpacity('slice-b', 1); setOpacity('slice-c', 1);
                setOpacity('tn-a', 1); setOpacity('tt-a', 1);
                setOpacity('tn-b', 1); setOpacity('tt-b', 1);
                setOpacity('tn-c', 1); setOpacity('tt-c', 1);
                setOpacity('edge-b', 1); setOpacity('edge-c', 1);
                
                if (localTime > 1.0) {
                    setOpacity('player', 1);
                    setOpacity('vision', 1);
                }
                if (localTime > 2.5) {
                    byId('tn-a').style.fill = "rgba(97, 175, 239, 0.4)";
                    byId('dynamic-status').className = 'status-text text-blue';
                    setOpacity('dynamic-status', 1);
                    byId('dynamic-status').innerText = "PLAYER IN FRONT OF A";
                }
                break;
                
            case 'step-07-search-3':
                switchScene('scene2');
                setOpacity('wall-a', 1); setOpacity('lbl-wall-a', 1);
                setOpacity('wall-b', 1); setOpacity('lbl-wall-b', 1);
                setOpacity('wall-c', 1); setOpacity('lbl-wall-c', 1);
                setOpacity('slice-a', 1); setOpacity('slice-b', 1); setOpacity('slice-c', 1);
                setOpacity('tn-a', 1); setOpacity('tt-a', 1);
                setOpacity('tn-b', 1); setOpacity('tt-b', 1);
                setOpacity('tn-c', 1); setOpacity('tt-c', 1);
                setOpacity('edge-b', 1); setOpacity('edge-c', 1);
                setOpacity('player', 1);
                setOpacity('vision', 1);

                // Painter's algorithm visualization: Draw C, then A, then B
                if (localTime > 1.5) {
                    byId('wall-c').classList.add('drawn-solid');
                    byId('tn-c').style.fill = "rgba(198, 120, 221, 0.6)";
                }
                if (localTime > 2.5) {
                    byId('wall-a').classList.add('drawn-solid');
                    byId('tn-a').style.fill = "rgba(97, 175, 239, 0.6)";
                }
                if (localTime > 3.5) {
                    byId('wall-b').classList.add('drawn-solid');
                    byId('tn-b').style.fill = "rgba(229, 192, 123, 0.6)";
                }
                
                if (localTime > 3.5) {
                    byId('dynamic-status').className = 'status-text text-green';
                    setOpacity('dynamic-status', 1);
                    byId('dynamic-status').innerText = "DRAWN BACK-TO-FRONT";
                }
                break;
                
            case 'step-08-conclusion':
                switchScene('scene3');
                setSummaryState(localTime);
                break;
        }
    }

    window.__RENDER_SECTION__ = renderSection;

    const params = new URLSearchParams(window.location.search);
    if (params.get('export') === '1') {
        document.body.classList.add('export-mode');
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderSection(VIDEO_PLAN[0], 0);
    });

    function startLecture() {
        let step = 0;
        let time = 0;
        byId('play-overlay').style.display = 'none';
        
        const interval = setInterval(() => {
            time += 0.5;
            if (time > 4.5) {
                time = 0;
                step++;
            }
            if (step >= VIDEO_PLAN.length) {
                clearInterval(interval);
                return;
            }
            renderSection(VIDEO_PLAN[step], time);
        }, 500);
    }
</script>

</body>
</html>
