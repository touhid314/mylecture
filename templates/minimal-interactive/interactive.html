<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Interactive Template</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    
    /* Interactive UI stays hidden during video export mode */
    body.export-mode #interactive-ui {
      display: none !important;
    }

    #interactive-ui {
      display: none; /* Shown dynamically via __START_INTERACTIVE__ */
      text-align: center;
    }

    button {
      padding: 16px 32px;
      font-size: 24px;
      font-weight: bold;
      background-color: #00d2ff;
      color: #000000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.2s ease;
    }

    button:hover:not(:disabled) {
      background-color: #33ddff;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Interactive Area -->
  <div id="interactive-ui">
    <h1 style="font-size: 48px;">Interactive Step Demo</h1>
    <p id="step-indicator" style="font-size: 24px; margin-top: 10px; color: #888888;">Step 1 of 3</p>
    
    <div style="margin-top: 30px; display: flex; gap: 16px; justify-content: center;">
      <button id="prev-btn" onclick="changeStep(-1)">Previous</button>
      <button id="next-btn" onclick="changeStep(1)">Next</button>
      <button id="restart-btn" onclick="restart()">Restart</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. REQUIRED CONTRACT GLOBALS
    // -------------------------------------------------------------
    window.__VIDEO_METADATA__ = {
      contractVersion: "0.1",
      title: "Minimal Interactive Template",
      aspectRatio: "16:9"
    };

    window.__VIDEO_PLAN__ = [
      {
        id: "practice-segment",
        kind: "interactive",
        title: "Practice"
      }
    ];

    // Compatibility layer: prevents player from throwing "No render timeline found"
    // when loaded in player view by providing a minimal 0.1s dummy video timeline.
    window.__VIDEO_DURATION__ = 0.1;
    window.__VIDEO_TIMELINE__ = [
      {
        start: 0,
        end: 0.1,
        duration: 0.1,
        item: { id: "intro-dummy", kind: "visual-only", duration: 0.1 }
      }
    ];

    // Render section callback (required by contract)
    window.__RENDER_SECTION__ = function(segment, localTime, globalTime) {
      // Auto-start interactive UI on first render tick so user doesn't have to click "Play"
      const isExport = new URLSearchParams(window.location.search).get("export") === "1";
      if (!isExport) {
        window.__START_INTERACTIVE__(segment);
      }
    };

    // Start interactive segment callback (called by player when playback ends)
    let interactiveStarted = false;
    window.__START_INTERACTIVE__ = function(segment) {
      if (interactiveStarted) return;
      interactiveStarted = true;
      document.getElementById("interactive-ui").style.display = "block";
      updateUI();
    };

    // -------------------------------------------------------------
    // 2. INTERACTIVE APP STATE
    // -------------------------------------------------------------
    let currentStep = 0;
    const totalSteps = 3;

    function changeStep(direction) {
      currentStep = Math.max(0, Math.min(totalSteps - 1, currentStep + direction));
      updateUI();
    }

    function restart() {
      currentStep = 0;
      updateUI();
    }

    function updateUI() {
      document.getElementById("step-indicator").innerText = "Step " + (currentStep + 1) + " of " + totalSteps;
      
      // Update button states
      document.getElementById("prev-btn").disabled = (currentStep === 0);
      document.getElementById("next-btn").disabled = (currentStep === totalSteps - 1);
    }

    // -------------------------------------------------------------
    // 3. RUNNER & VIEWER INITIALIZATION
    // -------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {
      const isIframe = window.self !== window.top;
      const isExport = new URLSearchParams(window.location.search).get("export") === "1";
      
      if (isExport) return;

      if (!isIframe) {
        // Direct browser load: start interactive mode immediately
        window.__START_INTERACTIVE__(window.__VIDEO_PLAN__[0]);
      } else {
        // Hosted iframe load: programmatically trigger the parent's play button
        // so that the player runs through its 0.1s dummy timeline and activates interactive mode.
        try {
          const parentDoc = window.parent.document;
          const playBtn = parentDoc.getElementById("play");
          if (playBtn && (playBtn.title === "Play" || playBtn.getAttribute("aria-label") === "Play")) {
            playBtn.click();
          }
        } catch (e) {
          console.warn("Failed to auto-start parent player:", e);
        }
      }
    });
  </script>
</body>
</html>
