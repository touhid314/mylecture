<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyLecture Coursegen · Beta</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #111111;
      --panel-2: #181818;
      --border: #2d2d2d;
      --text: #f2f2f2;
      --muted: #a3a3a3;
      --accent: #ededed;
      --accent-2: #d4d4d4;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --bad: #f07178;
      --radius: 6px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) { border-color: #4a4a4a; background: #2a2a2a; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #050505;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: #ffffff; border-color: #ffffff; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    input, select, textarea {
      width: 100%;
      background: #090909;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
    }
    textarea { min-height: 72px; resize: vertical; }
    label { display: grid; gap: 0.35rem; font-size: 0.9rem; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: #0d0d0d;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .brand-identity {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }
    .brand-lockup {
      width: 108px;
      height: 42px;
      object-fit: contain;
      flex: 0 0 auto;
      margin: -9px -2px -8px -3px;
    }
    .brand-copy { min-width: 0; }
    .brand-title {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .brand h1 {
      margin: 0;
      font-size: 0.98rem;
      letter-spacing: 0.01em;
    }
    .beta-badge {
      display: inline-flex;
      align-items: center;
      height: 1.15rem;
      padding: 0 0.38rem;
      border: 1px solid #4a4a4a;
      border-radius: 999px;
      color: var(--muted-strong, #c7c7c7);
      background: #181818;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .brand-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.18rem;
    }
    #refreshCoursesBtn {
      width: 34px;
      min-width: 34px;
      padding: 0.55rem 0;
    }
    .course-list {
      display: grid;
      grid-auto-rows: 82px;
      align-content: start;
      gap: 0.45rem;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }
    .course-item {
      height: 82px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .course-item.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #050505;
      box-shadow: none;
    }
    .course-item.active .course-select { color: #050505; }
    .course-item.active span { color: #555555; }
    .course-select {
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.15rem;
      padding: 0.15rem 0.3rem;
      text-align: left;
      background: transparent;
      border-color: transparent;
    }
    .course-select:hover:not(:disabled) {
      background: transparent;
      border-color: transparent;
    }
    .course-item span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .course-item strong {
      display: -webkit-box;
      overflow: hidden;
      font-size: 0.95rem;
      line-height: 1.2;
      white-space: normal;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .course-item span { color: var(--muted); font-size: 0.8rem; }
    .course-item-actions {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .course-item-action {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
    }
    .course-item-action svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .course-item.active .course-item-action {
      border-color: #b8b8b8;
      color: #222222;
    }
    .course-item-action.delete:hover:not(:disabled) {
      border-color: var(--bad);
      color: var(--bad);
      background: rgba(240, 113, 120, 0.1);
    }
    .main {
      padding: 1.2rem 1.4rem 1.4rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1rem;
      min-height: 100vh;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 1rem;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .hero h2 { margin: 0 0 0.35rem; font-size: 1.45rem; }
    .hero .meta { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
    .stats {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .stat {
      min-width: 110px;
      padding: 0.7rem 0.85rem;
      border-radius: 6px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .stat strong { display: block; font-size: 1.2rem; }
    .stat span { color: var(--muted); font-size: 0.78rem; }
    .progress {
      margin-top: 0.8rem;
      height: 10px;
      background: #090909;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress > div {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1rem;
      min-height: 0;
    }
    .section-title {
      margin: 0 0 0.8rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .actions {
      display: grid;
      gap: 0.55rem;
    }
    .actions .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .lectures {
      overflow: auto;
      max-height: 52vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.45rem;
      border-bottom: 1px solid rgba(45, 45, 45, 0.8);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
    .lecture-time { white-space: nowrap; }
    .output-markers {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.35rem;
    }
    .output-marker {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.12rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #181818;
      color: #d8d8d8;
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .output-marker::before {
      content: '';
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 50%;
      background: #d8d8d8;
    }
    .output-marker.interactive::before { background: var(--ok); }
    .output-marker.game::before { background: var(--warn); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: capitalize;
      border: 1px solid transparent;
    }
    .badge.done { color: var(--ok); background: rgba(62, 207, 142, 0.12); border-color: rgba(62, 207, 142, 0.25); }
    .badge.failed { color: var(--bad); background: rgba(240, 113, 120, 0.12); border-color: rgba(240, 113, 120, 0.25); }
    .badge.pending { color: var(--muted); background: rgba(139, 155, 176, 0.08); border-color: rgba(139, 155, 176, 0.2); }
    .badge.generating, .badge.resolving, .badge.rendering {
      color: var(--warn);
      background: rgba(240, 180, 41, 0.12);
      border-color: rgba(240, 180, 41, 0.25);
    }
    .plan-form {
      display: grid;
      gap: 0.8rem;
    }
    .form-error {
      padding: 0.6rem 0.7rem;
      border: 1px solid rgba(240, 113, 120, 0.35);
      border-radius: 6px;
      background: rgba(240, 113, 120, 0.08);
      color: var(--bad);
      font-size: 0.84rem;
      line-height: 1.4;
    }
    .form-error[hidden] { display: none; }
    .plan-form .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .log {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      background: #090909;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .empty {
      color: var(--muted);
      padding: 2rem 1rem;
      text-align: center;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .checkbox input { width: auto; }
    details {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      background: var(--panel-2);
    }
    details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .advanced-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.75rem;
    }
    .lecture-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .lecture-actions button {
      padding: 0.3rem 0.55rem;
      font-size: 0.78rem;
    }
    .plan-view {
      margin-top: 0.85rem;
    }
    .plan-view .plan-description {
      margin: 0.65rem 0 0.75rem;
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .plan-module {
      margin: 0.75rem 0 0;
    }
    .plan-module h4 {
      margin: 0 0 0.35rem;
      font-size: 0.92rem;
      color: var(--text);
    }
    .plan-module ul {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 0.55rem;
    }
    .plan-module li {
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .plan-lec-meta {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin: 0.1rem 0 0.25rem;
    }
    .plan-note {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.2rem;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; }
      .grid-2 { grid-template-columns: 1fr; }
      .lectures { max-height: none; }
    }
  </style>
</head>

              <h1>Coursegen</h1>
            </div>
            <div class="brand-meta">
              <p>Plan, run, publish</p>
              <span class="beta-badge">BETA</span>
            </div>
          </div>
        </div>
        <button id="refreshCoursesBtn" title="Refresh course list">↻</button>
      </div>
      <div class="row" style="display:flex; gap:0.45rem; flex-wrap:wrap;">
        <button class="primary" id="newCourseBtn" style="flex:1;">+ New course</button>
        <button id="addReferenceBtn" style="flex:1;">+ Reference</button>
      </div>
      <div class="course-list" id="courseList"></div>
    </aside>

    <main class="main">
      <section class="panel" id="heroPanel">
        <div class="empty">Select a course or create a new one.</div>
      </section>

      <section class="grid-2">
        <div class="panel" id="leftPanel"></div>
        <div class="panel" id="rightPanel"></div>
      </section>

      <section class="panel">
        <div class="log-toolbar">
          <strong>Job log</strong>
          <div class="row">
            <button id="stopJobBtn" disabled>Stop job</button>
            <button id="clearLogBtn">Clear view</button>
          </div>
        </div>
        <div class="log" id="jobLog">No jobs yet.</div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      courses: [],
      sources: [],
      selectedSlug: null,
      summary: null,
      meta: null,
      activeJobId: null,
      activeJobCommand: null,
      jobActive: false,
      logLines: [],
      pollTimer: null,
      coursePlanOpen: false
    };

    const els = {
      courseList: document.getElementById('courseList'),
      heroPanel: document.getElementById('heroPanel'),
      leftPanel: document.getElementById('leftPanel'),
      rightPanel: document.getElementById('rightPanel'),
      jobLog: document.getElementById('jobLog'),
      stopJobBtn: document.getElementById('stopJobBtn'),
      clearLogBtn: document.getElementById('clearLogBtn'),
      refreshCoursesBtn: document.getElementById('refreshCoursesBtn'),
      newCourseBtn: document.getElementById('newCourseBtn'),
      addReferenceBtn: document.getElementById('addReferenceBtn')
    };

    async function api(path, options) {
      const response = await fetch(path, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    function badgeClass(status) {
      if (status === 'done') return 'done';
      if (status === 'failed') return 'failed';
      if (status === 'pending') return 'pending';
      return 'generating';
    }

    function renderOutputMarkers(formats) {
      const labels = { video: 'Video', interactive: 'Interactive', game: 'Game' };
      return (Array.isArray(formats) ? formats : [])
        .filter(format => labels[format])
        .map(format => `<span class="output-marker ${format}">${labels[format]}</span>`)
        .join('');
    }

    function renderLog() {
      els.jobLog.textContent = state.logLines.length ? state.logLines.join('\n') : 'No jobs yet.';
      els.jobLog.scrollTop = els.jobLog.scrollHeight;
    }

    function setLog(lines) {
      state.logLines = Array.isArray(lines) ? lines.slice() : [];
      renderLog();
    }

    function appendLog(line) {
      state.logLines.push(line);
      if (state.logLines.length > 4000) state.logLines.splice(0, state.logLines.length - 3000);
      renderLog();
    }

    function syncPlanButton() {
      const form = document.getElementById('planForm');
      const button = form?.querySelector('button[type="submit"]');
      if (button) {
        button.disabled = state.jobActive;
        button.textContent = state.jobActive
          ? (state.activeJobCommand === 'plan' ? 'Planning course…' : 'Job running…')
          : 'Plan course';
        if (state.jobActive) form.setAttribute('aria-busy', 'true');
        else form.removeAttribute('aria-busy');
      }
      els.courseList.querySelectorAll('[data-course-action="delete"]').forEach(deleteButton => {
        deleteButton.disabled = state.jobActive;
      });
    }

    async function loadMeta() {
      state.meta = await api('/api/meta');
      if (Array.isArray(state.meta?.sources)) {
        state.sources = state.meta.sources;
      }
    }

    async function loadSources() {
      const payload = await api('/api/sources');
      state.sources = payload.sources || [];
      if (state.meta) state.meta.sources = state.sources;
    }

    async function loadCourses() {
      const payload = await api('/api/courses');
      state.courses = payload.courses || [];
      renderCourseList();
    }

    function sourceOptionsHtml() {
      const sources = state.sources || [];
      const opts = [
        `<option value="">None (ungrounded)</option>`,
        ...sources.map(source => {
          const label = `${source.title} (${source.slug}, ${source.sectionCount} sections)`;
          return `<option value="${escapeHtml(source.slug)}">${escapeHtml(label)}</option>`;
        })
      ];
      return opts.join('');
    }

    function ttsProviderOptionsHtml() {
      const providers = state.meta?.agentOptions?.tts?.providers || [];
      const selected = state.meta?.defaultTtsProvider || '';
      return providers.map(provider =>
        `<option value="${escapeHtml(provider.id)}"${provider.id === selected ? ' selected' : ''}${provider.configured ? '' : ' disabled'}>${escapeHtml(provider.label)}${provider.configured ? '' : ' (not configured)'}</option>`
      ).join('');
    }

    function ttsVoiceOptionsHtml(providerId = state.meta?.defaultTtsProvider || '') {
      const providers = state.meta?.agentOptions?.tts?.providers || [];
      const selected = state.meta?.defaultTtsVoice || '';
      const provider = providers.find(item => item.id === providerId && item.configured)
        || providers.find(item => item.configured);
      return (provider?.voices || []).map(voice =>
        `<option value="${escapeHtml(voice.id)}"${voice.id === selected ? ' selected' : ''}>${escapeHtml(voice.label)}</option>`
      ).join('');
    }

    async function loadSummary(slug) {
      state.summary = await api(`/api/courses/${encodeURIComponent(slug)}`);
      renderMain();
    }

    function renderCourseList() {
      if (!state.courses.length) {
        els.courseList.innerHTML = '<div class="empty">No courses yet.</div>';
        return;
      }
      els.courseList.innerHTML = state.courses.map(course => `
        <div class="course-item ${course.slug === state.selectedSlug ? 'active' : ''}">
          <button class="course-select" type="button" data-course-select="${escapeHtml(course.slug)}">
            <strong>${escapeHtml(course.title)}</strong>
            <span>${escapeHtml(course.slug)} · ${course.doneCount}/${course.lectureCount} done</span>
          </button>
          <div class="course-item-actions">
            <button class="course-item-action" type="button" data-course-action="open" data-course-slug="${escapeHtml(course.slug)}" title="Open course folder" aria-label="Open folder for ${escapeHtml(course.title)}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10H3z"/></svg>
            </button>
            <button class="course-item-action delete" type="button" data-course-action="delete" data-course-slug="${escapeHtml(course.slug)}" data-course-title="${escapeHtml(course.title)}" title="Delete course" aria-label="Delete ${escapeHtml(course.title)}"${state.jobActive ? ' disabled' : ''}>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>
            </button>
          </div>
        </div>
      `).join('');
      els.courseList.querySelectorAll('[data-course-select]').forEach(button => {
        button.addEventListener('click', () => selectCourse(button.dataset.courseSelect));
      });
      els.courseList.querySelectorAll('[data-course-action]').forEach(button => {
        button.addEventListener('click', () => onCourseListAction(
          button.dataset.courseAction,
          button.dataset.courseSlug,
          button.dataset.courseTitle
        ));
      });
    }

    async function onCourseListAction(action, slug, title = slug) {
      if (action === 'open') {
        try {
          await api(`/api/open-folder/${encodeURIComponent(slug)}`);
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error);
          appendLog(`Open folder error: ${message}`);
          alert(`Could not open course folder: ${message}`);
        }
        return;
      }
      if (action !== 'delete' || state.jobActive) return;
      if (!confirm(`Permanently delete the course "${title}" and everything in its folder?\n\nThis cannot be undone.`)) return;
      try {
        await api(`/api/courses/${encodeURIComponent(slug)}`, { method: 'DELETE' });
        if (state.selectedSlug === slug) showPlanForm();
        await loadCourses();
        appendLog(`Deleted course: ${slug}`);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        appendLog(`Delete error: ${message}`);
        alert(`Could not delete course: ${message}`);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    async function selectCourse(slug) {
      state.selectedSlug = slug;
      state.coursePlanOpen = false;
      renderCourseList();
      await loadSummary(slug);
    }

    function showPlanForm() {
      state.selectedSlug = null;
      state.summary = null;
      renderCourseList();
      renderPlanForm();
      els.heroPanel.innerHTML = '<div class="hero"><div><h2>New course</h2><p class="meta">Plan a syllabus with the course planner. Generation runs after you pick the course from the sidebar.</p></div></div>';
      els.rightPanel.innerHTML = '<div class="empty">After planning, select the new course to run generation.</div>';
    }

    function showIngestForm() {
      state.selectedSlug = null;
      state.summary = null;
      renderCourseList();
      renderIngestForm();
      els.heroPanel.innerHTML = '<div class="hero"><div><h2>Add reference</h2><p class="meta">Ingest an open-licensed PDF into <code>gens/sources/</code>. Attach it when planning for textbook-grounded courses.</p></div></div>';
      const sources = state.sources || [];
      els.rightPanel.innerHTML = sources.length
        ? `<h3 class="section-title">Existing sources</h3>
           <div class="lectures"><table>
             <thead><tr><th>Slug</th><th>Title</th><th>Sections</th></tr></thead>
             <tbody>
               ${sources.map(s => `
                 <tr>
                   <td>${escapeHtml(s.slug)}</td>
                   <td>${escapeHtml(s.title)}</td>
                   <td>${s.sectionCount}</td>
                 </tr>`).join('')}
             </tbody>
           </table></div>`
        : '<div class="empty">No sources ingested yet.</div>';
    }

    function renderIngestForm() {
      els.leftPanel.innerHTML = `
        <h3 class="section-title">Reference material</h3>
        <form class="plan-form" id="ingestForm">
          <label>PDF file
            <input name="pdfFile" type="file" accept="application/pdf,.pdf" />
          </label>
          <label>Or absolute PDF path (advanced)
            <input name="pdfPath" placeholder="C:\\books\\openstax-algebra.pdf" />
          </label>
          <label>Source slug
            <input name="source" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="openstax-algebra" title="lowercase hyphenated slug" />
          </label>
          <div class="row-2">
            <label>Chapters filter (optional)
              <input name="chapters" placeholder="1-9" />
            </label>
            <label>Title (optional)
              <input name="title" placeholder="College Algebra" />
            </label>
          </div>
          <button class="primary" type="submit">Ingest PDF</button>
        </form>
      `;
      document.getElementById('ingestForm').addEventListener('submit', onIngestSubmit);
    }

    async function onIngestSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const source = form.source.value.trim();
      const chapters = form.chapters.value.trim() || undefined;
      const title = form.title.value.trim() || undefined;
      const file = form.pdfFile.files?.[0];
      let pdfPath = form.pdfPath.value.trim() || undefined;

      if (!source) {
        alert('Source slug is required.');
        return;
      }
      if (!file && !pdfPath) {
        alert('Choose a PDF file or enter an absolute path.');
        return;
      }

      try {
        if (file) {
          const params = new URLSearchParams({ source });
          const upload = await fetch(`/api/ingest/upload?${params}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/pdf' },
            body: file
          });
          const payload = await upload.json().catch(() => ({}));
          if (!upload.ok) throw new Error(payload.error || `Upload failed (${upload.status})`);
          pdfPath = payload.pdfPath;
        }

        await startJob({
          command: 'ingest',
          pdfPath,
          source,
          chapters,
          title
        });
      } catch (error) {
        appendLog(`Ingest error: ${error.message}`);
        alert(error.message);
      }
    }

    function renderPlanForm() {
      const audiences = ['', ...(state.meta?.audiences || [])];
      const intents = ['', ...(state.meta?.intents || [])];
      els.leftPanel.innerHTML = `

        <form class="plan-form" id="planForm" novalidate>

            <input name="topic" placeholder="Fractions, SQL indexes, Photosynthesis..." required />

          <label>Scope (optional)

        </form>
      `;
      document.getElementById('planForm').addEventListener('submit', onPlanSubmit);
      syncPlanButton();

    async function onPlanSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const field = name => form.elements.namedItem(name);
      const topicInput = field('topic');
      const errorBox = document.getElementById('planFormError');
      const submitButton = form.querySelector('button[type="submit"]');
      const topic = topicInput.value.trim();

      errorBox.hidden = true;
      errorBox.textContent = '';
      if (!topic) {
        errorBox.textContent = 'Enter a topic before planning the course.';
        errorBox.hidden = false;
        topicInput.focus();
        return;
      }

      const body = {
        command: 'plan',
        topic,
        scope: field('scope').value.trim() || undefined,
        audience: field('audience').value || undefined,
        intent: field('intent').value || undefined,
        lectures: Number(field('lectures').value || 12),
        budget: Number(field('budget').value || 5),
        model: field('model').value.trim() || undefined,
        source: field('source').value || undefined,
        dryRun: field('dryRun').checked
      };

      state.activeJobCommand = 'plan';
      state.jobActive = true;
      syncPlanButton();
      submitButton.textContent = 'Starting planner…';
      try {
        await startJob(body);
      } catch (error) {
        state.jobActive = false;
        state.activeJobCommand = null;
        syncPlanButton();
        const message = error instanceof Error ? error.message : String(error);
        errorBox.textContent = `Could not start planner: ${message}`;
        errorBox.hidden = false;
        appendLog(`Plan error: ${message}`);
      }
    }

              <label>Lecture timeout (min)<input id="lectureTimeout" type="number" min="1" value="20" /></label>

      document.getElementById('ttsProvider')?.addEventListener('change', event => {
        const voiceSelect = document.getElementById('ttsVoice');
        if (voiceSelect) voiceSelect.innerHTML = ttsVoiceOptionsHtml(event.target.value);
      });

        <div class="lectures">
          <table>

              <tr>
                <th>#</th>
                <th>Title</th>

                <th>Cost</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${lectures.map(lecture => {
                const canRender = Boolean(lecture.renderReady);
                return `
                <tr>
                  <td>${lecture.order}</td>

                    <div>${escapeHtml(lecture.title)}</div>
                    <div class="plan-lec-meta">${escapeHtml(lecture.slug)}</div>
                    <div class="output-markers" aria-label="Planned outputs">${renderOutputMarkers(lecture.formats)}</div>
                    ${lecture.error ? `<div class="plan-lec-meta" style="color:var(--bad);">${escapeHtml(lecture.error.split('\n')[0])}</div>` : ''}

    function renderPlanView(plan, isOpen = false) {
      const openAttribute = isOpen ? ' open' : '';
      if (!plan?.modules?.length) {
        return `
          <details class="plan-view"${openAttribute}>
            <summary>Detailed Course Plan</summary>
            <p class="meta" style="margin:0.65rem 0 0;">No modules in plan.</p>
          </details>
        `;
      }
      const desc = String(plan.description || '').trim();
      const summary = String(plan.summary || '').trim();
      const showDescription = desc && desc !== summary;
      const modulesHtml = plan.modules.map(mod => `
        <div class="plan-module">
          <h4>${escapeHtml(mod.title)}</h4>
          <ul>
            ${(mod.lectures || []).map(lec => `
              <li>
                <strong>${escapeHtml(lec.title)}</strong>
                <span class="plan-lec-meta">${escapeHtml(lec.slug)} · ${Number(lec.durationMinutes)} min · ${escapeHtml((lec.formats || []).join(', '))}</span>
                <div>${escapeHtml(lec.objective || '')}</div>
                ${Array.isArray(lec.sourceSections) && lec.sourceSections.length
                  ? `<div class="plan-note">Sources: ${escapeHtml(lec.sourceSections.join(', '))}</div>`
                  : ''}
                ${lec.promptNotes
                  ? `<div class="plan-note">${escapeHtml(lec.promptNotes)}</div>`
                  : ''}
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
      return `
        <details class="plan-view"${openAttribute}>
          <summary>Detailed Course Plan</summary>
          ${showDescription ? `<p class="plan-description">${escapeHtml(desc)}</p>` : ''}
          ${modulesHtml}
        </details>

    function readAdvanced() {
      const val = id => document.getElementById(id)?.value?.trim();
      const num = id => {
        const raw = val(id);
        return raw ? Number(raw) : undefined;
      };
      return {
        forceLecture: val('forceLecture') || undefined,
        budget: num('runBudget'),
        model: val('runModel') || undefined,
        lectureTimeout: num('lectureTimeout'),
        ttsProvider: val('ttsProvider') || undefined,
        ttsVoice: val('ttsVoice') || undefined,
        dryRun: document.getElementById('dryRunAction')?.checked || false,
        render: document.getElementById('renderMp4')?.checked || false
      };
    }

    async function onExtendSubmit(event) {
      event.preventDefault();
      if (!state.selectedSlug) return;
      const form = event.target;
      const body = {
        command: 'extend',
        courseSlug: state.selectedSlug,
        topic: form.topic.value.trim() || undefined,
        scope: form.scope.value.trim() || undefined,
        moduleTitle: form.moduleTitle.value.trim() || undefined,
        placement: form.placement.value || 'auto',
        lectures: Number(form.lectures.value || 3),
        dryRun: form.dryRun.checked
      };
      if (!confirm('Extend this course? The planner will propose the next module from the existing syllabus.')) return;
      await startJob(body);
    }

    function buildJobBody(advanced, overrides = {}) {
      return {
        courseSlug: state.selectedSlug,
        yes: true,
        ...advanced,
        ...overrides
      };
    }

    function stripRenderOnlyFlags(body) {
      delete body.render;
      return body;
    }

    async function onLectureAction(action, slug) {
      if (!state.selectedSlug || !slug) return;
      const lecture = (state.summary?.lectures || []).find(row => row.slug === slug);
      const title = lecture?.title || slug;
      const advanced = readAdvanced();

      if (action === 'run') {
        const renderNote = advanced.render ? '\n\nThen it will also render MP4.' : '';
        if (!confirm(
          `FULL REGEN for "${title}" (${slug})?\n\n` +
          `This deletes existing video, interactive, game, audio, and MP4 artifacts for this lecture, then regenerates from scratch.\n\n` +
          `It ignores attempt/budget caps. Use Render if you only want MP4 from existing resolved HTML.` +
          renderNote
        )) return;
        const command = state.summary?.state ? 'resume' : 'run';
        await startJob(buildJobBody(advanced, { forceLecture: slug, command }));
        return;
      }

      if (action === 'render') {
        if (!lecture?.renderReady) return;
        if (!confirm(`Render MP4 for "${title}" only?`)) return;
        await startJob(stripRenderOnlyFlags(buildJobBody(advanced, {
          forceLecture: slug,
          command: 'render'
        })));
      }
    }

    async function onAction(action) {
      if (!state.selectedSlug) return;
      const advanced = readAdvanced();

      if (action === 'status') {
        await loadSummary(state.selectedSlug);
        return;
      }
      if (action === 'open-folder') {
        await api(`/api/open-folder/${encodeURIComponent(state.selectedSlug)}`);
        return;
      }

      const renderReadyCount = state.summary?.progress?.renderReady ?? 0;
      const messages = {
        run: 'Start full course generation? This can take a long time and spend API budget.',
        resume: advanced.forceLecture
          ? `Resume will regenerate "${advanced.forceLecture}"${advanced.render ? ' and then render MP4' : ''}. Use the Render MP4 button for render-only. Continue?`
          : 'Resume generation and retry failed lectures?',
        render: `Render MP4 from existing resolved HTML only (no re-resolve)? ${renderReadyCount} lecture(s) ready.`,
        publish: 'Upload course as a draft to the website package?',
        'go-live': 'Publish this course live on the catalog?'
      };
      if (!confirm(messages[action] || 'Run this action?')) return;

      const body = buildJobBody(advanced);

      if (action === 'run') body.command = 'run';
      else if (action === 'resume') body.command = 'resume';
      else if (action === 'render') {
        body.command = 'render';
        stripRenderOnlyFlags(body);
      }
      else if (action === 'publish') body.command = 'publish';
      else if (action === 'go-live') {
        body.command = 'publish';
        body.goLive = true;
      }

      await startJob(body);
    }

    async function startJob(body) {
      const job = await api('/api/jobs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      state.activeJobId = job.id;
      state.activeJobCommand = job.command || body.command || null;
      state.jobActive = job.status === 'running' || job.status === 'queued';
      syncPlanButton();
      setLog(job.log || []);
      els.stopJobBtn.disabled = job.status !== 'running' && job.status !== 'queued';
      startPolling();
    }

    async function pollJob() {
      if (!state.activeJobId) return;
      try {
        const job = await api(`/api/jobs/${encodeURIComponent(state.activeJobId)}`);
        setLog(job.log || []);
        els.stopJobBtn.disabled = job.status !== 'running';

        if (job.status === 'running' || job.status === 'queued') {
          state.jobActive = true;
          syncPlanButton();
          if (state.selectedSlug) await loadSummary(state.selectedSlug);
          await loadCourses();
          return;
        }

        state.jobActive = false;
        syncPlanButton();
        stopPolling();
        await loadCourses();
        if (job.command === 'ingest' || state.activeJobCommand === 'ingest') {
          await loadSources();
          showIngestForm();
        }
        if (job.courseSlug) {
          state.selectedSlug = job.courseSlug;
          await loadSummary(job.courseSlug);
        } else if (state.selectedSlug) {
          await loadSummary(state.selectedSlug);
        }
      } catch (error) {
        appendLog(`Poll error: ${error.message}`);
      }
    }

    function startPolling() {
      stopPolling();
      state.pollTimer = setInterval(pollJob, 2000);
      pollJob();
    }

    function stopPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    els.stopJobBtn.addEventListener('click', async () => {
      if (!state.activeJobId) return;
      await api(`/api/jobs/${encodeURIComponent(state.activeJobId)}/stop`, { method: 'POST' });
      await pollJob();
    });

    els.clearLogBtn.addEventListener('click', () => setLog([]));
    els.refreshCoursesBtn.addEventListener('click', loadCourses);
    els.newCourseBtn.addEventListener('click', async () => {
      await loadSources();
      showPlanForm();
    });
    els.addReferenceBtn.addEventListener('click', async () => {
      await loadSources();
      showIngestForm();
    });

    async function boot() {
      try {
        await loadMeta();
        await loadCourses();
        showPlanForm();
      } catch (error) {
        els.heroPanel.innerHTML = `<div class="empty">Failed to connect: ${escapeHtml(error.message)}</div>`;
      }
    }

    boot();
  </script>
</body>
</html>
