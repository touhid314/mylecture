<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coursegen</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #161d27;
      --panel-2: #1c2533;
      --border: #2a3544;
      --text: #e7edf5;
      --muted: #8b9bb0;
      --accent: #5b9cf5;
      --accent-2: #3d7dd6;
      --ok: #3ecf8e;
      --warn: #f0b429;
      --bad: #f07178;
      --review: #c792ea;
      --radius: 10px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, #182235, var(--bg) 45%);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) { border-color: var(--accent); background: #243044; }
    button.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { filter: brightness(1.05); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    input, select, textarea {
      width: 100%;
      background: #0d1218;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.7rem;
    }
    textarea { min-height: 72px; resize: vertical; }
    label { display: grid; gap: 0.35rem; font-size: 0.9rem; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(15, 20, 25, 0.85);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    .brand p {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .course-list {
      display: grid;
      gap: 0.45rem;
      overflow: auto;
      flex: 1;
      min-height: 0;
    }
    .course-item {
      text-align: left;
      padding: 0.7rem 0.8rem;
      background: var(--panel);
      border-radius: var(--radius);
    }
    .course-item.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(91, 156, 245, 0.35);
    }
    .course-item strong { display: block; font-size: 0.95rem; }
    .course-item span { color: var(--muted); font-size: 0.8rem; }
    .sidebar-tabs {
      display: flex;
      gap: 0.35rem;
    }
    .sidebar-tabs button {
      flex: 1;
      padding: 0.4rem 0.5rem;
      font-size: 0.82rem;
    }
    .sidebar-tabs button.active {
      border-color: var(--accent);
      background: #243044;
    }
    .module-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      padding: 0.75rem 0.85rem;
      display: grid;
      gap: 0.45rem;
    }
    .module-card h4 { margin: 0; font-size: 0.98rem; }
    .module-card .meta { color: var(--muted); font-size: 0.8rem; line-height: 1.4; }
    .module-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .main {
      padding: 1.2rem 1.4rem 1.4rem;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1rem;
      min-height: 100vh;
    }
    .panel {
      background: rgba(22, 29, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 1rem;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .hero h2 { margin: 0 0 0.35rem; font-size: 1.45rem; }
    .hero .meta { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
    .stats {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .stat {
      min-width: 110px;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
    }
    .stat strong { display: block; font-size: 1.2rem; }
    .stat span { color: var(--muted); font-size: 0.78rem; }
    .progress {
      margin-top: 0.8rem;
      height: 10px;
      background: #0d1218;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress > div {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--ok));
      width: 0%;
      transition: width 0.25s ease;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1rem;
      min-height: 0;
    }
    .section-title {
      margin: 0 0 0.8rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .actions {
      display: grid;
      gap: 0.55rem;
    }
    .actions .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .lectures {
      overflow: auto;
      max-height: 52vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th, td {
      text-align: left;
      padding: 0.55rem 0.45rem;
      border-bottom: 1px solid rgba(42, 53, 68, 0.7);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: capitalize;
      border: 1px solid transparent;
    }
    .badge.done { color: var(--ok); background: rgba(62, 207, 142, 0.12); border-color: rgba(62, 207, 142, 0.25); }
    .badge.failed { color: var(--bad); background: rgba(240, 113, 120, 0.12); border-color: rgba(240, 113, 120, 0.25); }
    .badge.needs-review { color: var(--review); background: rgba(199, 146, 234, 0.12); border-color: rgba(199, 146, 234, 0.25); }
    .badge.pending { color: var(--muted); background: rgba(139, 155, 176, 0.08); border-color: rgba(139, 155, 176, 0.2); }
    .badge.generating, .badge.resolving, .badge.rendering, .badge.generating-practice, .badge.reviewing {
      color: var(--warn);
      background: rgba(240, 180, 41, 0.12);
      border-color: rgba(240, 180, 41, 0.25);
    }
    .plan-form {
      display: grid;
      gap: 0.8rem;
    }
    .plan-form .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .log {
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 0.78rem;
      line-height: 1.45;
      background: #0a0f14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .empty {
      color: var(--muted);
      padding: 2rem 1rem;
      text-align: center;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .checkbox input { width: auto; }
    details {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.75rem;
      background: var(--panel-2);
    }
    details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .advanced-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-top: 0.75rem;
    }
    .lecture-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .lecture-actions button {
      padding: 0.3rem 0.55rem;
      font-size: 0.78rem;
    }
    .plan-view {
      margin-top: 0.85rem;
    }
    .plan-view .plan-description {
      margin: 0.65rem 0 0.75rem;
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .plan-module {
      margin: 0.75rem 0 0;
    }
    .plan-module h4 {
      margin: 0 0 0.35rem;
      font-size: 0.92rem;
      color: var(--text);
    }
    .plan-module ul {
      margin: 0;
      padding-left: 1.1rem;
      display: grid;
      gap: 0.55rem;
    }
    .plan-module li {
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .plan-lec-meta {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      margin: 0.1rem 0 0.25rem;
    }
    .plan-note {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.2rem;
    }
    .test-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(8, 12, 18, 0.72);
      padding: 1.25rem;
      overflow: auto;
    }
    .test-overlay.open { display: block; }
    .edit-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 41;
      background: rgba(8, 12, 18, 0.72);
      padding: 1.25rem;
      overflow: auto;
    }
    .edit-overlay.open { display: block; }
    .edit-sheet {
      max-width: 520px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem 1.3rem;
    }
    .edit-sheet h2 { margin: 0 0 0.75rem; font-size: 1.15rem; }
    .edit-sheet label {
      display: block;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .edit-sheet select,
    .edit-sheet textarea {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      box-sizing: border-box;
    }
    .edit-sheet textarea { min-height: 7rem; resize: vertical; }
    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .test-sheet {
      max-width: 820px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem 1.3rem;
    }
    .test-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: flex-start;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .test-toolbar h2 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    .test-toolbar .meta { margin: 0; }
    .test-phase-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .test-phase-tabs button.active {
      border-color: var(--accent);
      background: #243044;
    }
    .test-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      padding: 0.85rem 0.95rem;
      margin-bottom: 0.75rem;
    }
    .test-item.correct { border-color: rgba(62, 207, 142, 0.45); }
    .test-item.incorrect { border-color: rgba(240, 113, 120, 0.45); }
    .test-item h3 {
      margin: 0 0 0.55rem;
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .test-choice {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      padding: 0.45rem 0.5rem;
      border-radius: 8px;
      margin-top: 0.25rem;
      cursor: pointer;
    }
    .test-choice:hover { background: rgba(91, 156, 245, 0.08); }
    .test-choice input { width: auto; margin-top: 0.2rem; }
    .test-choice.picked { background: rgba(91, 156, 245, 0.12); }
    .test-choice.key { outline: 1px solid rgba(62, 207, 142, 0.45); }
    .test-choice.miss { outline: 1px solid rgba(240, 113, 120, 0.45); }
    .test-item-meta {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }
    .test-score {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.9rem;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { min-height: auto; }
      .grid-2 { grid-template-columns: 1fr; }
      .lectures { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>Coursegen</h1>
          <p>Class, course, tests</p>
        </div>
        <button id="refreshCoursesBtn" title="Refresh course list">↻</button>
      </div>
      <div class="sidebar-tabs">
        <button class="active" id="classesTabBtn" type="button">Classes</button>
        <button id="coursesTabBtn" type="button">Courses</button>
      </div>
      <div class="row" style="display:flex; gap:0.45rem; flex-wrap:wrap;">
        <button class="primary" id="newClassBtn" style="flex:1;">+ Class</button>
        <button class="primary" id="newCourseBtn" style="flex:1;">+ Course</button>
        <button id="addReferenceBtn" style="flex:1;">+ Ref</button>
      </div>
      <div class="course-list" id="courseList"></div>
    </aside>

    <main class="main">
      <section class="panel" id="heroPanel">
        <div class="empty">Create a class (modules + tests) or a standalone course.</div>
      </section>

      <section class="grid-2">
        <div class="panel" id="leftPanel"></div>
        <div class="panel" id="rightPanel"></div>
      </section>

      <div class="test-overlay" id="testOverlay" hidden>
        <div class="test-sheet" id="testSheet"></div>
      </div>

      <div class="edit-overlay" id="editOverlay" hidden>
        <div class="edit-sheet" id="editSheet">
          <h2 id="editTitle">Edit lecture HTML</h2>
          <p class="meta" id="editSubtitle"></p>
          <label>
            Target
            <select id="editTargetSelect">
              <option value="video">Video (index.html)</option>
              <option value="interactive">Interactive (interactive.html)</option>
              <option value="game">Game (game.html)</option>
            </select>
          </label>
          <label>
            Instruction
            <textarea id="editPromptInput" placeholder="Describe the change to apply to the existing HTML…"></textarea>
          </label>
          <div class="edit-actions">
            <button type="button" id="editCancelBtn">Cancel</button>
            <button type="button" class="primary" id="editApplyBtn">Apply</button>
          </div>
        </div>
      </div>

      <section class="panel">
        <div class="log-toolbar">
          <strong>Job log</strong>
          <div class="row">
            <button id="stopJobBtn" disabled>Stop job</button>
            <button id="clearLogBtn">Clear view</button>
          </div>
        </div>
        <div class="log" id="jobLog">No jobs yet.</div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      sidebar: 'classes',
      courses: [],
      classes: [],
      sources: [],
      selectedSlug: null,
      selectedClassSlug: null,
      summary: null,
      classSummary: null,
      meta: null,
      activeJobId: null,
      activeJobCommand: null,
      logLines: [],
      pollTimer: null,
      testViewer: null,
      editLectureSlug: null
    };

    const els = {
      courseList: document.getElementById('courseList'),
      heroPanel: document.getElementById('heroPanel'),
      leftPanel: document.getElementById('leftPanel'),
      rightPanel: document.getElementById('rightPanel'),
      jobLog: document.getElementById('jobLog'),
      stopJobBtn: document.getElementById('stopJobBtn'),
      clearLogBtn: document.getElementById('clearLogBtn'),
      refreshCoursesBtn: document.getElementById('refreshCoursesBtn'),
      newCourseBtn: document.getElementById('newCourseBtn'),
      newClassBtn: document.getElementById('newClassBtn'),
      addReferenceBtn: document.getElementById('addReferenceBtn'),
      classesTabBtn: document.getElementById('classesTabBtn'),
      coursesTabBtn: document.getElementById('coursesTabBtn'),
      testOverlay: document.getElementById('testOverlay'),
      testSheet: document.getElementById('testSheet')
    };

    async function api(path, options) {
      const response = await fetch(path, options);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    function badgeClass(status) {
      if (status === 'done') return 'done';
      if (status === 'failed') return 'failed';
      if (status === 'needs-review') return 'needs-review';
      if (status === 'pending') return 'pending';
      return 'generating';
    }

    function renderLog() {
      const pinToBottom = els.jobLog.scrollHeight - els.jobLog.scrollTop - els.jobLog.clientHeight < 32;
      els.jobLog.textContent = state.logLines.length ? state.logLines.join('\n') : 'No jobs yet.';
      if (pinToBottom) els.jobLog.scrollTop = els.jobLog.scrollHeight;
    }

    function withPreservedScroll(fn) {
      const lectures = document.querySelector('#rightPanel .lectures');
      const saved = {
        windowY: window.scrollY,
        lectures: lectures ? lectures.scrollTop : 0,
        rightPanel: els.rightPanel.scrollTop,
        leftPanel: els.leftPanel.scrollTop,
        courseList: els.courseList.scrollTop
      };
      fn();
      const restore = () => {
        const nextLectures = document.querySelector('#rightPanel .lectures');
        if (nextLectures) nextLectures.scrollTop = saved.lectures;
        els.rightPanel.scrollTop = saved.rightPanel;
        els.leftPanel.scrollTop = saved.leftPanel;
        els.courseList.scrollTop = saved.courseList;
        window.scrollTo(0, saved.windowY);
      };
      restore();
      requestAnimationFrame(restore);
    }

    function setLog(lines) {
      state.logLines = Array.isArray(lines) ? lines.slice() : [];
      renderLog();
    }

    function appendLog(line) {
      state.logLines.push(line);
      if (state.logLines.length > 4000) state.logLines.splice(0, state.logLines.length - 3000);
      renderLog();
    }

    async function loadMeta() {
      state.meta = await api('/api/meta');
      if (Array.isArray(state.meta?.sources)) {
        state.sources = state.meta.sources;
      }
    }

    async function loadSources() {
      const payload = await api('/api/sources');
      state.sources = payload.sources || [];
      if (state.meta) state.meta.sources = state.sources;
    }

    async function loadCourses() {
      const payload = await api('/api/courses');
      state.courses = payload.courses || [];
      renderSidebarList();
    }

    async function loadClasses() {
      const payload = await api('/api/classes');
      state.classes = payload.classes || [];
      renderSidebarList();
    }

    function setSidebar(mode) {
      state.sidebar = mode;
      els.classesTabBtn.classList.toggle('active', mode === 'classes');
      els.coursesTabBtn.classList.toggle('active', mode === 'courses');
      renderSidebarList();
    }

    function sourceOptionsHtml() {
      const sources = state.sources || [];
      const opts = [
        `<option value="">None (ungrounded)</option>`,
        ...sources.map(source => {
          const label = `${source.title} (${source.slug}, ${source.sectionCount} sections)`;
          return `<option value="${escapeHtml(source.slug)}">${escapeHtml(label)}</option>`;
        })
      ];
      return opts.join('');
    }

    async function loadSummary(slug) {
      state.summary = await api(`/api/courses/${encodeURIComponent(slug)}`);
      renderMain();
    }

    function renderSidebarList() {
      withPreservedScroll(() => renderSidebarListNow());
    }

    function renderSidebarListNow() {
      if (state.sidebar === 'classes') {
        if (!state.classes.length) {
          els.courseList.innerHTML = '<div class="empty">No classes yet.</div>';
          return;
        }
        els.courseList.innerHTML = state.classes.map(item => `
          <button class="course-item ${item.slug === state.selectedClassSlug ? 'active' : ''}" data-class-slug="${item.slug}">
            <strong>${escapeHtml(item.title)}</strong>
            <span>${escapeHtml(item.slug)} · ${item.plannedCount}/${item.moduleCount} courses · ${item.assessmentCount} tests</span>
          </button>
        `).join('');
        els.courseList.querySelectorAll('[data-class-slug]').forEach(button => {
          button.addEventListener('click', () => selectClass(button.dataset.classSlug));
        });
        return;
      }

      if (!state.courses.length) {
        els.courseList.innerHTML = '<div class="empty">No courses yet.</div>';
        return;
      }
      els.courseList.innerHTML = state.courses.map(course => `
        <button class="course-item ${course.slug === state.selectedSlug ? 'active' : ''}" data-slug="${course.slug}">
          <strong>${escapeHtml(course.title)}</strong>
          <span>${escapeHtml(course.slug)} · ${course.doneCount}/${course.lectureCount} done</span>
        </button>
      `).join('');
      els.courseList.querySelectorAll('[data-slug]').forEach(button => {
        button.addEventListener('click', () => selectCourse(button.dataset.slug));
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function closeTestViewer() {
      state.testViewer = null;
      els.testOverlay.classList.remove('open');
      els.testOverlay.hidden = true;
      els.testSheet.innerHTML = '';
    }

    function scorePhase(phase, answers) {
      const results = (phase.items || []).map(item => {
        const selectedChoiceId = String(answers[item.id] || '').trim();
        return {
          itemId: item.id,
          selectedChoiceId,
          correct: Boolean(selectedChoiceId) && selectedChoiceId === item.correctChoiceId,
          correctChoiceId: item.correctChoiceId,
          objectiveId: item.objectiveId
        };
      });
      return {
        correct: results.filter(row => row.correct).length,
        total: results.length,
        results
      };
    }

    function objectiveLabel(assessments, objectiveId) {
      const objective = (assessments.objectives || []).find(row => row.id === objectiveId);
      if (!objective) return objectiveId;
      return `${objective.statement} (${objective.lectureSlug})`;
    }

    function renderTestViewer() {
      const viewer = state.testViewer;
      if (!viewer) {
        closeTestViewer();
        return;
      }
      const phase = viewer.assessments[viewer.phase];
      const items = phase?.items || [];
      const isReview = viewer.mode === 'review';
      const isResult = viewer.mode === 'result';
      const resultById = Object.fromEntries((viewer.score?.results || []).map(row => [row.itemId, row]));
      const unanswered = items.filter(item => !viewer.answers[item.id]).length;

      els.testOverlay.hidden = false;
      els.testOverlay.classList.add('open');
      els.testSheet.innerHTML = `
        <div class="test-toolbar">
          <div>
            <h2>${escapeHtml(viewer.courseTitle)}</h2>
            <p class="meta">${escapeHtml(viewer.courseSlug)} · ${items.length} questions</p>
          </div>
          <div class="row">
            <button type="button" data-test-action="close">Close</button>
          </div>
        </div>
        <div class="test-phase-tabs">
          <button type="button" class="${viewer.phase === 'pre' ? 'active' : ''}" data-test-action="phase" data-phase="pre">Pre-test</button>
          <button type="button" class="${viewer.phase === 'post' ? 'active' : ''}" data-test-action="phase" data-phase="post">Post-test</button>
          <button type="button" class="${isReview ? 'active' : ''}" data-test-action="review">${isReview ? 'Reviewing key' : 'Review key'}</button>
        </div>
        <p class="meta" style="margin:0.75rem 0 0.9rem;">${escapeHtml(phase?.title || (viewer.phase === 'pre' ? 'Pre-test' : 'Post-test'))}</p>
        ${isResult ? `
          <div class="test-score">
            <div class="stat"><strong>${viewer.score.correct}/${viewer.score.total}</strong><span>correct</span></div>
            <div class="stat"><strong>${viewer.score.total ? Math.round((viewer.score.correct / viewer.score.total) * 100) : 0}%</strong><span>score</span></div>
          </div>
        ` : ''}
        ${items.map((item, index) => {
          const scored = resultById[item.id];
          const itemClass = isResult
            ? (scored?.correct ? 'correct' : 'incorrect')
            : '';
          return `
            <article class="test-item ${itemClass}">
              <h3>${index + 1}. ${escapeHtml(item.prompt)}</h3>
              ${(item.choices || []).map(choice => {
                const picked = viewer.answers[item.id] === choice.id;
                const showKey = isReview || isResult;
                const isKey = showKey && choice.id === item.correctChoiceId;
                const isMiss = isResult && picked && !isKey;
                return `
                  <label class="test-choice${picked ? ' picked' : ''}${isKey ? ' key' : ''}${isMiss ? ' miss' : ''}">
                    <input type="radio" name="${escapeHtml(item.id)}" value="${escapeHtml(choice.id)}" ${picked ? 'checked' : ''} ${isReview ? 'disabled' : ''} />
                    <span>${escapeHtml(choice.text)}</span>
                  </label>
                `;
              }).join('')}
              ${isReview || isResult ? `<div class="test-item-meta">Objective: ${escapeHtml(objectiveLabel(viewer.assessments, item.objectiveId))}</div>` : ''}
            </article>
          `;
        }).join('')}
        <div class="row" style="margin-top:0.4rem;">
          ${isReview || isResult ? '' : `<button class="primary" type="button" data-test-action="submit">Submit answers</button>`}
          ${isResult ? '<button type="button" data-test-action="retake">Clear and retake</button>' : ''}
          ${!isReview && unanswered && !isResult ? `<span class="meta">${unanswered} unanswered</span>` : ''}
        </div>
      `;

      els.testSheet.querySelectorAll('[data-test-action]').forEach(button => {
        button.addEventListener('click', () => onTestAction(button.dataset.testAction, button.dataset.phase));
      });
      els.testSheet.querySelectorAll('input[type="radio"]').forEach(input => {
        input.addEventListener('change', () => {
          if (!state.testViewer || state.testViewer.mode === 'review') return;
          state.testViewer.answers[input.name] = input.value;
          if (state.testViewer.mode === 'result') state.testViewer.mode = 'take';
          renderTestViewer();
        });
      });
    }

    function onTestAction(action, phase) {
      const viewer = state.testViewer;
      if (!viewer) return;
      if (action === 'close') {
        closeTestViewer();
        return;
      }
      if (action === 'phase' && (phase === 'pre' || phase === 'post')) {
        viewer.phase = phase;
        viewer.mode = 'take';
        viewer.answers = {};
        viewer.score = null;
        renderTestViewer();
        return;
      }
      if (action === 'review') {
        viewer.mode = viewer.mode === 'review' ? 'take' : 'review';
        viewer.score = null;
        renderTestViewer();
        return;
      }
      if (action === 'retake') {
        viewer.mode = 'take';
        viewer.answers = {};
        viewer.score = null;
        renderTestViewer();
        return;
      }
      if (action === 'submit') {
        const bundle = viewer.assessments[viewer.phase];
        viewer.score = scorePhase(bundle, viewer.answers);
        viewer.mode = 'result';
        renderTestViewer();
      }
    }

    async function onIngestSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const source = form.source.value.trim();
      const chapters = form.chapters.value.trim() || undefined;
      const title = form.title.value.trim() || undefined;
      const file = form.pdfFile.files?.[0];
      let pdfPath = form.pdfPath.value.trim() || undefined;

      if (!source) {
        alert('Source slug is required.');
        return;
      }
      if (!file && !pdfPath) {
        alert('Choose a PDF file or enter an absolute path.');
        return;
      }

      try {
        if (file) {
          const params = new URLSearchParams({ source });
          const upload = await fetch(`/api/ingest/upload?${params}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/pdf' },
            body: file
          });
          const payload = await upload.json().catch(() => ({}));
          if (!upload.ok) throw new Error(payload.error || `Upload failed (${upload.status})`);
          pdfPath = payload.pdfPath;
        }

        await startJob({
          command: 'ingest',
          pdfPath,
          source,
          chapters,
          title
        });
      } catch (error) {
        appendLog(`Ingest error: ${error.message}`);
        alert(error.message);
      }
    }

    async function onClassAction(action) {
      if (!state.selectedClassSlug || !state.classSummary) return;
      if (action === 'refresh') {
        await loadClassSummary(state.selectedClassSlug);
        return;
      }
      if (action === 'open-folder') {
        await api(`/api/open-class-folder/${encodeURIComponent(state.selectedClassSlug)}`);
        return;
      }
      if (action === 'plan-all') {
        const missing = state.classSummary.modules.filter(row => !row.hasCoursePlan);
        if (!missing.length) {
          alert('Every module already has a course plan.');
          return;
        }
        if (!confirm(`Plan the next missing course: "${missing[0].title}"? (${missing.length} still unplanned)`)) return;
        await startJob({
          command: 'plan-module',
          classSlug: state.selectedClassSlug,
          moduleSlug: missing[0].slug
        });
        return;
      }
      if (action === 'tests-all') {
        const missing = state.classSummary.modules.filter(row => row.hasCoursePlan && !row.hasAssessments);
        if (!missing.length) {
          alert('No planned courses are missing tests.');
          return;
        }
        if (!confirm(`Generate tests for ${missing[0].title}? This runs one assessment job.`)) return;
        await startJob({
          command: 'generate-assessments',
          courseSlug: missing[0].courseSlug,
          classSlug: state.selectedClassSlug
        });
      }
    }

    async function onModuleAction(action, moduleSlug) {
      if (!state.selectedClassSlug || !moduleSlug) return;
      const module = (state.classSummary?.modules || []).find(row => row.slug === moduleSlug);
      if (action === 'open-course') {
        if (!module?.hasCoursePlan) return;
        await selectCourse(module.courseSlug);
        return;
      }
      if (action === 'plan-module') {
        if (module?.hasCoursePlan && !confirm(`Replan "${module.title}"? This overwrites the course plan.`)) return;
        await startJob({
          command: 'plan-module',
          classSlug: state.selectedClassSlug,
          moduleSlug
        });
        return;
      }
      if (action === 'generate-assessments') {
        if (!module?.hasCoursePlan) return;
        if (module.hasAssessments && !confirm(`Regenerate tests for "${module.title}"?`)) return;
        await startJob({
          command: 'generate-assessments',
          courseSlug: module.courseSlug,
          classSlug: state.selectedClassSlug
        });
        return;
      }
      if (action === 'take-tests') {
        if (!module?.hasAssessments) return;
        await openTestViewer(module.courseSlug, module.title);
      }
    }

            <button data-action="assessments">${state.summary.hasAssessments ? 'Regenerate tests' : 'Generate tests'}</button>
            <button data-action="take-pre" ${state.summary.hasAssessments ? '' : 'disabled title="Generate tests first"'}>Take pre-test</button>
            <button data-action="take-post" ${state.summary.hasAssessments ? '' : 'disabled title="Generate tests first"'}>Take post-test</button>
          </div>
          <div class="row">
            <button data-action="publish">Upload draft</button>
            <button data-action="go-live">Go live</button>
          </div>
          <div class="row">
            <button data-action="status">Refresh status</button>
            <button data-action="open-folder">Open folder</button>
          </div>
          <details>
            <summary>Extend plan</summary>
            <p class="meta" style="margin:0.5rem 0 0.75rem; font-size:0.82rem; color:var(--muted);">
              Planner proposes the next module from the existing syllabus. Optional hints below steer it.
            </p>
            <form class="plan-form" id="extendForm" style="margin-top:0.25rem;">
              <label>Topic hint (optional)
                <input name="topic" placeholder="Leave blank to let the planner decide" />
              </label>
              <label>Scope hint (optional)
                <textarea name="scope" placeholder="Narrow the addition if you have a preference"></textarea>
              </label>
              <label>Module title hint (optional)
                <input name="moduleTitle" placeholder="Applications of Logarithms" />
              </label>
              <label>Placement
                <select name="placement">
                  <option value="auto" selected>Auto</option>
                  <option value="append-last">Append to last module</option>
                  <option value="new-module">Create new module</option>
                </select>
              </label>
              <label>New lectures
                <input name="lectures" type="number" min="1" max="27" value="3" />
              </label>
              <label class="checkbox"><input type="checkbox" name="dryRun" /> Dry run (print prompts only)</label>
              <button class="primary" type="submit">Extend plan</button>
            </form>
          </details>
          <details>
            <summary>Advanced options</summary>
            <div class="advanced-grid">
              <label>Target lecture slug<input id="forceLecture" placeholder="lecture-slug" /></label>
              <label>Script lecture slug<input id="scriptLecture" placeholder="optional" /></label>
              <label>Budget override<input id="runBudget" type="number" min="1" step="0.5" placeholder="${budget}" /></label>
              <label>Model<input id="runModel" placeholder="${escapeHtml(state.meta?.defaultModel || '')}" /></label>
              <label>Max turns<input id="maxTurns" type="number" min="1" value="60" /></label>
              <label>Practice turns<input id="maxPracticeTurns" type="number" min="1" value="40" /></label>
              <label>Lecture timeout (min)<input id="lectureTimeout" type="number" min="1" value="20" /></label>
              <label>TTS voice<input id="ttsVoice" placeholder="${escapeHtml(state.meta?.defaultTtsVoice || 'Leda')} (default)" /></label>
            </div>
            <div style="margin-top:0.65rem; display:grid; gap:0.35rem;">
              <label class="checkbox"><input type="checkbox" id="renderMp4" /> After run/resume, render MP4 too (still regenerates targeted lectures)</label>
              <label class="checkbox"><input type="checkbox" id="skipPracticeReview" /> Skip practice screenshot QA</label>
              <label class="checkbox"><input type="checkbox" id="skipScriptReview" /> Skip script review</label>
              <label class="checkbox"><input type="checkbox" id="noReview" /> Script lab: skip review</label>
              <label class="checkbox"><input type="checkbox" id="dryRunAction" /> Dry run</label>
            </div>
          </details>
        </div>
      `;

      els.leftPanel.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => onAction(button.dataset.action));
      });
      document.getElementById('extendForm')?.addEventListener('submit', onExtendSubmit);

      els.rightPanel.innerHTML = `
        <h3 class="section-title">Lectures</h3>
        <div class="lectures">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Status</th>
                <th>Cost</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${lectures.map(lecture => {
                const canRender = Boolean(lecture.renderReady);
                const canRetryPractice = Boolean(lecture.canRetryPractice);
                const canRepairPractice = Boolean(lecture.canRepairPractice);
                const canEdit = Boolean(lecture.canEditVideo || lecture.canEditInteractive || lecture.canEditGame);
                const isFailed = lecture.status === 'failed';
                const needsPracticeReview = lecture.status === 'needs-review';
                const regenAction = isFailed ? 'retry' : 'run';
                const regenLabel = isFailed ? 'Retry' : 'Run';
                return `
                <tr>
                  <td>${lecture.order}</td>
                  <td>
                    <div>${escapeHtml(lecture.title)}</div>
                    <div class="plan-lec-meta">${escapeHtml(lecture.slug)}</div>
                    ${lecture.error ? `<div class="plan-lec-meta" style="color:var(--bad);">${escapeHtml(lecture.error.split('\n')[0])}</div>` : ''}
                    ${lecture.renderReady ? `<div class="plan-lec-meta">resolved, no MP4 yet</div>` : ''}
                    ${lecture.hasMp4 ? `<div class="plan-lec-meta" style="color:var(--ok);">MP4 ready</div>` : ''}
                  </td>
                  <td><span class="badge ${badgeClass(lecture.status)}">${escapeHtml(lecture.status)}</span></td>
                  <td>$${Number(lecture.costUsd || 0).toFixed(2)}</td>
                  <td>
                    <div class="lecture-actions">
                      <button type="button" data-lecture-action="edit" data-slug="${escapeHtml(lecture.slug)}"${canEdit ? '' : ' disabled title="Needs existing video, interactive, or game HTML"'}>Edit</button>
                      <button type="button" ${isFailed ? 'class="primary"' : ''} data-lecture-action="${regenAction}" data-slug="${escapeHtml(lecture.slug)}">${regenLabel}</button>
                      <button type="button" ${needsPracticeReview ? 'class="primary"' : ''} data-lecture-action="repair-practice" data-slug="${escapeHtml(lecture.slug)}"${canRepairPractice ? '' : ' disabled title="Needs an existing interactive or game HTML file"'}>Repair practice</button>
                      <button type="button" data-lecture-action="retry-practice" data-slug="${escapeHtml(lecture.slug)}"${canRetryPractice ? '' : ' disabled title="Needs a generated lecture folder with interactive or game"'}>Retry practice</button>
                      <button type="button" data-lecture-action="render" data-slug="${escapeHtml(lecture.slug)}"${canRender ? '' : ' disabled title="Needs resolved HTML with no MP4 yet"'}>Render</button>
                    </div>
                  </td>
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        </div>
        ${renderPlanView(plan)}
        <p class="meta" style="margin-top:0.75rem;">Folder: ${escapeHtml(courseDir)}</p>
      `;

      els.rightPanel.querySelector('.lectures')?.addEventListener('click', event => {
        const button = event.target.closest('[data-lecture-action]');
        if (!button || button.disabled) return;
        onLectureAction(button.dataset.lectureAction, button.dataset.slug);
      });
    }

    function renderPlanView(plan) {
      if (!plan?.modules?.length) {
        return `
          <details class="plan-view">
            <summary>Course plan</summary>
            <p class="meta" style="margin:0.65rem 0 0;">No modules in plan.</p>
          </details>
        `;
      }
      const desc = String(plan.description || '').trim();
      const summary = String(plan.summary || '').trim();
      const showDescription = desc && desc !== summary;
      const modulesHtml = plan.modules.map(mod => `
        <div class="plan-module">
          <h4>${escapeHtml(mod.title)}</h4>
          <ul>
            ${(mod.lectures || []).map(lec => `
              <li>
                <strong>${escapeHtml(lec.title)}</strong>
                <span class="plan-lec-meta">${escapeHtml(lec.slug)} · ${Number(lec.durationMinutes)} min · ${escapeHtml((lec.formats || []).join(', '))}</span>
                <div>${escapeHtml(lec.objective || '')}</div>
                ${Array.isArray(lec.sourceSections) && lec.sourceSections.length
                  ? `<div class="plan-note">Sources: ${escapeHtml(lec.sourceSections.join(', '))}</div>`
                  : ''}
                ${lec.promptNotes
                  ? `<div class="plan-note">${escapeHtml(lec.promptNotes)}</div>`
                  : ''}
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
      return `
        <details class="plan-view">
          <summary>Course plan</summary>
          ${showDescription ? `<p class="plan-description">${escapeHtml(desc)}</p>` : ''}
          ${modulesHtml}
        </details>
      `;
    }

    function readAdvanced() {
      const val = id => document.getElementById(id)?.value?.trim();
      const num = id => {
        const raw = val(id);
        return raw ? Number(raw) : undefined;
      };
      return {
        forceLecture: val('forceLecture') || undefined,
        lecture: val('scriptLecture') || undefined,
        budget: num('runBudget'),
        model: val('runModel') || undefined,
        maxTurns: num('maxTurns'),
        maxPracticeTurns: num('maxPracticeTurns'),
        lectureTimeout: num('lectureTimeout'),
        ttsVoice: val('ttsVoice') || undefined,
        skipPracticeReview: document.getElementById('skipPracticeReview')?.checked || false,
        skipScriptReview: document.getElementById('skipScriptReview')?.checked || false,
        noReview: document.getElementById('noReview')?.checked || false,
        dryRun: document.getElementById('dryRunAction')?.checked || false,
        render: document.getElementById('renderMp4')?.checked || false
      };
    }

    async function onExtendSubmit(event) {
      event.preventDefault();
      if (!state.selectedSlug) return;
      const form = event.target;
      const body = {
        command: 'extend',
        courseSlug: state.selectedSlug,
        topic: form.topic.value.trim() || undefined,
        scope: form.scope.value.trim() || undefined,
        moduleTitle: form.moduleTitle.value.trim() || undefined,
        placement: form.placement.value || 'auto',
        lectures: Number(form.lectures.value || 3),
        dryRun: form.dryRun.checked
      };
      if (!confirm('Extend this course? The planner will propose the next module from the existing syllabus.')) return;
      await startJob(body);
    }

    function buildJobBody(advanced, overrides = {}) {
      return {
        courseSlug: state.selectedSlug,
        yes: true,
        ...advanced,
        ...overrides
      };
    }

    function stripRenderOnlyFlags(body) {
      delete body.render;
      delete body.skipPracticeReview;
      delete body.skipScriptReview;
      return body;
    }

    function closeEditOverlay() {
      const overlay = document.getElementById('editOverlay');
      if (!overlay) return;
      overlay.classList.remove('open');
      overlay.hidden = true;
      state.editLectureSlug = null;
      const promptInput = document.getElementById('editPromptInput');
      if (promptInput) promptInput.value = '';
    }

    function openEditOverlay(slug) {
      const lecture = (state.summary?.lectures || []).find(row => row.slug === slug);
      if (!lecture) return;
      const canVideo = Boolean(lecture.canEditVideo);
      const canInteractive = Boolean(lecture.canEditInteractive);
      const canGame = Boolean(lecture.canEditGame);
      if (!canVideo && !canInteractive && !canGame) return;

      state.editLectureSlug = slug;
      const overlay = document.getElementById('editOverlay');
      const title = document.getElementById('editTitle');
      const subtitle = document.getElementById('editSubtitle');
      const select = document.getElementById('editTargetSelect');
      if (!overlay || !title || !subtitle || !select) return;

      title.textContent = `Edit: ${lecture.title}`;
      subtitle.textContent = `${slug} — applies your instruction to existing HTML via EditorAgent (no full regeneration).`;

      for (const option of select.options) {
        const enabled =
          (option.value === 'video' && canVideo) ||
          (option.value === 'interactive' && canInteractive) ||
          (option.value === 'game' && canGame);
        option.disabled = !enabled;
      }
      const firstEnabled = Array.from(select.options).find(option => !option.disabled);
      if (firstEnabled) select.value = firstEnabled.value;

      overlay.hidden = false;
      overlay.classList.add('open');
      document.getElementById('editPromptInput')?.focus();
    }

    async function submitEditOverlay() {
      const slug = state.editLectureSlug;
      if (!slug) return;
      const lecture = (state.summary?.lectures || []).find(row => row.slug === slug);
      const target = document.getElementById('editTargetSelect')?.value;
      const prompt = document.getElementById('editPromptInput')?.value?.trim() || '';
      if (!target || !prompt) {
        alert('Choose a target and enter a non-empty instruction.');
        return;
      }
      if (!lecture) return;
      const canVideo = Boolean(lecture.canEditVideo);
      const canInteractive = Boolean(lecture.canEditInteractive);
      const canGame = Boolean(lecture.canEditGame);
      if (
        (target === 'video' && !canVideo) ||
        (target === 'interactive' && !canInteractive) ||
        (target === 'game' && !canGame)
      ) {
        alert('That edit target is not available for this lecture.');
        return;
      }
      const title = lecture.title || slug;
      if (!confirm(
        `Edit "${title}" (${slug})?\n\n` +
        `Target: ${target}. EditorAgent will edit the existing HTML — it does not regenerate from scratch.`
      )) return;

      const advanced = readAdvanced();
      const command = state.summary?.state ? 'resume' : 'run';
      closeEditOverlay();
      await startJob(buildJobBody(advanced, {
        forceLecture: slug,
        editTarget: target,
        editPrompt: prompt,
        command,
        render: false
      }));
    }

    async function onLectureAction(action, slug) {
      if (!state.selectedSlug || !slug) return;
      const lecture = (state.summary?.lectures || []).find(row => row.slug === slug);
      const title = lecture?.title || slug;
      const advanced = readAdvanced();

      if (action === 'edit') {
        openEditOverlay(slug);
        return;
      }

      if (action === 'repair-practice') {
        if (!lecture?.canRepairPractice) return;
        if (!confirm(
          `Repair practice for "${title}" (${slug})?\n\n` +
          `Keeps the current interactive/game HTML. Runs QA, then one IAGen/GameGen edit pass if it fails.\n\n` +
          `Video files stay in place. Use Retry practice only if you want a brand-new page.`
        )) return;
        const command = state.summary?.state ? 'resume' : 'run';
        await startJob(buildJobBody(advanced, {
          forceLecture: slug,
          practiceRepair: true,
          practiceOnly: false,
          command,
          render: false
        }));
        return;
      }

      if (action === 'retry-practice') {
        if (!lecture?.canRetryPractice) return;
        if (!confirm(
          `Retry practice for "${title}" (${slug})?\n\n` +
          `This deletes activities/interactive and activities/game (and root interactive.html/game.html), then regenerates them with IAGen/GameGen.\n\n` +
          `Video HTML, audio, and MP4 are left alone.`
        )) return;
        const command = state.summary?.state ? 'resume' : 'run';
        await startJob(buildJobBody(advanced, {
          forceLecture: slug,
          practiceOnly: true,
          command,
          render: false
        }));
        return;
      }

      if (action === 'run' || action === 'retry') {
        const renderNote = advanced.render ? '\n\nThen it will also render MP4.' : '';
        const isRetry = action === 'retry' || lecture?.status === 'failed';
        const confirmText = isRetry
          ? `Retry "${title}" (${slug})?\n\n` +
            `This regenerates the failed lecture from scratch (deletes its HTML, audio, and MP4) and ignores attempt/budget caps.\n\n` +
            `Use Render if the lecture already resolved and you only want MP4.` +
            renderNote
          : `FULL REGEN for "${title}" (${slug})?\n\n` +
            `This deletes existing index.html, resolved.html, audio, and MP4 for this lecture, then regenerates from scratch.\n\n` +
            `It ignores attempt/budget caps. Use Render if you only want MP4 from existing resolved HTML.` +
            renderNote;
        if (!confirm(confirmText)) return;
        const command = state.summary?.state ? 'resume' : 'run';
        await startJob(buildJobBody(advanced, { forceLecture: slug, command }));
        return;
      }

      if (action === 'render') {
        if (!lecture?.renderReady) return;
        if (!confirm(`Render MP4 for "${title}" only?`)) return;
        await startJob(stripRenderOnlyFlags(buildJobBody(advanced, {
          forceLecture: slug,
          command: 'render'
        })));
      }
    }

    async function onAction(action) {
      if (!state.selectedSlug) return;
      const advanced = readAdvanced();

      if (action === 'status') {
        await loadSummary(state.selectedSlug);
        return;
      }
      if (action === 'open-folder') {
        await api(`/api/open-folder/${encodeURIComponent(state.selectedSlug)}`);
        return;
      }
      if (action === 'take-pre' || action === 'take-post') {
        if (!state.summary?.hasAssessments) return;
        await openTestViewer(
          state.selectedSlug,
          state.summary.plan?.title || state.selectedSlug,
          action === 'take-post' ? 'post' : 'pre'
        );
        return;
      }
      const renderReadyCount = state.summary?.progress?.renderReady ?? 0;
      const messages = {
        run: 'Start full course generation? This can take a long time and spend API budget.',
        resume: advanced.forceLecture
          ? `Resume will regenerate "${advanced.forceLecture}"${advanced.render ? ' and then render MP4' : ''}. Use the Render MP4 button for render-only. Continue?`
          : 'Resume generation and retry failed lectures?',
        render: `Render MP4 from existing resolved HTML only (no re-resolve)? ${renderReadyCount} lecture(s) ready.`,
        script: 'Run script lab for this course?',
        assessments: 'Generate pre/post tests from this course plan?',
        publish: 'Upload course as a draft to the website package?',
        'go-live': 'Publish this course live? Finished lectures go on the catalog; unfinished ones stay off until they are done.'
      };
      if (!confirm(messages[action] || 'Run this action?')) return;

      const body = buildJobBody(advanced);

      if (action === 'run') body.command = 'run';
      else if (action === 'resume') body.command = 'resume';
      else if (action === 'render') {
        body.command = 'render';
        stripRenderOnlyFlags(body);
      }
      else if (action === 'script') body.command = 'script';
      else if (action === 'assessments') body.command = 'generate-assessments';
      else if (action === 'publish') body.command = 'publish';
      else if (action === 'go-live') {
        body.command = 'publish';
        body.goLive = true;
      }

      await startJob(body);
    }

    async function startJob(body) {
      if (body.command === 'plan-class') {
        state.classSlugsBeforeJob = (state.classes || []).map(item => item.slug);
      }
      const job = await api('/api/jobs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      state.activeJobId = job.id;
      state.activeJobCommand = job.command || body.command || null;
      setLog(job.log || []);
      els.stopJobBtn.disabled = job.status !== 'running' && job.status !== 'queued';
      startPolling();
    }

    async function pollJob() {
      if (!state.activeJobId) return;
      try {
        const job = await api(`/api/jobs/${encodeURIComponent(state.activeJobId)}`);
        setLog(job.log || []);
        els.stopJobBtn.disabled = job.status !== 'running';

        if (job.status === 'running' || job.status === 'queued') {
          if (state.selectedSlug) await loadSummary(state.selectedSlug);
          if (state.selectedClassSlug) await loadClassSummary(state.selectedClassSlug);
          await loadCourses();
          await loadClasses();
          return;
        }

        stopPolling();
        await loadCourses();
        if (job.command === 'ingest' || state.activeJobCommand === 'ingest') {
          await loadSources();
          showIngestForm();
        }
        await loadClasses();
        if (job.command === 'plan-class' || state.activeJobCommand === 'plan-class') {
          const known = new Set(state.classSlugsBeforeJob || []);
          const classSlug = job.classSlug
            || state.classes.find(item => !known.has(item.slug))?.slug
            || state.selectedClassSlug;
          if (classSlug) {
            await selectClass(classSlug);
            return;
          }
        }
        if (job.classSlug && (job.command === 'plan-module' || job.command === 'generate-assessments')) {
          await selectClass(job.classSlug);
          return;
        }
        if (job.courseSlug) {
          state.selectedSlug = job.courseSlug;
          await loadSummary(job.courseSlug);
        } else if (state.selectedSlug) {
          await loadSummary(state.selectedSlug);
        } else if (state.selectedClassSlug) {
          await loadClassSummary(state.selectedClassSlug);
        }
      } catch (error) {
        appendLog(`Poll error: ${error.message}`);
      }
    }

    function startPolling() {
      stopPolling();
      state.pollTimer = setInterval(pollJob, 2000);
      pollJob();
    }

    function stopPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    els.stopJobBtn.addEventListener('click', async () => {
      if (!state.activeJobId) return;
      await api(`/api/jobs/${encodeURIComponent(state.activeJobId)}/stop`, { method: 'POST' });
      await pollJob();
    });

    els.testOverlay.addEventListener('click', event => {
      if (event.target === els.testOverlay) closeTestViewer();
    });
    document.getElementById('editOverlay')?.addEventListener('click', event => {
      if (event.target === document.getElementById('editOverlay')) closeEditOverlay();
    });
    document.getElementById('editCancelBtn')?.addEventListener('click', closeEditOverlay);
    document.getElementById('editApplyBtn')?.addEventListener('click', () => { void submitEditOverlay(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        if (state.editLectureSlug) closeEditOverlay();
        else if (state.testViewer) closeTestViewer();
      }
    });
    els.clearLogBtn.addEventListener('click', () => setLog([]));
    els.refreshCoursesBtn.addEventListener('click', async () => {
      await Promise.all([loadCourses(), loadClasses()]);
      if (state.selectedClassSlug) await loadClassSummary(state.selectedClassSlug);
      else if (state.selectedSlug) await loadSummary(state.selectedSlug);
    });
    els.classesTabBtn.addEventListener('click', () => setSidebar('classes'));
    els.coursesTabBtn.addEventListener('click', () => setSidebar('courses'));
    els.newClassBtn.addEventListener('click', async () => {
      await loadSources();
      showClassPlanForm();
    });
    els.newCourseBtn.addEventListener('click', async () => {
      await loadSources();
      showPlanForm();
    });
    els.addReferenceBtn.addEventListener('click', async () => {
      await loadSources();
      showIngestForm();
    });

    async function boot() {
      try {
        await loadMeta();
        await Promise.all([loadCourses(), loadClasses()]);
        let savedClass = '';
        let savedCourse = '';
        try {
          savedClass = localStorage.getItem('coursegen.selectedClass') || '';
          savedCourse = localStorage.getItem('coursegen.selectedCourse') || '';
        } catch {
          savedClass = '';
          savedCourse = '';
        }
        if (savedClass && state.classes.some(item => item.slug === savedClass)) {
          await selectClass(savedClass);
        } else if (state.classes.length) {
          await selectClass(state.classes[0].slug);
        } else if (savedCourse && state.courses.some(item => item.slug === savedCourse)) {
          await selectCourse(savedCourse);
        } else if (state.courses.length) {
          await selectCourse(state.courses[0].slug);
        } else {
          showClassPlanForm();
        }
      } catch (error) {
        els.heroPanel.innerHTML = `<div class="empty">Failed to connect: ${escapeHtml(error.message)}</div>`;
      }
    }

    boot();
  </script>
</body>
</html>
