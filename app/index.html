<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyLecture</title>
<meta http-equiv="Content-Security-Policy" content="default-src mylecture: data: blob:; script-src mylecture: 'unsafe-eval'; style-src mylecture: 'unsafe-inline'; img-src mylecture: data: blob:; media-src mylecture: data: blob:; font-src mylecture: data:; worker-src mylecture: blob:; frame-src mylecture:; connect-src mylecture: data: blob:">
<link rel="stylesheet" href="css/app.css">
<script src="shared/timeline.js"></script>
<script src="vendor/markdown-it/markdown-it.min.js"></script>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="rail-logo" title="MyLecture"><img src="assets/icon.png" alt=""></div>
    <button class="rail-btn" data-view="study" title="Study">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/></svg>
      <span>Study</span>
    </button>
    <button class="rail-btn" data-view="create" title="Create">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3V9Z"/></svg>
      <span>Create</span>
    </button>
    <button class="rail-btn" data-view="library" title="Library">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Library</span>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-view="settings" title="Settings (Ctrl+,)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      <span>Settings</span>
    </button>
  </nav>
  <div id="workspace">
  <main id="views">
    <section id="view-study" class="view"></section>
    <section id="view-create" class="view"></section>
    <section id="view-library" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
  </div>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
